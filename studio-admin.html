<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1E36">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://naijabiz.b-cdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'">
<title>Business Studio Admin — Auntie Tobi</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/admin-icon-32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/admin-icon-16.png?v=1">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/admin-icon-48.png?v=1">
<link rel="apple-touch-icon" href="/icons/admin-icon-180.png?v=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#057A44;--green-d:#04613A;--green-l:#E3F2EA;--gold:#FFB81C;--gold-l:#FFF1CF;--navy:#0F1E36;--navy-2:#1C2E4D;--cream:#FBF6EC;--line:#EADFC8;--muted:#5B6475;--danger:#B3261E;--danger-l:#FCE8E6;--font:'DM Sans',-apple-system,Segoe UI,Roboto,sans-serif;--display:'Fraunces',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--navy);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden,[hidden]{display:none!important}
header{background:var(--navy);color:var(--cream);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
header b{font-family:var(--display);font-size:18px}
header small{color:var(--gold);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
header .sp{flex:1}
header button{color:var(--cream);font-size:13px;opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:52px;z-index:9}
nav button{padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
nav button[aria-current=page]{background:var(--navy);color:var(--cream)}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-family:var(--display);font-size:24px;margin-bottom:12px}
h2{font-family:var(--display);font-size:18px;margin:20px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.stat b{display:block;font-family:var(--display);font-size:28px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:10px 14px;font-weight:700;min-height:42px}
.btn.primary{background:var(--green);color:#fff}.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{border:1.5px solid var(--line);background:#fff}.btn.small{min-height:32px;padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(5,122,68,.15)}
label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#F7F1E3;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FFFCF5}
.tw{overflow-x:auto;border-radius:14px}
.bzp{display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:12px;padding:11px 12px;font-size:14px;line-height:1.4}
.bzp-on{background:#E7F5EE;border:1.5px solid #9ED7B8}.bzp-on b{color:#04603a}.bzp-none{background:#F6F2EA;border:1.5px dashed #E0D6C2;color:#5B6475}
.bzp-m{color:#6B7280}.bzp-act{display:flex;gap:12px;align-items:center;flex-shrink:0}.bzp-act a{color:#057A44;font-weight:700;font-size:13px}
.bzp-link{background:none;border:0;color:#057A44;font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.bzp-s{display:flex;flex-direction:column;gap:8px}.bzp-s .bzp-link{align-self:flex-start}
.bzp-res{display:flex;flex-direction:column;gap:6px}.bzp-r{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fff;border:1.5px solid #E6E1D6;border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;color:#0F1E36}
.bzp-r:hover,.bzp-r:focus{border-color:#057A44}.bzp-r b{font-size:14.5px}.bzp-r span{font-size:12.5px;color:#6B7280}.bzp-empty{font-size:13px;color:#6B7280}
.mkc{width:250px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.mkc-img{position:relative;height:160px;background:#f8f8f8;display:flex;align-items:center;justify-content:center}.mkc-img img{width:100%;height:100%;object-fit:contain;padding:6px}
.mkc-cat{position:absolute;top:0;left:0;background:#057A44;color:#fff;font-size:10px;font-weight:700;padding:4px 9px;border-radius:0 0 10px 0;text-transform:uppercase}
.mkc-n{position:absolute;top:6px;right:6px;background:rgba(15,30,54,.75);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px}
.mkc-b{padding:10px 12px 12px;font-size:13px;display:flex;flex-direction:column;gap:3px}.mkc-d{color:#555;font-size:12.5px;line-height:1.45}.mkc-p{font-weight:800;font-size:15px}
.mkc-btn{margin-top:4px;background:#057A44;color:#fff;border-radius:8px;padding:8px;font-weight:700;text-align:center;font-size:12.5px}
.td-list{padding:4px 14px}.td{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.td:last-child{border-bottom:0}
.td-check{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:2px solid var(--green);background:#fff;color:#fff;font-weight:800;cursor:pointer;margin-top:1px}
a.btn.ig{text-decoration:none;color:var(--navy);display:inline-flex;align-items:center}
.td-check.td-share{width:auto;min-width:38px;padding:0 8px;border-radius:14px;color:var(--green);font-size:13px}.td-check.td-share:hover{background:var(--green);color:#fff}
.td-done .td-check{background:var(--green)}.td-done .td-b b{text-decoration:line-through;color:var(--muted)}.td-late{background:#FFF7F6;margin:0 -14px;padding:11px 14px}
.td-b{flex:1;min-width:0}.td-m{font-size:12.5px;margin-top:2px}.tdbar{height:8px;background:#E7EDE9;border-radius:99px;overflow:hidden;margin:10px 0 4px}.tdbar span{display:block;height:100%;background:var(--green)}
.note{background:var(--green-l);border:1px solid #CFEBDB;border-radius:14px;padding:12px 14px;line-height:1.5}
.iv{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.iv:last-child{border-bottom:0}
.iv-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.iv-h b{font-size:16px}
.iv-next{font-size:13px;color:var(--muted)}.iv-next.due{color:var(--danger);font-weight:700}
.iv a.btn{text-decoration:none;color:var(--navy)}.iv a.btn.primary{color:#fff}
.iv-em{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;margin:0 0 8px}.iv-em .iv-addr{font-weight:600;word-break:break-all}
.iv-bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card,#fff);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:14px}.iv-bulk>span{flex:1;min-width:200px}
.iv-sent{background:var(--gold-l);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--navy)}.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.p-active{background:var(--green-l);color:var(--green-d)}.p-pending{background:var(--gold-l);color:#7A5300}.p-inactive,.p-expired{background:#ECEDF0;color:var(--muted)}
.p-power{background:var(--gold);color:var(--navy)}.pill .over{background:var(--green-d);color:#fff;border-radius:999px;padding:0 5px;margin-left:2px;font-size:11px}.p-warn{background:var(--danger-l);color:var(--danger)}
.muted{color:var(--muted);font-size:13px}
.err{background:var(--danger-l);color:var(--danger);border-radius:10px;padding:9px 11px;font-weight:500}
.warn{background:var(--gold-l);border-radius:10px;padding:10px 12px}
.bar{height:6px;background:#EEE6D3;border-radius:999px;overflow:hidden;min-width:70px}
.bar span{display:block;height:100%;background:var(--green)}
.scrim{position:fixed;inset:0;background:rgba(15,30,54,.55);display:flex;align-items:center;justify-content:center;z-index:30;padding:12px}
.sheet{background:var(--cream);border-radius:16px;padding:18px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.login{max-width:380px;margin:60px auto;padding:0 16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 16px;border-radius:10px;z-index:40}
.nbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#E5484D;color:#fff;font-size:11.5px;font-weight:800;margin-left:4px}
.mwrap{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:12px;height:calc(100vh - 210px);min-height:460px}
.mside{display:flex;flex-direction:column;min-height:0}.mrows{overflow:auto;flex:1;margin:0 -6px}
.mrow{display:block;width:100%;text-align:left;padding:10px;border-radius:10px;border:0;background:none;font:inherit;color:inherit;cursor:pointer}.mrow:hover{background:var(--cream)}.mrow.on{background:var(--green-l)}
.mrow.un .mname,.mrow.un .mprev{font-weight:800;color:var(--navy)}
.mname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mprev{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mpane{display:flex;flex-direction:column;min-height:0;padding:0}
.mempty{margin:auto;text-align:center;padding:30px}
.mph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.mpane .mlist{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--cream)}
.bub{max-width:75%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;word-wrap:break-word}.bub .bt{white-space:pre-wrap}.bub .bm{font-size:11px;opacity:.7;margin-top:3px;text-align:right}
.bub.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:5px}.bub.me a{color:#fff}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.mqr{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--line)}
.mpane .mcomp{display:flex;gap:8px;align-items:flex-end;padding:10px 16px;border-top:1px solid var(--line)}.mpane .mcomp textarea{flex:1;resize:vertical;min-height:46px}
@media(max-width:760px){.mwrap{grid-template-columns:1fr;height:auto}.mrows{max-height:40vh}.mpane{min-height:70vh}}
</style>
</head>
<body>
<header><div><b>Business Studio Admin</b><br><small>Auntie Tobi Business Club</small></div><div class="sp"></div><span id="who" class="muted" style="color:#cfd6e2"></span><button id="logout" class="hidden">Sign out</button></header>
<nav id="nav" class="hidden">
  <button data-v="today">Today</button><button data-v="messages">Messages <span class="nbadge hidden" id="msgBadge"></span></button><button data-v="overview">Overview</button><button data-v="members">Members</button><button data-v="benefits">Benefits</button><button data-v="market">Marketplace</button><button data-v="invites">Club invites</button><button data-v="subs">Business Studio Pro</button>
  <button data-v="usage">Usage &amp; costs</button><button data-v="settings">Allowances &amp; limits</button><button data-v="alerts">Alerts</button><button data-v="audit">Activity log</button><button data-v="resources">Resources</button>
</nav>
<div id="app"></div>
<script>
'use strict';
(function () {
  var app = document.getElementById('app');
  var S = { overview: null, members: null, month: null };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function undoToast(m, onUndo) {
    var t = document.createElement('div'); t.className = 'toast'; t.style.display = 'flex'; t.style.gap = '12px'; t.style.alignItems = 'center';
    t.innerHTML = '<span></span><button class="btn small" style="background:var(--gold);color:var(--navy);border:0">Undo</button>';
    t.firstChild.textContent = m; document.body.appendChild(t);
    var gone = setTimeout(function () { t.remove(); }, 6000);
    t.lastChild.onclick = function () { clearTimeout(gone); t.remove(); onUndo(); };
  }
  function toast(m) { $$('.toast').forEach(function (x) { x.remove(); }); var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2500); }
  function d(iso) { return iso ? new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }
  function gbp(usd) { var r = S.overview ? S.overview.settings.usdToGbp : 0.79; return '£' + (usd * r).toFixed(usd * r < 1 ? 3 : 2); }
  function today() { return new Date().toISOString().slice(0, 10); }
  function plusYear() { var x = new Date(); x.setFullYear(x.getFullYear() + 1); return x.toISOString().slice(0, 10); }

  async function api(action, payload) {
    var res = await fetch('/.netlify/functions/studio-admin', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' }, body: JSON.stringify(Object.assign({ action: action }, payload || {})) });
    var data = await res.json().catch(function () { return {}; });
    if (res.status === 401 && action !== 'login-verify') { login(); throw new Error('Please sign in'); }
    if (!res.ok) throw new Error(data.message || 'Something went wrong');
    return data;
  }

  // ── login ──
  function login() {
    $('#nav').classList.add('hidden'); $('#logout').classList.add('hidden'); $('#who').textContent = '';
    app.innerHTML = '<div class="login"><h1>Admin sign in</h1><form class="card stack" id="lf"><div><label for="em">Admin email</label><input id="em" type="email" autocomplete="email" required></div>' +
      '<div id="cw" class="hidden"><label for="cd">6-digit code</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>' +
      '<div class="err hidden" id="le"></div><button class="btn primary" style="width:100%" id="lb">Email me a code</button></form><p class="muted" style="margin-top:10px">Only addresses in STUDIO_ADMIN_EMAILS can sign in.</p></div>';
    var sent = false;
    $('#lf').onsubmit = async function (e) {
      e.preventDefault(); var le = $('#le'); le.classList.add('hidden'); $('#lb').disabled = true;
      try {
        if (!sent) { await api('login-request', { email: $('#em').value }); sent = true; $('#cw').classList.remove('hidden'); $('#lb').textContent = 'Sign in'; $('#cd').focus(); }
        else { await api('login-verify', { email: $('#em').value, code: $('#cd').value }); boot(); }
      } catch (x) { le.textContent = x.message; le.classList.remove('hidden'); }
      $('#lb').disabled = false;
    };
  }

  // ── nav ──
  $$('#nav button').forEach(function (b) { b.onclick = function () { go(b.dataset.v); }; });
  $('#logout').onclick = async function () { try { await api('logout'); } catch (e) {} login(); };
  function go(v) {
    clearInterval(S.msgTimer);
    $$('#nav button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'); });
    ({ today: vToday, overview: vOverview, members: vMembers, subs: vSubs, usage: vUsage, settings: vSettings, alerts: vAlerts, audit: vAudit, resources: vResources, benefits: vBenefits, market: vMarket, invites: vInvites, messages: vMessages })[v]();
  }
  async function boot() {
    try { S.overview = await api('overview'); } catch (e) { return; }
    $('#nav').classList.remove('hidden'); $('#logout').classList.remove('hidden'); $('#who').textContent = S.overview.admin;
    msgBadge(); clearInterval(S.badgeTimer); S.badgeTimer = setInterval(function () { if (!document.hidden) msgBadge(); }, 60000);
    if (location.hash === '#messages') { history.replaceState(null, '', location.pathname); go('messages'); } else go('today');
  }
  async function msgBadge() {
    try { var n = (await api('msg-unread')).unread || 0; var b = $('#msgBadge'); b.textContent = n > 99 ? '99+' : n; b.classList.toggle('hidden', !n); S.msgUnread = n; return n; } catch (e) { return 0; }
  }

  // ── Messages: private chat with each member + announcements ──
  var MSG_AUD = { all: 'All members', club: 'Business Club', pro: 'Business Studio Pro' };
  var MSG_F = [['inbox', 'Inbox'], ['unread', 'Unread'], ['done', 'Done'], ['all', 'All']];
  function mTime(iso) {
    var x = new Date(iso), n = new Date(), t = x.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (x.toDateString() === n.toDateString()) return t;
    var y = new Date(n); y.setDate(n.getDate() - 1); if (x.toDateString() === y.toDateString()) return 'Yesterday ' + t;
    return x.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' ' + t;
  }
  function mLink(t) { return esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
  async function vMessages() {
    loading();
    var r; try { r = S.msg = await api('msg-inbox'); } catch (x) { app.innerHTML = '<main><div class="err">' + esc(x.message) + '</div></main>'; return; }
    msgBadge();
    var f = S.msgF || 'inbox', q = (S.msgQ || '').toLowerCase();
    var rows = r.rows.filter(function (x) { return f === 'all' || (f === 'unread' ? x.unreadAdmin > 0 : f === 'done' ? x.done : !x.done); })
      .filter(function (x) { return !q || (x.name + ' ' + x.email + ' ' + x.lastText).toLowerCase().indexOf(q) > -1; });
    var cnt = function (k) { return r.rows.filter(function (x) { return k === 'all' || (k === 'unread' ? x.unreadAdmin > 0 : k === 'done' ? x.done : !x.done); }).length; };
    app.innerHTML = '<main class="msgmain"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h1 style="margin:0">Messages</h1><div class="row"><button class="btn small ghost" id="mNew">✏️ New message</button><button class="btn small gold" id="mAnn">📣 Announcement</button><button class="btn small ghost" id="mWel">👋 Welcome series</button><button class="btn small ghost" id="mQuick">⚡ Quick replies</button></div></div>' +
      '<div class="mwrap"><div class="mside card"><input id="mQ" placeholder="Search members…" value="' + esc(S.msgQ || '') + '"><div class="chips" style="margin:8px 0">' + MSG_F.map(function (x) { return '<button class="chip" data-mf="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + ' (' + cnt(x[0]) + ')</button>'; }).join('') + '</div>' +
        '<div class="mrows">' + (rows.length ? rows.map(function (x) {
          return '<button class="mrow' + (S.msgOpen === x.email ? ' on' : '') + (x.unreadAdmin ? ' un' : '') + '" data-mo="' + esc(x.email) + '"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b class="mname">' + esc(x.name || x.email) + '</b><span class="muted" style="font-size:12px;white-space:nowrap">' + esc(mTime(x.updatedAt)) + '</span></div>' +
            '<div class="row" style="justify-content:space-between;flex-wrap:nowrap;margin-top:2px"><span class="mprev">' + (x.lastFrom === 'admin' ? 'You: ' : '') + esc(x.lastText) + '</span>' + (x.unreadAdmin ? '<span class="nbadge">' + x.unreadAdmin + '</span>' : x.done ? '<span class="muted" style="font-size:12px">✓ Done</span>' : '') + '</div>' +
            '<div class="muted" style="font-size:12px;margin-top:2px">' + esc(x.plan) + (x.name ? ' · ' + esc(x.email) : '') + '</div></button>';
        }).join('') : '<p class="muted" style="padding:10px 4px">' + (f === 'inbox' && !q ? 'No messages yet. When members message you, they show up here.' : 'Nothing here.') + '</p>') + '</div></div>' +

  function uploadFile(f) {
    return new Promise(function (resolve, reject) {
      if (f.size > 3.5 * 1024 * 1024) return reject(new Error('Files must be under 3.5 MB.'));
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('Couldn’t read that file.')); };
      fr.onload = function () { var ext = (f.name.split('.').pop() || '').toLowerCase(), mime = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', csv: 'text/csv', txt: 'text/plain' }[ext];
        if (!mime) return reject(new Error('Upload a PDF, image, Word, Excel, CSV or text file.'));
        var url = String(fr.result).replace(/^data:[^;,]*;base64,/, 'data:' + mime + ';base64,'); api('res-upload', { name: f.name, dataUrl: url }).then(resolve, reject); };
      fr.readAsDataURL(f);
    });
  }

  function statusPill(m) {

    return '<span class="pill p-' + esc(m.status) + '">' + esc(m.status) + '</span>';

      (m.readOnly ? '<span class="pill p-inactive">Read-only</span>' : '<span class="pill p-inactive">No access</span>');

  }

  function bulkAdd() {
    var s = sheet('<h2 style="margin:0">Bulk add members</h2><p class="muted">Paste email addresses separated by commas, spaces or new lines. Existing members are skipped.</p>' +
      '<textarea id="be" rows="6" placeholder="ada@business.co.uk&#10;tunde@shop.com"></textarea>' +
      '<div class="f2"><div><label for="bs">Status</label><select id="bs"><option value="active">Active (approved)</option><option value="pending">Pending approval</option></select></div><div><label for="bx">Membership expires</label><input id="bx" type="date" value="' + plusYear() + '"></div></div>' +
      '<div id="br" class="muted"></div><div class="row"><button class="btn primary" id="bgo">Add members</button><button class="btn ghost" id="bc">Close</button></div>');
    $('#bc', s).onclick = function () { s.remove(); vMembers(); };
    $('#bgo', s).onclick = async function () {
      try { var r = await api('members-import', { emails: $('#be', s).value, status: $('#bs', s).value, membershipExpiresAt: $('#bx', s).value }); $('#br', s).innerHTML = 'Added <b>' + r.added.length + '</b>' + (r.skipped.length ? ' · skipped ' + r.skipped.length + ' (already members): ' + esc(r.skipped.join(', ')) : ''); }
      catch (x) { $('#br', s).textContent = x.message; }
    };
  }

  // ── subscriptions ──
  async function vSubs() {
    loading();
    var r = await api('members-list'); S.members = r.members;
    var list = r.members.filter(function (m) { return m.addon; });
    var live = list.filter(function (m) { return ['active', 'trialing'].indexOf(m.addon.status) > -1; });
    var yearly = live.filter(function (m) { return m.addon.interval === 'year'; }).length, monthly = live.length - yearly;
    app.innerHTML = '<main><h1>Business Studio Pro subscriptions</h1><div class="grid" style="margin-bottom:14px">' +
      stat(live.length, 'Active (' + monthly + ' monthly, ' + yearly + ' yearly)') +
      stat('£' + (monthly * 5 + yearly * 50 / 12).toFixed(2) + '/mo', 'Gross revenue (yearly spread over 12)') +
      stat(live.filter(function (m) { return m.status === 'none'; }).length, 'Not Business Club members') +
      stat(list.filter(function (m) { return m.addon.cancelAtPeriodEnd; }).length, 'Cancelling at period end') +
      stat(list.filter(function (m) { return ['past_due', 'unpaid', 'incomplete'].indexOf(m.addon.status) > -1; }).length, 'Payment problems') + '</div>' +
      '<div class="tw"><table><thead><tr><th>Person</th><th>Business Studio Pro</th><th>Renews / ends</th><th>Business Club</th><th>Today</th></tr></thead><tbody>' +
      (list.length ? list.map(function (m) { return '<tr><td><b>' + esc(m.email) + '</b><div class="muted">' + esc(m.name) + '</div></td><td>' + addonPill(m.addon) + '</td><td>' + d(m.addon.currentPeriodEnd) + '</td><td>' + statusPill(m) + '</td><td>' + m.today.used + ' / ' + m.limit + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="muted">No Business Studio Pro subscriptions yet.</td></tr>') +
      '</tbody></table></div><p class="muted" style="margin-top:8px">Refunds, invoices and payment details are managed in your Stripe dashboard. People switch plan or cancel themselves from Account → Manage subscription.</p></main>';
  }

  // ── usage ──
  async function vUsage(month) {
    loading();
    var o = S.overview = await api('overview');
    month = month || o.month;
    var r = await api('members-list', { month: month });
    var rows = r.members.filter(function (m) { return m.usage.used > 0; }).sort(function (a, b) { return b.usage.used - a.usage.used; });
    var months = o.months.slice().reverse();
    app.innerHTML = '<main><h1>Usage &amp; costs</h1>' +
      '<div class="tw"><table><thead><tr><th>Month</th><th>Generations</th><th>Tokens in / out</th><th>Est. cost</th><th>Avg per generation</th></tr></thead><tbody>' +
      (months.length ? months.map(function (x) { return '<tr><td><button class="btn small ghost" data-m="' + esc(x.month) + '">' + esc(x.month) + '</button></td><td>' + (x.count || 0) + '</td><td>' + (x.inTok || 0).toLocaleString() + ' / ' + (x.outTok || 0).toLocaleString() + '</td><td><b>' + gbp(x.costUsd || 0) + '</b></td><td>' + (x.count ? gbp(x.costUsd / x.count) : '—') + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="muted">No usage yet.</td></tr>') +
      '</tbody></table></div>' +
      '<h2>By member · ' + esc(month) + '</h2><div class="tw"><table><thead><tr><th>Member</th><th>Used</th><th>Limit</th><th>Est. cost</th><th>Top tools</th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (m) { var tools = Object.entries(m.usage.byTool || {}).sort(function (a, b) { return b[1] - a[1]; }).map(function (t) { return esc(t[0]) + ' ' + t[1]; }).join(', '); return '<tr><td>' + esc(m.email) + '</td><td>' + m.usage.used + '</td><td>' + m.limit + '</td><td>' + gbp(m.usage.costUsd || 0) + '</td><td class="muted">' + tools + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="muted">No usage this month.</td></tr>') +
      '</tbody></table></div><p class="muted" style="margin-top:8px">Costs use the AI provider’s reported cost where available, otherwise the token prices in Allowances &amp; limits. GBP uses the exchange rate set there.</p></main>';
    $$('[data-m]').forEach(function (b) { b.onclick = function () { vUsage(b.dataset.m); }; });
  }

  // ── settings ──
  async function vSettings() {
    loading();
    var o = S.overview = await api('overview'); var st = o.settings;
    function f(k, l, hint, step) { return '<div><label for="s_' + k + '">' + esc(l) + '</label><input id="s_' + k + '" type="number" step="' + (step || 1) + '" value="' + esc(st[k]) + '">' + (hint ? '<div class="muted">' + esc(hint) + '</div>' : '') + '</div>'; }
    app.innerHTML = '<main><h1>Allowances &amp; limits</h1><div class="card stack"><h2 style="margin:0">Daily allowances</h2><div class="f2">' +
      f('standardLimit', 'Business Club', 'Generations per day') + f('powerLimit', 'Business Studio Pro', 'Generations per day (with or without Club)') + '</div>' +
      '<p class="muted">A 30-day content plan uses 3 generations; everything else uses 1. Allowances reset at midnight UK time.</p>' +
      '<p class="muted">Changes apply immediately. Per-person custom limits (Members \u2192 Manage) override these.</p></div>' +
      '<div class="card stack" style="margin-top:12px"><h2 style="margin:0">Spending protection</h2><div class="f2">' +
      f('spendWarnGbp', 'Warn me when monthly AI spend reaches (\u00a3)', 'Email + alert at this amount and at double. Never blocks members.', 0.01) +
      f('perMinuteLimit', 'Max generations per member per minute', 'Stops bursts and scripts') + '</div></div>' +
      '<div class="card stack" style="margin-top:12px"><h2 style="margin:0">AI model &amp; pricing</h2><div><label for="s_model">Model</label><input id="s_model" value="' + esc(st.model) + '" placeholder="' + esc(o.config.model) + '"><div class="muted">Leave blank for the default (' + esc(o.config.model) + ').</div></div><div class="f2">' +
      f('inputPricePerMUsd', 'Input price ($ per 1M tokens)', 'Fallback for cost estimates', 0.01) + f('outputPricePerMUsd', 'Output price ($ per 1M tokens)', '', 0.01) + f('usdToGbp', 'USD → GBP rate', '', 0.01) + '</div></div>' +
      '<div class="err hidden" id="serr" style="margin-top:12px"></div><button class="btn primary" id="ssave" style="margin-top:12px">Save settings</button></main>';
    $('#ssave').onclick = async function () {
      var keys = ['standardLimit', 'powerLimit', 'spendWarnGbp', 'perMinuteLimit', 'inputPricePerMUsd', 'outputPricePerMUsd', 'usdToGbp'];
      var settings = { model: $('#s_model').value.trim() }; keys.forEach(function (k) { settings[k] = $('#s_' + k).value; });
      try { await api('settings-save', { settings: settings }); toast('Settings saved'); } catch (x) { $('#serr').textContent = x.message; $('#serr').classList.remove('hidden'); }
    };
  }

  // ── alerts & audit ──
  async function vAlerts() {
    loading();
    var r = await api('alerts-list');
    app.innerHTML = '<main><h1>Alerts</h1>' + (r.alerts.length ? '<div class="stack">' + r.alerts.map(function (a) {
      return '<div class="card row" style="justify-content:space-between;align-items:flex-start"><div><b>' + esc(a.message) + '</b><div class="muted">' + new Date(a.ts).toLocaleString('en-GB') + ' · ' + esc(a.kind) + '</div><div class="muted">' + esc(JSON.stringify(a.detail)) + '</div></div><button class="btn small ghost" data-k="' + esc(a.key) + '">Dismiss</button></div>';
    }).join('') + '</div>' : '<p class="muted">No alerts. Payment problems, duplicate subscriptions and spend-cap pauses appear here.</p>') + '</main>';
    $$('[data-k]').forEach(function (b) { b.onclick = async function () { await api('alert-dismiss', { key: b.dataset.k }); vAlerts(); }; });
  }
  async function vAudit() {
    loading();
    var r = await api('audit-list');
    app.innerHTML = '<main><h1>Activity log</h1><div class="tw"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Details</th></tr></thead><tbody>' +
      r.entries.filter(Boolean).map(function (e) { return '<tr><td>' + new Date(e.ts).toLocaleString('en-GB') + '</td><td>' + esc(e.actor) + '</td><td>' + esc(e.action) + '</td><td class="muted">' + esc(JSON.stringify(e.detail)) + '</td></tr>'; }).join('') +
      '</tbody></table></div></main>';
  }

  boot().catch(login);
})();
</script>
</body>
</html>
