<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Push Notification Tool — Auntie Tobi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0F1E36; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 20px; }
.card { background: white; border-radius: 16px; width: 100%; max-width: 480px; overflow: hidden; }
.header { background: #0F1E36; padding: 16px 20px; display: flex; align-items: center; gap: 10px; }
.header h1 { color: white; font-size: 16px; font-weight: 800; }
.header a { color: #FFB81C; font-size: 13px; margin-left: auto; text-decoration: none; }
.body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
label { font-size: 11px; color: #9CA3AF; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 5px; }
input, textarea { width: 100%; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 9px 11px; font-size: 13px; font-family: inherit; color: #0F1E36; transition: border-color .2s; }
input:focus, textarea:focus { outline: none; border-color: #057A44; }
textarea { resize: vertical; min-height: 80px; }
.types { display: flex; flex-wrap: wrap; gap: 6px; }
.type-btn { padding: 6px 13px; border-radius: 16px; border: 1.5px solid #e0e0e0; font-size: 12px; font-weight: 600; cursor: pointer; background: white; color: #0F1E36; font-family: inherit; transition: all .15s; }
.type-btn.active { background: #057A44; color: white; border-color: #057A44; }
.slug-box { background: #f8f8f8; border-radius: 8px; padding: 10px 13px; display: flex; align-items: center; gap: 8px; }
.slug-text { font-size: 12px; color: #057A44; font-weight: 600; flex: 1; word-break: break-all; }
.copy-btn { font-size: 11px; padding: 4px 10px; border: 1.5px solid #057A44; border-radius: 8px; color: #057A44; background: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
.send-btn { width: 100%; padding: 13px; background: #057A44; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: inherit; }
.send-btn:disabled { opacity: .5; cursor: not-allowed; }
.status { font-size: 12px; text-align: center; color: #9CA3AF; min-height: 20px; }
.divider { border: none; border-top: 1px solid #f0f0f0; }
.section-title { font-size: 13px; font-weight: 700; color: #0F1E36; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <span style="font-size:20px;">🔔</span>
    <h1>Send Push Notification</h1>
    <a href="/">← Back to app</a>
  </div>
  <div class="body">

    <div>
      <label>Notification Title</label>
      <input id="pt-title" type="text" placeholder="e.g. NHS Update" oninput="updateSlug()">
    </div>

    <div>
      <label>Message</label>
      <textarea id="pt-msg" placeholder="Type your notification message..."></textarea>
    </div>

    <div>
      <label>Type</label>
      <div class="types" id="pt-types">
        <button class="type-btn" onclick="setType(this,'tip')">💡 Tip</button>
        <button class="type-btn active" onclick="setType(this,'nhs')">💉 NHS Update</button>
        <button class="type-btn" onclick="setType(this,'news')">📰 News</button>
        <button class="type-btn" onclick="setType(this,'motivation')">💪 Motivation</button>
        <button class="type-btn" onclick="setType(this,'prayer')">🙏 Prayer</button>
      </div>
    </div>

    <hr class="divider">
    <p class="section-title">Landing page options</p>

    <div>
      <label>Source URL <span style="font-weight:400;text-transform:none;">(optional — for Learn More button)</span></label>
      <input id="pt-src" type="url" placeholder="https://www.nhs.uk/...">
    </div>

    <div>
      <label>Suggestion Bubble 1</label>
      <input id="pt-b1" type="text" placeholder="e.g. Am I eligible for the flu vaccine?">
    </div>
    <div>
      <label>Suggestion Bubble 2</label>
      <input id="pt-b2" type="text" placeholder="e.g. Find a Nigerian community near me">
    </div>
    <div>
      <label>Suggestion Bubble 3</label>
      <input id="pt-b3" type="text" placeholder="e.g. What NHS services can I access?">
    </div>

    <hr class="divider">

    <div>
      <label>Generated Short Link</label>
      <div class="slug-box">
        <div class="slug-text" id="pt-slug">auntietobi.co.uk/n/nhs-update</div>
        <button class="copy-btn" onclick="copySlug()">Copy</button>
      </div>
    </div>

    <button class="send-btn" id="pt-send" onclick="sendPush()">🔔 Send Push Notification</button>
    <div class="status" id="pt-status"></div>

  </div>
</div>

<script>
var currentType = 'nhs';
var slugBase = { tip:'tip', nhs:'nhs-update', news:'news', motivation:'motivation', prayer:'prayer' };

function setType(btn, type) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(function(b) {
    b.classList.remove('active');
  });
  btn.classList.add('active');
  updateSlug();
}

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').substring(0, 25);
}

function updateSlug() {
  var title = document.getElementById('pt-title').value;
  var base = slugBase[currentType] || 'update';
  var slug = base + (title ? '-' + slugify(title) : '');
  document.getElementById('pt-slug').textContent = 'auntietobi.co.uk/n/' + slug;
}

function copySlug() {
  var txt = 'https://' + document.getElementById('pt-slug').textContent;
  navigator.clipboard.writeText(txt).then(function() {
    var st = document.getElementById('pt-status');
    st.textContent = '✅ Copied to clipboard!';
    setTimeout(function() { st.textContent = ''; }, 2000);
  });
}

async function sendPush() {
  var title = document.getElementById('pt-title').value.trim();
  var msg   = document.getElementById('pt-msg').value.trim();
  var src   = document.getElementById('pt-src').value.trim();
  var b1    = document.getElementById('pt-b1').value.trim();
  var b2    = document.getElementById('pt-b2').value.trim();
  var b3    = document.getElementById('pt-b3').value.trim();
  var slug  = document.getElementById('pt-slug').textContent.replace('auntietobi.co.uk/n/', '');
  var st    = document.getElementById('pt-status');
  var btn   = document.getElementById('pt-send');

  if (!title) { st.textContent = '⚠️ Please enter a title'; st.style.color = '#e74c3c'; return; }
  if (!msg)   { st.textContent = '⚠️ Please enter a message'; st.style.color = '#e74c3c'; return; }

  btn.disabled = true;
  st.style.color = '#9CA3AF';
  st.textContent = '⏳ Sending...';

  try {
    var res = await fetch('/.netlify/functions/send-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title, message: msg, type: currentType, slug: slug, sourceUrl: src, b1: b1, b2: b2, b3: b3 })
    });
    var data = await res.json();
    if (data.success) {
      st.style.color = '#057A44';
      st.textContent = '✅ Notification sent!'
        + (data.shortUrl ? ' · ' + data.shortUrl : '')
        + (data.github && data.github.added ? ' · Short link saved to _redirects ✅' : '');
    } else {
      st.style.color = '#e74c3c';
      st.textContent = '❌ Error: ' + (data.error || 'Unknown error');
    }
  } catch(e) {
    st.style.color = '#e74c3c';
    st.textContent = '❌ Failed: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
