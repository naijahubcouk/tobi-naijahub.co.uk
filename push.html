<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Push Notification Tool — Auntie Tobi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
  .header { background: #057A44; color: white; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header a { color: rgba(255,255,255,0.8); font-size: 13px; text-decoration: none; margin-left: auto; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: white; border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 12px; font-weight: 700; color: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  input, textarea { width: 100%; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: #0F1E36; outline: none; }
  input:focus, textarea:focus { border-color: #057A44; }
  textarea { height: 80px; resize: none; }
  .types { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .type-btn { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1.5px solid #e0e0e0; background: #f5f5f5; cursor: pointer; color: #0F1E36; }
  .type-btn.active { background: #057A44; border-color: #057A44; color: white; }
  .send-btn { width: 100%; padding: 14px; background: #057A44; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { min-height: 20px; font-size: 13px; margin-top: 10px; font-weight: 600; text-align: center; }
  .slug-label { font-size: 12px; color: #9CA3AF; margin-top: 6px; }
  .slug-val { font-size: 13px; color: #057A44; font-weight: 600; }
</style>
</head>
<body>
<div class="header">
  <span style="font-size:22px">🔔</span>
  <h1>Send Push Notification</h1>
  <a href="/">← Back to app</a>
</div>

<div class="wrap">

  <div class="card">
    <label>Notification Type</label>
    <div class="types">
      <button class="type-btn active" onclick="setType(this,'update')">📢 Update</button>
      <button class="type-btn" onclick="setType(this,'news')">📰 News</button>
      <button class="type-btn" onclick="setType(this,'tip')">💡 Tip</button>
      <button class="type-btn" onclick="setType(this,'event')">🎉 Event</button>
      <button class="type-btn" onclick="setType(this,'business')">🏢 Business</button>
      <button class="type-btn" onclick="setType(this,'motivation')">💪 Motivation</button>
      <button class="type-btn" onclick="setType(this,'prayer')">🙏 Prayer</button>
      <button class="type-btn" onclick="setType(this,'jobs')">💼 Jobs</button>
      <button class="type-btn" onclick="setType(this,'immigration')">🛂 Immigration</button>
      <button class="type-btn" onclick="setType(this,'money')">💷 Money</button>
      <button class="type-btn" onclick="setType(this,'health')">💊 Health</button>
      <button class="type-btn" onclick="setType(this,'housing')">🏠 Housing</button>
    </div>
  </div>

  <div class="card" style="display:flex;flex-direction:column;gap:12px;">
    <div>
      <label>Title *</label>
      <input id="push-title" type="text" placeholder="e.g. New NHS update for Nigerians" oninput="updateSlug()">
    </div>
    <div>
      <label>Message *</label>
      <textarea id="push-message" placeholder="Type your notification message here..."></textarea>
    </div>
    <div>
      <label>Source URL (optional)</label>
      <input id="push-src" type="url" placeholder="https://auntietobi.co.uk/...">
    </div>
    <div>
      <div class="slug-label">Short link preview:</div>
      <div class="slug-val" id="push-slug">auntietobi.co.uk/n/update</div>
    </div>
  </div>

  <div class="card">
    <button class="send-btn" id="push-send" onclick="sendPush()">🔔 Send to All Subscribers</button>
    <div class="status" id="push-status"></div>
  </div>

</div>

<script>
var currentType = 'update';
var slugBase = {
  tip:'tip', update:'update', news:'news', event:'event',
  business:'business', motivation:'motivation', prayer:'prayer',
  jobs:'jobs', immigration:'immigration', money:'money',
  health:'health', housing:'housing'
};

function setType(btn, type) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  updateSlug();
}

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').substring(0,25);
}

function updateSlug() {
  var title = document.getElementById('push-title').value;
  var base = slugBase[currentType] || 'update';
  var slug = base + (title ? '-' + slugify(title) : '');
  document.getElementById('push-slug').textContent = 'auntietobi.co.uk/n/' + slug;
}

async function sendPush() {
  var titleEl = document.getElementById('push-title');
  var msgEl = document.getElementById('push-message');
  var srcEl = document.getElementById('push-src');
  var slugEl = document.getElementById('push-slug');
  var statusEl = document.getElementById('push-status');
  var btnEl = document.getElementById('push-send');

  var title = titleEl.value.trim();
  var message = msgEl.value.trim();
  var sourceUrl = srcEl.value.trim();
  var slug = slugEl.textContent.replace('auntietobi.co.uk/n/', '');

  if (!title) { statusEl.style.color='#e74c3c'; statusEl.textContent='⚠️ Please enter a title'; titleEl.focus(); return; }
  if (!message) { statusEl.style.color='#e74c3c'; statusEl.textContent='⚠️ Please enter a message'; msgEl.focus(); return; }

  btnEl.disabled = true;
  statusEl.style.color = '#9CA3AF';
  statusEl.textContent = '⏳ Sending...';

  try {
    var payload = { title: title, message: message, type: currentType, slug: slug, sourceUrl: sourceUrl };
    console.log('[push] Sending payload:', JSON.stringify(payload));

    var res = await fetch('/.netlify/functions/send-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    var data = await res.json();
    console.log('[push] Response:', data);

    if (data.success) {
      statusEl.style.color = '#057A44';
      statusEl.textContent = '✅ Sent!' + (data.shortUrl ? ' Short link: ' + data.shortUrl : '');
    } else {
      statusEl.style.color = '#e74c3c';
      statusEl.textContent = '❌ Error: ' + (data.error || 'Unknown error');
    }
  } catch(e) {
    statusEl.style.color = '#e74c3c';
    statusEl.textContent = '❌ Failed: ' + e.message;
  } finally {
    btnEl.disabled = false;
  }
}
</script>
</body>
</html>
