# ── App deep links ──
# Send these addresses to the app (index.html) so it can open the right screen.
# Real files (e.g. a business page under /biz/) are still served first.
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/biz/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/links"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/news"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/content-tools"
  to = "/index.html"
  status = 200
