[build]
  functions = "netlify/functions"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache"

[functions."auto-notify-news"]
  schedule = "*/30 * * * *"

[functions."auto-notify-articles"]
  schedule = "*/30 * * * *"

[functions."auto-notify-events"]
  schedule = "*/30 * * * *"

[functions."auto-notify-motivation"]
  schedule = "0 8 * * *"

[functions."auto-notify-tips"]
  schedule = "0 10 * * *"

[functions."auto-notify-prayer"]
  schedule = "0 6 * * *"

[functions."sync-directory"]
  schedule = "0 2 * * *"
