[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Cache-Control = "no-cache"

[functions."auto-notify-articles"]
  schedule = "*/30 * * * *"

[functions."auto-notify-events"]
  schedule = "*/30 * * * *"

[functions."auto-notify-motivation"]
  schedule = "0 10 * * *"

[functions."auto-notify-tips"]
  schedule = "0 15 * * *"

[functions."auto-notify-prayer"]
  schedule = "5 6 * * *"

[functions."sync-directory"]
  schedule = "0 */2 * * *"

[[edge_functions]]
  function = "biz-og"
  path = "/biz/*"

[functions."auto-notify-news"]
  schedule = "0 8 * * *"
