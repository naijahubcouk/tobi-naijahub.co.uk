<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add your birthday · Auntie Tobi</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="🎂 Add your birthday so I never miss it!">
<meta property="og:description" content="Takes 10 seconds — your birthday goes on my Auntie Tobi celebrations list.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F1EA;color:#0F1E36;line-height:1.5;min-height:100vh}
.top{background:#0F1E36;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.top img{width:38px;height:38px;border-radius:50%;background:#057A44}.top b{display:block;font-size:16px}.top span{font-size:12px;opacity:.65}
.wrap{max-width:460px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.hero{border-radius:20px;padding:24px 20px;color:#fff;background:linear-gradient(135deg,#7B2FF7 0%,#F107A3 55%,#FF8A3D 100%);position:relative;overflow:hidden;text-align:center}
.hero .e{font-size:44px;letter-spacing:6px}.hero h1{font-size:24px;line-height:1.25;margin-top:6px}.hero p{opacity:.92;margin-top:6px;font-size:15px}
.card{background:#fff;border-radius:16px;padding:18px;border:1px solid #E8E3D6}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}label:first-child{margin-top:0}label small{font-weight:500;color:#6B7280}
input,select{width:100%;font:inherit;font-size:16px;border:1.5px solid #E2DDD0;border-radius:12px;padding:12px;background:#fff;color:#0F1E36;outline:none}input:focus,select:focus{border-color:#C2185B}
.row{display:flex;gap:8px}.row>*{flex:1}
.go{display:block;width:100%;border:0;background:#C2185B;color:#fff;font:inherit;font-weight:800;font-size:17px;border-radius:14px;padding:15px;cursor:pointer;margin-top:18px}.go:disabled{opacity:.6}
.err{display:none;background:#FDE2E1;color:#B42318;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.note{font-size:13px;color:#6B7280;text-align:center}
.cta{display:block;text-align:center;background:#057A44;color:#fff;text-decoration:none;font-weight:800;border-radius:14px;padding:14px;margin-top:12px}
.cf{position:fixed;top:-40px;font-size:24px;pointer-events:none;animation:fall linear forwards;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="top"><img data-lsrc="/tobi-face-128.png" alt=""><div><b>Auntie Tobi</b><span>Celebrations</span></div></div>
<div class="wrap" id="app"><div class="card"><p class="note">Loading…</p></div></div>
<script>
(function () {
  var API = '/.netlify/functions/my-plan', app = document.getElementById('app'), code = new URLSearchParams(location.search).get('u') || '';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var post = function (b) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' }, body: JSON.stringify(b) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || 'Something went wrong — please try again.'); return j; }); }); };
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function confetti() { var e = ['🎉', '🎂', '🎈', '✨', '💛', '🥳']; for (var i = 0; i < 26; i++) { var d = document.createElement('div'); d.className = 'cf'; d.textContent = e[i % e.length]; d.style.left = Math.random() * 100 + 'vw'; d.style.animationDuration = (2.2 + Math.random() * 1.8) + 's'; d.style.animationDelay = Math.random() * .6 + 's'; document.body.appendChild(d); setTimeout(function (x) { x.remove(); }.bind(null, d), 4800); } }
  function form(name) {
    var who = name || 'your friend';
    app.innerHTML = '<div class="hero"><div class="e">🎂🎈</div><h1>' + (name ? esc(name) + ' wants to remember your birthday!' : 'Add your birthday!') + '</h1><p>It takes 10 seconds. Your birthday goes on ' + esc(name ? name + '’s' : 'their') + ' Auntie Tobi celebrations list so they never miss it.</p></div>' +
      '<div class="card"><label>Your name</label><input id="n" maxlength="40" autocomplete="given-name" placeholder="e.g. Ada">' +
      '<label>Your birthday</label><div class="row"><select id="dd"><option value="">Day</option>' + Array.from({ length: 31 }, function (_, i) { return '<option>' + (i + 1) + '</option>'; }).join('') + '</select><select id="mm" style="flex:1.6"><option value="">Month</option>' + MON.map(function (m, i) { return '<option value="' + (i + 1) + '">' + m + '</option>'; }).join('') + '</select></div>' +
      '<label>Year you were born <small>(optional — so they know which birthday it is)</small></label><input id="y" inputmode="numeric" maxlength="4" placeholder="e.g. 1992">' +
      '<div class="err" id="err"></div><button class="go" id="go">🎂 Add my birthday</button>' +
      '<p class="note" style="margin-top:10px">Only ' + esc(who) + ' sees this. Nothing else is shared.</p></div>';
    document.getElementById('go').onclick = function () {
      var b = this, e = document.getElementById('err'); e.style.display = 'none';
      var n = document.getElementById('n').value.trim(), dd = document.getElementById('dd').value, mm = document.getElementById('mm').value, y = document.getElementById('y').value.trim();
      if (!n) { e.textContent = 'Please add your name.'; e.style.display = 'block'; return; }
      if (!dd || !mm) { e.textContent = 'Please pick your birthday.'; e.style.display = 'block'; return; }
      b.disabled = true; b.textContent = 'Adding…';
      post({ action: 'bday-add', u: code, n: n, dd: +dd, mm: +mm, y: +y || 0 }).then(function () {
        confetti();
        app.innerHTML = '<div class="hero"><div class="e">🥳</div><h1>Done, ' + esc(n) + '!</h1><p>' + esc(name || 'Your friend') + ' will never miss your birthday now 💛</p></div>' +
          '<div class="card" style="text-align:center"><b style="font-size:17px">Never miss a birthday yourself</b><p class="note" style="margin-top:4px">Auntie Tobi reminds you in good time, writes a birthday message for you and helps you make a card — free.</p><a class="cta" href="/?plan=cel">🎉 Start my celebrations list</a></div>';
      }).catch(function (x) { e.textContent = x.message; e.style.display = 'block'; b.disabled = false; b.textContent = '🎂 Add my birthday'; });
    };
  }
  if (!/^[a-f0-9]{12}$/.test(code)) app.innerHTML = '<div class="card"><p class="note"><b style="display:block;font-size:18px;color:#0F1E36">Hmm…</b>This link isn’t complete. Ask your friend to send it again.</p></div>';
  else post({ action: 'bday-who', u: code }).then(function (r) { form(r.name); }).catch(function (x) { app.innerHTML = '<div class="card"><p class="note"><b style="display:block;font-size:18px;color:#0F1E36">Hmm…</b>' + esc(x.message) + '</p></div>'; });
  document.querySelectorAll('img[data-lsrc]').forEach(function (i) { i.src = i.getAttribute('data-lsrc'); });
})();
</script>
</body>
</html>
