<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1E36">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'">
<title>Business Studio — Auntie Tobi</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/favicon-180x180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#057A44;--green-d:#04613A;--green-l:#E3F2EA;
  --gold:#FFB81C;--gold-l:#FFF1CF;--navy:#0F1E36;--navy-2:#1C2E4D;
  --cream:#FBF6EC;--card:#FFFFFF;--line:#EADFC8;--muted:#5B6475;--danger:#B3261E;--danger-l:#FCE8E6;
  --radius:16px;--shadow:0 1px 2px rgba(15,30,54,.06),0 4px 16px rgba(15,30,54,.06);
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.no-nav{padding-bottom:24px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--green)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--cream);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:var(--cream)}
.top .brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.2px;line-height:1.1}
.top .brand small{display:block;font-family:var(--font);font-weight:500;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.top .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--cream);margin-left:-6px}
.top .back:focus-visible,.top .back:hover{background:var(--navy-2)}
.top .spacer{flex:1}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.3px}
.pill.gold{background:var(--gold);color:var(--navy)}
.pill.green{background:var(--green-l);color:var(--green-d)}
.pill.cream{background:rgba(251,246,236,.12);color:var(--cream)}

main{max-width:640px;margin:0 auto;padding:16px}
h1{font-family:var(--display);font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.2px}
h2{font-family:var(--display);font-size:20px;line-height:1.2;font-weight:700;margin:22px 0 10px}
.sub{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}

/* forms */
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
label.f .opt{font-weight:400;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
input[type=email],input[type=text],input[type=url],input[type=date],textarea,select{
  width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,122,68,.15)}
.code-input{font-size:30px!important;letter-spacing:12px;text-align:center;font-weight:700;padding:14px!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;line-height:1.2}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked=true]{background:var(--green)}
.switch[aria-checked=true]::after{left:23px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;min-height:48px;transition:transform .05s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--green-d)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy)}
.btn.small{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.link{padding:6px 0;min-height:0;color:var(--green);font-weight:700}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.err{background:var(--danger-l);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.note{background:var(--gold-l);border-radius:12px;padding:12px;font-size:14px}

/* sign in */
.auth-wrap{max-width:420px;margin:0 auto;padding:28px 18px}
.auth-hero{text-align:center;margin-bottom:20px}
.auth-hero img{width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);background:#fff;margin-bottom:12px}
.auth-hero .kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--green);font-weight:700}

/* allowance */
.allow{background:var(--navy);color:var(--cream);border:0;position:relative;overflow:hidden}
.allow::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,28,.25),transparent 70%)}
.allow .big{font-family:var(--display);font-size:44px;line-height:1;font-weight:700;color:var(--gold)}
.bar{height:8px;background:rgba(251,246,236,.15);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.bar span{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.allow .meta{font-size:13px;color:rgba(251,246,236,.8)}
.allow button.link{color:var(--gold);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* tools */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:116px;box-shadow:var(--shadow);transition:border-color .15s,transform .05s}
.tool:hover{border-color:var(--green)}
.tool:active{transform:scale(.98)}
.tool .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--green-l);color:var(--green)}
.tool:nth-child(3n+2) .ico{background:var(--gold-l);color:#9A6A00}
.tool:nth-child(3n) .ico{background:#E7EAF0;color:var(--navy)}
.tool b{font-size:15px;line-height:1.25}
.tool span{font-size:12.5px;color:var(--muted);line-height:1.35}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);font-size:12.5px}
.li .star{color:var(--gold);font-size:18px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:15px}

/* conversation */
.bubble{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.bubble img{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);background:#fff;flex:none}
.bubble p{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:15px;box-shadow:var(--shadow)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.option{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.option .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--green)}
.option textarea{border:0;padding:4px 2px;min-height:60px;box-shadow:none;font-size:15px;line-height:1.55;resize:none;overflow:hidden}
.option textarea:focus{box-shadow:none;background:#FFFCF5}
.cost{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.saved-tag{font-size:12px;color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:12px}
nav.tabs button[aria-current=page]{color:var(--green)}
nav.tabs button[aria-current=page] svg{background:var(--green-l)}
nav.tabs svg{width:40px;height:28px;padding:4px 10px;border-radius:999px}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(15,30,54,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
details.faq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.faq summary{font-weight:700;cursor:pointer}
details.faq ul{margin:8px 0 0 18px;font-size:14px;color:var(--navy)}
details.faq li+li{margin-top:4px}
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps span{flex:1;height:4px;border-radius:999px;background:var(--line)}
.steps span.on{background:var(--green)}
.plan{border:2px solid var(--gold);background:linear-gradient(180deg,#fff, var(--gold-l))}
.plan .price{font-family:var(--display);font-size:30px;font-weight:700}
.plan ul{margin:10px 0 14px 18px;font-size:14.5px}
/* growth */
.act{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.act.done{opacity:.6}
.act .tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;margin-top:2px}
.act.done .tick{background:var(--green);border-color:var(--green)}
.act .kind{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green)}
.act .kind.sales{color:#9A6A00}.act .kind.visibility{color:var(--navy)}
.act b{display:block;font-size:15.5px;line-height:1.3;margin:2px 0}
.act p{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{background:var(--navy);color:var(--cream);border-radius:14px;padding:12px;text-align:left;display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;line-height:1.2;min-height:56px}
.quick button svg{color:var(--gold);flex:none}
.goalbar{display:flex;align-items:center;gap:8px;background:var(--gold-l);border-radius:12px;padding:10px 12px;font-size:14px}
.goalbar b{flex:1}
.cal-day{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.cal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.cal .fmt{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#E7EAF0;margin-right:6px}
.cal .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cal .st .chip{padding:5px 10px;font-size:12.5px}
.num{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.num:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700}
.step input{width:76px;text-align:center;padding:8px}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wk div{background:var(--cream);border-radius:12px;padding:10px;text-align:center}
.wk b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.wk span{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="no-nav">

<header class="top" id="top">
  <button class="back hidden" id="backBtn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <img src="/tobi-face-128.png" alt="" id="topAvatar">
  <div class="brand">Business Studio<small>Auntie Tobi Business Club</small></div>
  <div class="spacer"></div>
  <span class="pill cream hidden" id="topPlan"></span>
  <button class="back hidden" id="acctBtn" aria-label="Account" style="margin-right:-6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
</header>

<div id="app" aria-live="polite"></div>

<nav class="tabs hidden" id="tabs" aria-label="Main">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Today</button>
  <button data-tab="create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z"/></svg>Create</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Track</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Library</button>
</nav>

<script>
'use strict';
(function () {
  // ───────────── state ─────────────
  var S = { boot: null, email: '', view: null, history: [] };
  var app = document.getElementById('app');

  var TOOL_META = {
    ideas: { blurb: '6 fresh ideas for your business', hello: 'Stuck for what to post? I’ll give you 6 fresh ideas made for your business — each with a hook and what to film.', icon: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0012 3z"/>' },
    caption: { blurb: 'Three scroll-stopping captions', hello: 'Tell me what this post is about and I’ll write three captions in your brand voice.', icon: '<path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/>' },
    reel: { blurb: 'Hook, scenes and voiceover', hello: 'What should your Reel show? I’ll plan the hook, every scene and the words to say.', icon: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>' },
    promo: { blurb: 'Offers, launches and sales', hello: 'What are you promoting? I’ll write it to sell — honestly, no hype you can’t back up.', icon: '<path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/>' },
    planner: { blurb: '7 or 30 days of ideas', hello: 'Let’s plan your content. Pick 7 or 30 days and I’ll map out every post.', icon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>' },
    bio: { blurb: 'Bios and descriptions', hello: 'Which bio or description do you need? I’ll give you three options to choose from.', icon: '<circle cx="9" cy="10" r="3"/><path d="M4 19c1-3 3-4 5-4s4 1 5 4M15 8h5M15 12h5M17 16h3"/>' },
    message: { blurb: 'Reply to customers well', hello: 'Paste what your customer said (or describe it) and I’ll help you reply the right way.', icon: '<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/><path d="M8 11h8M8 14h5"/>' }
  };
  var CHOICE_LABELS = { listing: 'Promote my Auntie Tobi listing', promote: 'Promote my product', engage: 'Get engagement', thank: 'Thank my customers', announce: 'Announce availability' };
  var QUICK = [
    { preset: 'promote', label: 'Promote my product', icon: '<path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M16 9a4 4 0 010 6"/>' },
    { preset: 'engage', label: 'Get engagement', icon: '<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>' },
    { preset: 'thank', label: 'Thank my customers', icon: '<path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0112 6a5.3 5.3 0 019.3 6c-2.3 4.6-9.3 9-9.3 9z"/>' },
    { preset: 'announce', label: 'Announce availability', icon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 15l2 2 4-4"/>' }
  ];
  var KIND = { content: 'Content', sales: 'Sales', visibility: 'Visibility' };
  var STATUS_LABELS = { todo: 'To do', drafted: 'Drafted', posted: 'Posted', done: 'Done' };
  var TONE_LABELS = { warm: 'Warm & friendly', professional: 'Professional', vibrant: 'Vibrant', luxury: 'Luxury', bold: 'Bold', cultural: 'Proudly Naija-British' };
  var CTA_IDEAS = ['DM us to order', 'Send us a WhatsApp', 'Tap the link in bio', 'Book your slot today', 'Call us', 'Visit our website'];

  // ───────────── helpers ─────────────
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('').replace(/^(.{8})(.{4})(.{4})(.{4})/, '$1-$2-$3-$4-');
  }
  function fmtDate(iso, opts) { try { return new Date(iso).toLocaleDateString('en-GB', opts || { day: 'numeric', month: 'short' }); } catch (e) { return ''; } }
  function toast(msg) {
    $$('.toast').forEach(function (x) { x.remove(); });
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;

        method: 'POST', credentials: 'same-origin',

      data = await res.json().catch(function () { return {}; });
    } catch (e) {
      var ne = new Error('You seem to be offline. Please check your connection and try again.'); ne.code = 'network'; throw ne;
    }

  async function showProfileForm(firstTime) {
    var p = Object.assign({}, S.boot.profile || {});

    if (firstTime && !p._listing) await showFindBusiness(p);
    if (!p.channels || !p.channels.length) p.channels = p.listingSlug ? ['listing'] : ['instagram'];

    function collect() {
      $$('[name]', app).forEach(function (el) { p[el.name] = el.name === 'ctas' ? el.value.split('\n') : el.value; });

      $$('.chip', box).forEach(function (c) { c.onclick = function () { p.mainChannel = c.dataset.val; $$('.chip', box).forEach(function (x) { x.setAttribute('aria-pressed', x === c); }); }; });
    }
    function bindListing() {
      var ck = $('#checkL', app), ul = $('#unlinkL', app);
      if (ck) ck.onclick = async function () {
        var link = $('#pf_listingLink').value.trim(), out = $('#lres');
        if (!link) return;
        ck.disabled = true; out.innerHTML = '<p class="hint">Checking…</p>';
        try {
          var r = await api('studio-api', 'listing-lookup', { link: link });
          var L = r.listing;
          out.innerHTML = '<div class="note stack" style="margin-top:8px"><div>Found: <b>' + esc(L.name) + '</b>' + (L.loc ? ' · ' + esc(L.loc) : '') + '</div><button type="button" class="btn primary small" id="useL">Link this listing and fill in my details</button></div>';

        } catch (x) { out.innerHTML = '<div class="err" style="margin-top:8px">' + esc(x.message) + '</div>'; }
        ck.disabled = false;
      };

    }
    function render() {
      var steps = firstTime ? [PROFILE_STEPS[step]] : PROFILE_STEPS;
      var last = PROFILE_STEPS.length - 1;
      setChrome({ tabs: !firstTime, tab: 'account', back: firstTime ? (step > 0 ? function () { collect(); step--; render(); } : null) : showAccount });
      var hello = ['Welcome! Tell me about your business once, and I’ll use it every time I write for you. You can change it any time.', 'Lovely. Now, what do you sell and who buys it?', 'Where do customers find you? I’ll point your posts there.', 'Last bit — how should you sound?'];
      app.innerHTML = '<main><form id="pform" novalidate>' +
        (firstTime ? '<div class="steps">' + PROFILE_STEPS.map(function (s, i) { return '<span class="' + (i <= step ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
          '<div class="bubble"><img src="/tobi-face-128.png" alt=""><p>' + (step === 0 && p._filledFrom ? 'I\u2019ve filled in what I could from your ' + (p._filledFrom === 'listing' ? 'Auntie Tobi listing' : 'website') + ' \u2014 check it and change anything you like.' : hello[step]) + '</p></div>'
          : '<h1>Business profile</h1><p class="sub" style="margin:6px 0 16px">Used automatically in everything you create.</p>') +
        steps.map(function (s) { return (firstTime ? '' : '<h2>' + esc(s.title) + '</h2>') + '<div class="card stack">' + s.fields.map(function (f) { return fieldHtml(f, p); }).join('') + '</div>'; }).join('') +
        '<div class="err hidden" id="perr" role="alert" style="margin-top:12px"></div>' +
        '<button class="btn primary block" style="margin-top:16px" id="psave">' + (firstTime && step < last ? 'Next' : 'Save profile') + '</button></form></main>';
      $$('[data-single=tone] .chip', app).forEach(function (c) { c.onclick = function () { $$('[data-single=tone] .chip', app).forEach(function (x) { x.setAttribute('aria-pressed', x === c); }); }; });
      $$('[data-multi=channels] .chip', app).forEach(function (c) { c.onclick = function () { c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') !== 'true'); drawMain(); }; });
      drawMain(); bindListing();
      $$('[data-cta]', app).forEach(function (c) { c.onclick = function () { var ta = $('#pf_ctas'); var lines = ta.value.split('\n').filter(Boolean); if (lines.indexOf(c.dataset.cta) < 0 && lines.length < 6) { lines.push(c.dataset.cta); ta.value = lines.join('\n'); } }; });
      $('#pform').addEventListener('submit', async function (e) {
        e.preventDefault(); collect();
        var err = $('#perr'); err.classList.add('hidden');
        var stepDef = firstTime ? [PROFILE_STEPS[step]] : PROFILE_STEPS;
        var missing = [];
        stepDef.forEach(function (s) { s.fields.forEach(function (f) { if (['text', 'area'].indexOf(f[2]) > -1 && !f[5] && !String(p[f[0]] || '').trim()) missing.push(f[1]); }); });
        if (missing.length) { err.textContent = 'Please fill in: ' + missing.join(', '); err.classList.remove('hidden'); return; }
        if (firstTime && step < last) { step++; render(); return; }
        var btn = $('#psave'); btn.disabled = true; btn.textContent = 'Saving…';
        var send = Object.assign({}, p); delete send._listing; delete send._filledFrom; delete send._webRead; send.listingSlug = p.listingSlug || '';
        try {
          await api('studio-api', 'profile-save', { profile: send });
          S.boot = await api('studio-api', 'bootstrap'); S.history = S.boot.recent || [];
          toast(firstTime ? 'All set! Let’s create something.' : 'Profile saved'); showHome();
        } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Save profile'; }
      });
    }
    render();
  }

      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + u.limit + '" aria-valuenow="' + (u.limit - u.remaining) + '"><span style="width:' + pct + '%"></span></div>' +

      Object.keys(goals).map(function (k) { return '<button class="btn ' + (k === cur ? 'primary' : 'ghost') + ' block" data-goal="' + k + '">' + esc(goals[k]) + '</button>'; }).join('') +

  function showCreate() {

  // ───────────── Plan: goal + content calendar ─────────────
  function fmtDay(day, today) {
    if (day === today) return 'Today';
    var t = new Date(Date.parse(today + 'T12:00:00Z') + 86400000).toISOString().slice(0, 10);
    if (day === t) return 'Tomorrow';
    return new Date(day + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' });
  }

  async function showPlan() {
    setChrome({ tabs: true, tab: 'plan' });
    if (S.boot.access.readOnly) { app.innerHTML = '<main><h1 style="margin-bottom:14px">Plan</h1>' + readOnlyBanner() + '</main>'; bindRenew(); return; }
    app.innerHTML = '<main><h1>Plan</h1><p class="sub" style="margin:4px 0 14px">Your weekly goal and content calendar.</p><div id="goalBox"></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn primary" id="p7" style="flex:1">Plan 7 days</button><button class="btn ghost" id="p30" style="flex:1">Plan 30 days</button></div>' +
      '<p class="hint">7 days uses 1 generation, 30 days uses 3. Posts you’ve already drafted or posted are kept.</p>' +
      '<div id="calBox"><div class="empty"><div class="typing"><i></i><i></i><i></i></div></div></div></main>';
    $('#p7').onclick = function () { showTool('planner', { days: '7' }, { back: showPlan, tab: 'plan' }); };
    $('#p30').onclick = function () { showTool('planner', { days: '30' }, { back: showPlan, tab: 'plan' }); };
    try {
      if (!S.today) S.today = await api('studio-growth', 'today');
      var g = S.today.goal;
      $('#goalBox').innerHTML = '<div class="goalbar">🎯 <b>' + (g ? 'This week: ' + esc(S.today.goals[g.goal]) : 'No weekly goal yet') + '</b><button class="btn small ' + (g ? 'ghost' : 'gold') + '" id="pg">' + (g ? 'Change' : 'Set goal') + '</button></div>';
      $('#pg').onclick = function () { pickGoal(showPlan); };
      var r = await api('studio-growth', 'calendar-list');
      renderCalendar(r.items, r.today);
    } catch (x) { $('#calBox').innerHTML = '<div class="err">' + esc(x.message) + '</div>'; }
  }

  function renderCalendar(items, today) {
    var box = $('#calBox'); if (!box) return;
    var weekAgo = new Date(Date.parse(today + 'T12:00:00Z') - 7 * 86400000).toISOString().slice(0, 10);
    var shown = items.filter(function (i) { return i.date >= weekAgo; });
    if (!shown.length) { box.innerHTML = '<div class="empty">No posts planned yet. Tap <b>Plan 7 days</b> and your plan will appear here, one post per day.</div>'; return; }
    var html = '', lastDay = '';
    shown.forEach(function (i) {
      if (i.date !== lastDay) { html += '<div class="cal-day">' + esc(fmtDay(i.date, today)) + (i.date < today ? ' · past' : '') + '</div>'; lastDay = i.date; }
      html += '<div class="cal" data-cal="' + esc(i.id) + '"><div><span class="fmt">' + esc(i.format) + '</span><b>' + esc(i.title) + '</b></div>' +
        (i.hook ? '<div class="sub" style="font-size:13.5px;margin-top:4px">Hook: ' + esc(i.hook) + '</div>' : '') +
        (i.cta ? '<div class="sub" style="font-size:13.5px">CTA: ' + esc(i.cta) + '</div>' : '') +
        '<div class="st">' + ['todo', 'drafted', 'posted', 'done'].map(function (st) { return '<button class="chip" data-st="' + st + '" aria-pressed="' + (i.status === st) + '">' + STATUS_LABELS[st] + '</button>'; }).join('') + '</div>' +
        '<div class="row" style="margin-top:8px;justify-content:space-between"><button class="btn small primary" data-make>Create this</button><button class="btn link danger" data-del style="font-size:13px">Remove</button></div></div>';
    });
    box.innerHTML = html;
    $$('[data-cal]', box).forEach(function (card) {
      var id = card.dataset.cal, item = items.filter(function (x) { return x.id === id; })[0];
      $$('[data-st]', card).forEach(function (c) {
        c.onclick = async function () {
          try { await api('studio-growth', 'calendar-update', { id: id, status: c.dataset.st }); item.status = c.dataset.st; $$('[data-st]', card).forEach(function (x) { x.setAttribute('aria-pressed', x === c); }); if (c.dataset.st === 'posted') toast('Posted — well done! ✅'); }
          catch (x) { toast(x.message); }
        };
      });
      $('[data-make]', card).onclick = function () {
        var topic = item.title + (item.hook ? '. Hook: ' + item.hook : '');
        var go = /reel/i.test(item.format) ? ['reel', { idea: topic }] : ['caption', { topic: topic }];
        showTool(go[0], go[1], { back: showPlan, tab: 'plan', intro: 'From your calendar: ' + item.title,
          onSuccess: function () { if (item.status === 'todo') api('studio-growth', 'calendar-update', { id: id, status: 'drafted' }).catch(function () {}); } });
      };
      $('[data-del]', card).onclick = async function () {
        if (!confirm('Remove this from your calendar?')) return;
        try { await api('studio-growth', 'calendar-delete', { id: id }); card.remove(); } catch (x) { toast(x.message); }
      };
    });
  }

  // ───────────── Track: progress + weekly summary ─────────────
  var TRACK_FIELDS = [['enquiries', 'Enquiries', 'Messages, DMs or calls asking about you'], ['bookings', 'Bookings / orders', 'Confirmed bookings or orders'], ['salesCount', 'Sales', 'Number of sales'], ['salesGbp', 'Sales value (£)', 'Total value, if you know it'], ['posts', 'Posts', 'Posts, Reels or Stories you shared']];

  async function showTrack(date) {
    setChrome({ tabs: true, tab: 'track' });
    if (S.boot.access.readOnly) { app.innerHTML = '<main><h1 style="margin-bottom:14px">Track</h1>' + readOnlyBanner() + '</main>'; bindRenew(); return; }
    app.innerHTML = '<main><h1>Track</h1><p class="sub" style="margin:4px 0 14px">Record your numbers in a minute. Only you see them.</p><div id="trBox"><div class="empty"><div class="typing"><i></i><i></i><i></i></div></div></div></main>';
    var p, sum;
    try { p = await api('studio-growth', 'progress-get'); sum = await api('studio-growth', 'summary'); }
    catch (x) { $('#trBox').innerHTML = '<div class="err">' + esc(x.message) + '</div>'; return; }
    var today = p.today, yday = new Date(Date.parse(today + 'T12:00:00Z') - 86400000).toISOString().slice(0, 10);
    date = date === yday ? yday : (date || today);
    function draw() {
      var e = p.entries[date] || {};
      $('#trBox').innerHTML =
        '<div class="card stack"><div class="chips" id="dsel"><button class="chip" data-d="' + today + '" aria-pressed="' + (date === today) + '">Today</button><button class="chip" data-d="' + yday + '" aria-pressed="' + (date === yday) + '">Yesterday</button></div>' +
        '<div>' + TRACK_FIELDS.map(function (f) {
          return '<div class="num"><label for="n_' + f[0] + '"><b style="display:block;font-size:15px">' + esc(f[1]) + '</b><span class="hint" style="margin:0">' + esc(f[2]) + '</span></label><div class="step">' +
            (f[0] === 'salesGbp' ? '' : '<button type="button" data-dec="' + f[0] + '" aria-label="Less">−</button>') +
            '<input id="n_' + f[0] + '" type="number" inputmode="' + (f[0] === 'salesGbp' ? 'decimal' : 'numeric') + '" min="0" step="' + (f[0] === 'salesGbp' ? '0.01' : '1') + '" value="' + (e[f[0]] || 0) + '">' +
            (f[0] === 'salesGbp' ? '' : '<button type="button" data-inc="' + f[0] + '" aria-label="More">+</button>') + '</div></div>';
        }).join('') + '</div>' +
        '<div><label class="f" for="n_note">Note <span class="opt">(optional)</span></label><input type="text" id="n_note" maxlength="300" value="' + esc(e.note || '') + '" placeholder="e.g. Ran a weekend offer"></div>' +
        '<div class="err hidden" id="nerr" role="alert"></div><button class="btn primary block" id="nsave">' + (p.entries[date] ? 'Update' : 'Save') + '</button></div>' +
        summaryHtml(sum);
      $$('#dsel .chip').forEach(function (c) { c.onclick = function () { date = c.dataset.d; draw(); }; });
      $$('[data-inc]').forEach(function (b) { b.onclick = function () { var i = $('#n_' + b.dataset.inc); i.value = (Number(i.value) || 0) + 1; }; });
      $$('[data-dec]').forEach(function (b) { b.onclick = function () { var i = $('#n_' + b.dataset.dec); i.value = Math.max(0, (Number(i.value) || 0) - 1); }; });
      $('#nsave').onclick = async function () {
        var body = { date: date, note: $('#n_note').value };
        TRACK_FIELDS.forEach(function (f) { body[f[0]] = $('#n_' + f[0]).value; });
        $('#nerr').classList.add('hidden');
        try {
          var r = await api('studio-growth', 'progress-save', body);
          p.entries[date] = r.entry; sum = await api('studio-growth', 'summary');
          if (S.today && S.today.checkin) S.today.checkin.needed = false;
          toast('Saved ✅'); draw();
        } catch (x) { $('#nerr').textContent = x.message; $('#nerr').classList.remove('hidden'); }
      };
    }
    draw();
  }

  function summaryHtml(s) {
    var t = s.thisWeek, l = s.lastWeek;
    function cmp(k) { if (!l) return ''; var d = t[k] - l[k]; return '<span style="display:block;font-size:11.5px;color:' + (d > 0 ? 'var(--green)' : d < 0 ? 'var(--danger)' : 'var(--muted)') + '">' + (d > 0 ? '▲ ' + d : d < 0 ? '▼ ' + Math.abs(d) : 'same') + ' vs last week</span>'; }
    return '<h2>This week</h2><div class="card stack"><div class="wk">' +
      '<div><b>' + t.enquiries + '</b><span>Enquiries</span>' + cmp('enquiries') + '</div>' +
      '<div><b>' + t.bookings + '</b><span>Bookings</span>' + cmp('bookings') + '</div>' +
      '<div><b>' + t.salesCount + '</b><span>Sales' + (t.salesGbp ? ' · £' + t.salesGbp.toLocaleString('en-GB') : '') + '</span>' + cmp('salesCount') + '</div>' +
      '<div><b>' + t.posts + '</b><span>Posts recorded</span></div>' +
      '<div><b>' + s.postedThisWeek + '</b><span>Calendar posts done</span></div>' +
      '<div><b>' + s.actionsDone + '</b><span>Daily actions done</span></div></div>' +
      (s.tips.length ? '<div><b style="display:block;margin-bottom:6px">Ideas for this week</b><ul style="margin-left:18px;font-size:14.5px">' + s.tips.map(function (x) { return '<li style="margin-bottom:4px">' + esc(x) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<p class="hint">' + esc(s.note) + ' Week starts Monday.</p></div>';
  }

  // ───────────── tools ─────────────
  function toolDef(id) { return S.boot.tools.filter(function (t) { return t.id === id; })[0]; }

  // opts: { back, onSuccess(item), autoRun, intro }
  function showTool(toolId, prefill, opts) {
    opts = opts || {};
    var t = toolDef(toolId); if (!t) return showHome();
    var m = TOOL_META[toolId] || {};
    var input = {};
    t.fields.forEach(function (f) { input[f.name] = prefill && prefill[f.name] !== undefined ? prefill[f.name] : (f.name === 'platform' ? defaultPlatform() : f.type === 'text' ? '' : f.default); });
    setChrome({ tabs: true, tab: opts.tab || 'create', back: opts.back || showCreate });
    app.innerHTML = '<main><h1 style="font-size:22px;margin-bottom:12px">' + esc(t.name) + '</h1>' +
      '<div class="bubble"><img src="/tobi-face-128.png" alt=""><p>' + esc(opts.intro || m.hello || '') + '</p></div>' +
      '<form class="card stack" id="tform" novalidate>' + t.fields.map(function (f) {
        if (f.type === 'text') return '<div><label class="f" for="tf_' + f.name + '">' + esc(f.label) + (f.required ? '' : ' <span class="opt">(optional)</span>') + '</label><textarea id="tf_' + f.name + '" data-field="' + f.name + '" maxlength="' + f.max + '" rows="' + (f.max > 600 ? 4 : 2) + '"' + (f.required ? ' required' : '') + '>' + esc(input[f.name]) + '</textarea></div>';
        if (f.type === 'choice') return '<div><span class="f" style="display:block;font-weight:700;font-size:14px;margin-bottom:6px">' + esc(f.label) + '</span><div class="chips" data-choice="' + f.name + '">' + f.options.map(function (o) { return '<button type="button" class="chip" data-val="' + esc(o) + '" aria-pressed="' + (o === input[f.name]) + '">' + esc(CHOICE_LABELS[o] || (o === '7' || o === '30' ? o + ' days' : o.charAt(0).toUpperCase() + o.slice(1))) + '</button>'; }).join('') + '</div></div>';
        if (f.type === 'bool') return '<div class="toggle"><span id="lb_' + f.name + '">' + esc(f.label) + '</span><button type="button" class="switch" role="switch" aria-labelledby="lb_' + f.name + '" data-bool="' + f.name + '" aria-checked="' + !!input[f.name] + '"></button></div>';
        return '';
      }).join('') +
      '<div class="err hidden" id="terr" role="alert"></div>' +
      '<button class="btn primary block" id="go">' + icon('<path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z"/>', 18) + ' Create</button>' +
      '<div class="cost" id="cost"></div></form>' +
      '<div id="result" style="margin-top:18px"></div></main>';

    $$('[data-choice]', app).forEach(function (g) {
      $$('.chip', g).forEach(function (c) { c.onclick = function () { $$('.chip', g).forEach(function (x) { x.setAttribute('aria-pressed', x === c); }); }; });
    });
    $$('[data-bool]', app).forEach(function (s) { s.onclick = function () { s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true'); }; });
    var first = $('textarea', app); if (first && !prefill) setTimeout(function () { first.focus(); }, 60);

    function readInput() {
      var out = {};
      $$('[data-field]', app).forEach(function (el) { out[el.dataset.field] = el.value; });
      $$('[data-choice]', app).forEach(function (g) { var on = $('[aria-pressed=true]', g); if (on) out[g.dataset.choice] = on.dataset.val; });
      $$('[data-bool]', app).forEach(function (s) { out[s.dataset.bool] = s.getAttribute('aria-checked') === 'true'; });
      return out;
    }

    function costFor(inp) { return (t.cost && t.cost.values[inp[t.cost.field]]) || 1; }
    function updateCost() {
      var c = costFor(readInput());
      $('#cost').textContent = 'Uses ' + c + ' generation' + (c > 1 ? 's' : '') + ' \u00b7 ' + S.boot.usage.remaining + ' left today';
    }
    $$('.chip', app).forEach(function (c) { c.addEventListener('click', updateCost); });
    updateCost();
    $('#tform').addEventListener('submit', function (e) { e.preventDefault(); run(readInput()); });

    async function run(inp) {
      var err = $('#terr'); err.classList.add('hidden');
      var miss = t.fields.filter(function (f) { return f.required && !String(inp[f.name] || '').trim(); });
      if (miss.length) { err.textContent = 'Please fill in: ' + miss[0].label; err.classList.remove('hidden'); return; }
      if (S.boot.usage.remaining <= 0) return showLimitReached();
      if (S.boot.usage.remaining < costFor(inp)) { err.textContent = 'This needs ' + costFor(inp) + ' generations and you have ' + S.boot.usage.remaining + ' left today. Your allowance resets at midnight.'; err.classList.remove('hidden'); return; }
      var btn = $('#go'); btn.disabled = true;
      var resEl = $('#result');
      resEl.innerHTML = '<div class="bubble"><img src="/tobi-face-128.png" alt=""><p><span class="typing" aria-label="Writing"><i></i><i></i><i></i></span> Writing in your brand voice…</p></div>';
      resEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var reqId = uuid(), r;
      try {
        try { r = await api('studio-api', 'generate', { tool: toolId, input: inp, requestId: reqId }); }
        catch (x) { if (x.code === 'network') r = await api('studio-api', 'generate', { tool: toolId, input: inp, requestId: reqId }); else throw x; }
      } catch (x) {
        btn.disabled = false; resEl.innerHTML = '';
        if (x.code === 'limit_reached') return showLimitReached();
        err.textContent = x.message; err.classList.remove('hidden'); return;
      }
      btn.disabled = false;
      S.boot.usage = r.usage;
      updateCost();
      addToHistory(r.item);
      resEl.innerHTML = '';
      renderResult(resEl, r.item, function () { run(inp); });
      if (r.calendarAdded) toast(r.calendarAdded + ' posts added to your calendar');
      if (opts.onSuccess) { try { opts.onSuccess(r.item); } catch (e) {} }
    }
    if (opts.autoRun) run(readInput());
  }

  function addToHistory(item) {
    S.history = [{ id: item.id, tool: item.tool, title: item.title, createdAt: item.createdAt, saved: item.saved }].concat(S.history.filter(function (h) { return h.id !== item.id; }));
  }

  function splitOptions(text) {
    return String(text).split(/\n\s*-{3,}\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // Editable result with copy / save / regenerate. Edits autosave (free).
  function renderResult(el, item, onRegenerate) {
    var parts = splitOptions(item.edited != null ? item.edited : item.output);
    // Labelled sections (one-click posts): "HOOK: …", "CAPTION: …"
    var labels = parts.map(function (p) { var m = p.match(/^([A-Z][A-Z ]{2,24}):\s*/); return m ? m[1] : null; });
    var labelled = parts.length > 1 && labels.every(Boolean);
    if (labelled) parts = parts.map(function (p, i) { return p.slice(p.indexOf(':') + 1).trim(); });
    var many = parts.length > 1, word = item.tool === 'ideas' ? 'Idea' : 'Option';
    el.innerHTML = '<div class="bubble"><img src="/tobi-face-128.png" alt=""><p>' + (labelled ? 'Here\u2019s your post, ready to go. Tap any part to edit it.' : many ? 'Here are ' + parts.length + ' ' + word.toLowerCase() + 's. Tap any text to edit it.' : 'Here you go! Tap the text to edit it.') + '</p></div>' +
      '<div class="stack" id="opts">' + parts.map(function (p, i) {
        return '<div class="option"><div class="oh"><span>' + (labelled ? labels[i].charAt(0) + labels[i].slice(1).toLowerCase() : many ? word + ' ' + (i + 1) : 'Your content') + '</span><button class="btn small ghost" data-copy="' + i + '">' + icon('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 011-1h10"/>', 16) + ' Copy</button></div>' +
          '<textarea data-opt="' + i + '" aria-label="' + (many ? word + ' ' + (i + 1) : 'Content') + '">' + esc(p) + '</textarea></div>';
      }).join('') + '</div>' +
      '<div class="row wrap" style="margin-top:12px">' +
      '<button class="btn ghost small" id="saveBtn">' + (item.saved ? '★ Saved' : '☆ Save') + '</button>' +
      (many ? '<button class="btn ghost small" id="copyAll">Copy all</button>' : '') +
      (onRegenerate ? '<button class="btn ghost small" id="regen">\u21bb Regenerate <span class="saved-tag">(' + (item.cost || 1) + ' generation' + ((item.cost || 1) > 1 ? 's' : '') + ')</span></button>' : '') +
      '<span class="saved-tag" id="editState" style="margin-left:auto"></span></div>';
    $$('textarea[data-opt]', el).forEach(function (ta) { autosize(ta); });
    function current() { return $$('textarea[data-opt]', el).map(function (ta, i) { return (labelled ? labels[i] + ': ' : '') + ta.value.trim(); }).join('\n---\n'); }
    var tmr;
    $$('textarea[data-opt]', el).forEach(function (ta) {
      ta.addEventListener('input', function () {
        autosize(ta); $('#editState', el).textContent = 'Editing…';
        clearTimeout(tmr);
        tmr = setTimeout(async function () {
          try { await api('studio-api', 'item-update', { id: item.id, edited: current() }); item.edited = current(); $('#editState', el).textContent = 'Changes saved'; }
          catch (x) { $('#editState', el).textContent = 'Couldn’t save edit'; }
        }, 900);
      });
    });
    $$('[data-copy]', el).forEach(function (b) { b.onclick = function () { copyText($('textarea[data-opt="' + b.dataset.copy + '"]', el).value); }; });
    var ca = $('#copyAll', el); if (ca) ca.onclick = function () { copyText(current().replace(/\n---\n/g, '\n\n')); };
    $('#saveBtn', el).onclick = async function () {
      var b = this; b.disabled = true;
      try {
        var r = await api('studio-api', 'item-update', { id: item.id, saved: !item.saved });
        item.saved = r.item.saved; b.textContent = item.saved ? '★ Saved' : '☆ Save';
        S.history = S.history.map(function (h) { return h.id === item.id ? Object.assign({}, h, { saved: item.saved }) : h; });
        toast(item.saved ? 'Saved to your library' : 'Removed from saved');
      } catch (x) { toast(x.message); }
      b.disabled = false;
    };
    var rg = $('#regen', el); if (rg) rg.onclick = onRegenerate;
  }

  function showLimitReached() {
    var canUp = S.boot.access.plan !== 'power' && S.boot.billing.enabled && !S.boot.access.addonLive;
    var scrim = document.createElement('div'); scrim.className = 'scrim';
    scrim.innerHTML = '<div class="sheet stack" role="dialog" aria-modal="true" aria-labelledby="lrT"><h2 id="lrT" style="margin:0">You’ve used today’s generations</h2>' +
      '<p>Your allowance resets at <b>midnight</b>. You can still view, edit and copy everything in your library.</p>' +
      (canUp ? '<p><b>Want more?</b> AI Power gives you ' + S.boot.limits.power + ' generations a day.</p><button class="btn gold block" id="lrUp">See AI Power plans</button>' : '') +
      '<button class="btn ghost block" id="lrOk">OK</button></div>';
    document.body.appendChild(scrim);
    $('#lrOk', scrim).onclick = function () { scrim.remove(); };
    var up = $('#lrUp', scrim); if (up) up.onclick = function () { scrim.remove(); showRenew(); };
  }

  // ───────────── library ─────────────
  function showLibrary(filter) {
    filter = filter || 'all';
    setChrome({ tabs: true, tab: 'library' });
    app.innerHTML = '<main><h1>Library</h1><p class="sub" style="margin:6px 0 12px">Everything you’ve created. Viewing, editing and copying are free.</p>' +
      '<div class="chips" id="lf" style="margin-bottom:14px">' + [['all', 'All'], ['saved', '★ Saved']].concat(S.boot.tools.map(function (t) { return [t.id, t.name]; })).map(function (o) { return '<button class="chip" data-f="' + o[0] + '" aria-pressed="' + (o[0] === filter) + '">' + esc(o[1]) + '</button>'; }).join('') + '</div>' +
      '<div id="lbody"><div class="empty"><div class="typing"><i></i><i></i><i></i></div></div></div></main>';
    $$('#lf .chip', app).forEach(function (c) { c.onclick = function () { showLibrary(c.dataset.f); }; });
    var payload = filter === 'saved' ? { savedOnly: true } : filter === 'all' ? {} : { tool: filter };
    api('studio-api', 'history-list', payload).then(function (r) {
      if (filter === 'all') S.history = r.items;
      $('#lbody').innerHTML = historyRows(r.items); bindHistoryRows();
    }).catch(function (x) { $('#lbody').innerHTML = '<div class="err">' + esc(x.message) + '</div>'; });
  }

  async function showItem(id) {
    setChrome({ tabs: true, tab: 'library', back: function () { showLibrary(); } });
    app.innerHTML = '<main><div class="empty"><div class="typing"><i></i><i></i><i></i></div></div></main>';
    var r;
    try { r = await api('studio-api', 'item-get', { id: id }); }
    catch (x) { app.innerHTML = '<main><div class="err">' + esc(x.message) + '</div></main>'; return; }
    var item = r.item, t = toolDef(item.tool) || { name: item.tool };
    app.innerHTML = '<main><p class="sub">' + esc(t.name) + ' · ' + fmtDate(item.createdAt, { day: 'numeric', month: 'long', year: 'numeric' }) + '</p>' +
      '<h1 style="font-size:20px;margin:4px 0 14px">' + esc(item.title) + '</h1><div id="res"></div>' +
      '<div class="row wrap" style="margin-top:18px;gap:14px"><button class="btn link" id="again">Use these settings again</button><button class="btn link danger" id="del">Delete</button></div></main>';
    renderResult($('#res'), item, null);
    $('#again').onclick = function () { showTool(item.tool, item.input); };
    $('#del').onclick = async function () {
      if (!confirm('Delete this from your library?')) return;
      try { await api('studio-api', 'item-delete', { id: id }); S.history = S.history.filter(function (h) { return h.id !== id; }); toast('Deleted'); showLibrary(); }
      catch (x) { toast(x.message); }
    };
  }

  // ───────────── account & billing ─────────────
  async function startCheckout(interval) {
    try { var r = await api('studio-billing', 'checkout', { interval: interval === 'year' ? 'year' : 'month' }); location.href = r.url; }
    catch (x) { if (x.code !== 'cancelled') toast(x.message); }
  }
  async function openPortal() {
    try { var r = await api('studio-billing', 'portal'); location.href = r.url; }
    catch (x) { if (x.code !== 'cancelled') toast(x.message); }
  }
  async function signOut() {
    try { await api('studio-auth', 'logout', {}, { quiet401: true }); } catch (e) {}
    S.boot = null; S.today = null; showSignIn();
  }

  function d(iso, y) { return fmtDate(iso, y ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long' }); }

  function planSection() {
    var a = S.boot.access, ad = S.boot.addon, l = S.boot.limits, m = S.boot.member;
    var html = '';
    // Business Club (only shown to Club members)
    if (m.isClub) {
      html += '<h2>Business Club</h2><div class="card stack"><div class="row" style="justify-content:space-between"><b>Annual membership</b><span class="pill ' + (a.membershipActive ? 'green' : 'cream" style="background:#ECEDF0;color:var(--muted)') + '">' + (a.membershipActive ? 'Active' : 'Not active') + '</span></div>' +
        '<div class="sub">' + (a.membershipActive ? 'Valid until <b>' + d(m.membershipExpiresAt, 1) + '</b>. Includes ' + l.standard + ' AI generations a day.' : 'Your Business Club membership isn’t active. <a href="/business-club">Renew it here</a>.') + '</div></div>';
    }
    // AI Power
    html += '<h2>AI Power</h2>';
    var period = ad && ad.interval === 'year' ? '£50/year' : '£5/month';
    if (ad && ['active', 'trialing'].indexOf(ad.status) > -1) {
      html += '<div class="card plan stack"><div class="row" style="justify-content:space-between"><b>AI Power · ' + (ad.interval === 'year' ? 'Yearly' : 'Monthly') + '</b><span class="pill gold">' + (ad.cancelAtPeriodEnd ? 'Ending' : 'Active') + '</span></div>' +
        '<div class="sub">' + l.power + ' generations a day · ' + period + '</div>' +
        '<div>' + (ad.cancelAtPeriodEnd ? 'Ends on <b>' + d(ad.currentPeriodEnd, 1) + '</b>.' + (a.membershipActive ? ' You’ll go back to ' + l.standard + ' a day with your Business Club membership.' : ' After that you can still view your library.') : 'Renews on <b>' + d(ad.currentPeriodEnd, 1) + '</b>.') + '</div>' +
        '<button class="btn ghost block" id="manage">' + (ad.cancelAtPeriodEnd ? 'Restart or manage subscription' : 'Switch plan, manage or cancel') + '</button></div>';
    } else if (ad && ['past_due', 'unpaid', 'incomplete'].indexOf(ad.status) > -1) {
      html += '<div class="card stack" style="border-color:var(--danger)"><b>AI Power is paused</b><div class="err">Your last payment didn’t go through. Update your card to get your ' + l.power + ' generations a day back.' + (a.membershipActive ? ' Your Business Club membership is not affected.' : '') + '</div>' +
        '<button class="btn primary block" id="manage">Update payment details</button></div>';
    } else if (S.boot.billing.enabled) {
      html += '<div class="card stack">' + (a.membershipActive ? '<p class="sub" style="margin:0">You have ' + l.standard + ' a day with Business Club. Upgrade for ' + l.power + ' a day.</p>' : '') + planChoices() + '</div>';
    } else if (!m.isClub) {
      html += '<div class="note">AI Power isn’t available right now.</div>';
    }
    return html;
  }

  function showAccount() {
    setChrome({ tabs: true, tab: 'account' });
    var p = S.boot.profile;
    app.innerHTML = '<main><h1>Account</h1><p class="sub" style="margin-top:4px">' + esc(S.boot.member.email) + '</p>' +
      planSection() +
      (p ? '<h2>Business profile</h2><div class="card"><b>' + esc(p.businessName) + '</b><div class="sub">' + esc(p.industry) + ' · ' + esc(p.location) + '</div>' +
        '<div class="sub" style="margin-top:4px">Tone: ' + esc(TONE_LABELS[p.tone] || p.tone) + (p.instagram ? ' · ' + esc(p.instagram) : '') + '</div>' +
        '<div class="sub" style="margin-top:4px">Customers find you on: ' + esc((p.channels || ['instagram']).map(channelName).join(', ')) + (p.mainChannel ? ' \u00b7 posts point to ' + esc(channelName(p.mainChannel)) : '') + '</div>' +
        (S.boot.listing ? '<div class="sub" style="margin-top:4px">Auntie Tobi listing: <a href="' + esc(S.boot.listing.url) + '" target="_blank" rel="noopener">' + esc(S.boot.listing.name) + '</a></div>' : '<div class="sub" style="margin-top:4px">No Auntie Tobi listing linked \u2014 add it in your profile.</div>') +
        '<button class="btn ghost block" style="margin-top:12px" id="editP">Edit business profile</button></div>' : '') +
      '<h2>Help</h2><details class="faq"><summary>What counts as a generation?</summary><ul><li>Every <b>Create</b> or <b>Regenerate</b> that gives you a result = 1 generation.</li><li>A <b>30-day content plan uses 3</b>. Everything else uses 1.</li><li>Editing, copying, saving and browsing your library are free.</li><li>If it fails, you’re not charged.</li><li>Allowances reset at midnight (UK time). Unused generations don’t carry over.</li></ul></details>' +
      '<h2>Security</h2><div class="card stack"><p class="sub">You stay signed in on this device for up to 30 days of inactivity, and we’ll ask for a fresh email code at least every 90 days and before any payment.</p>' +
      '<button class="btn ghost block" id="out">Sign out</button><button class="btn link danger" id="outAll">Sign out on all devices</button></div></main>';
    var ep = $('#editP'); if (ep) ep.onclick = function () { showProfileForm(false); };
    $('#out').onclick = signOut;
    $('#outAll').onclick = async function () {
      if (!confirm('Sign out everywhere, including this device?')) return;
      try { await api('studio-auth', 'logout-all'); } catch (e) {}
      S.boot = null; showSignIn();
    };
    bindPlanChoices();
    var mg = $('#manage'); if (mg) mg.onclick = openPortal;
  }

  start();
})();
</script>
</body>
</html>
