<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1E36">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.onesignal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://onesignal.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com https://onesignal.com; connect-src 'self' https://onesignal.com https://*.onesignal.com; form-action 'self'; base-uri 'none'">
<title>Business Studio — Auntie Tobi</title>
<link rel="icon" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/favicon-180x180.png">
<link rel="manifest" href="/studio-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Business Studio">
<script src="/studio-qr.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#057A44;--green-d:#04613A;--green-l:#E3F2EA;
  --gold:#FFB81C;--gold-l:#FFF1CF;--navy:#0F1E36;--navy-2:#1C2E4D;
  --cream:#FBF6EC;--card:#FFFFFF;--line:#EADFC8;--muted:#5B6475;--danger:#B3261E;--danger-l:#FCE8E6;
  --radius:16px;--shadow:0 1px 2px rgba(15,30,54,.06),0 4px 16px rgba(15,30,54,.06);
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.no-nav{padding-bottom:24px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--green)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--cream);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:var(--cream)}
.top .brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.2px;line-height:1.1}
.top .brand small{display:block;font-family:var(--font);font-weight:500;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.top .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--cream);margin-left:-6px}
.top .back:focus-visible,.top .back:hover{background:var(--navy-2)}
.top .spacer{flex:1}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.3px}
.pill.gold{background:var(--gold);color:var(--navy)}
.pill.green{background:var(--green-l);color:var(--green-d)}
.pill.cream{background:rgba(251,246,236,.12);color:var(--cream)}

main{max-width:640px;margin:0 auto;padding:16px}
h1{font-family:var(--display);font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.2px}
h2{font-family:var(--display);font-size:20px;line-height:1.2;font-weight:700;margin:22px 0 10px}
.sub{color:var(--muted);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}

/* forms */
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
label.f .opt{font-weight:400;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
input:not([type]),input[type=search],input[type=email],input[type=text],input[type=url],input[type=date],input[type=number],textarea,select{
  width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,122,68,.15)}
.code-input{font-size:30px!important;letter-spacing:12px;text-align:center;font-weight:700;padding:14px!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;line-height:1.2}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked=true]{background:var(--green)}
.switch[aria-checked=true]::after{left:23px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px;min-height:48px;transition:transform .05s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--green-d)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy)}
.btn.small{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.link{padding:6px 0;min-height:0;color:var(--green);font-weight:700}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.err{background:var(--danger-l);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.note{background:var(--gold-l);border-radius:12px;padding:12px;font-size:14px}

/* sign in */
.auth-wrap{max-width:420px;margin:0 auto;padding:28px 18px}
.auth-hero{text-align:center;margin-bottom:20px}
.auth-hero img{width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);background:#fff;margin-bottom:12px}
.auth-hero .kicker{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--green);font-weight:700}

/* allowance */
.allow{background:var(--navy);color:var(--cream);border:0;position:relative;overflow:hidden}
.allow::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,28,.25),transparent 70%)}
.allow .big{font-family:var(--display);font-size:44px;line-height:1;font-weight:700;color:var(--gold)}
.bar{height:8px;background:rgba(251,246,236,.15);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.bar span{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.allow .meta{font-size:13px;color:rgba(251,246,236,.8)}
.allow button.link{color:var(--gold);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* tools */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:116px;box-shadow:var(--shadow);transition:border-color .15s,transform .05s}
.tool:hover{border-color:var(--green)}
.tool:active{transform:scale(.98)}
.tool .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--green-l);color:var(--green)}
.tool:nth-child(3n+2) .ico{background:var(--gold-l);color:#9A6A00}
.tool:nth-child(3n) .ico{background:#E7EAF0;color:var(--navy)}
.tool b{font-size:15px;line-height:1.25}
.tool span{font-size:12.5px;color:var(--muted);line-height:1.35}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);font-size:12.5px}
.li .star{color:var(--gold);font-size:18px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:15px}

/* conversation */
.bubble{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.bubble img{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);background:#fff;flex:none}
.bubble p{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:15px;box-shadow:var(--shadow)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.option{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.option .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--green)}
.option textarea{border:0;padding:4px 2px;min-height:60px;box-shadow:none;font-size:15px;line-height:1.55;resize:none;overflow:hidden}
.option textarea:focus{box-shadow:none;background:#FFFCF5}
.cost{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.saved-tag{font-size:12px;color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:12px}
nav.tabs button[aria-current=page]{color:var(--green)}
nav.tabs button[aria-current=page] svg{background:var(--green-l)}
nav.tabs svg{width:40px;height:28px;padding:4px 10px;border-radius:999px}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(15,30,54,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
details.faq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.faq summary{font-weight:700;cursor:pointer}
details.faq ul{margin:8px 0 0 18px;font-size:14px;color:var(--navy)}
details.faq li+li{margin-top:4px}
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps span{flex:1;height:4px;border-radius:999px;background:var(--line)}
.steps span.on{background:var(--green)}
.plan{border:2px solid var(--gold);background:linear-gradient(180deg,#fff, var(--gold-l))}
.plan .price{font-family:var(--display);font-size:30px;font-weight:700}
.plan ul{margin:10px 0 14px 18px;font-size:14.5px}
/* growth */
.act{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.act.done{opacity:.6}
.act .tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;margin-top:2px}
.act.done .tick{background:var(--green);border-color:var(--green)}
.act .kind{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green)}
.act .kind.sales{color:#9A6A00}.act .kind.visibility{color:var(--navy)}
.act b{display:block;font-size:15.5px;line-height:1.3;margin:2px 0}
.act p{font-size:13.5px;color:var(--muted);margin-bottom:8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{background:var(--navy);color:var(--cream);border-radius:14px;padding:12px;text-align:left;display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px;line-height:1.2;min-height:56px}
.quick button svg{color:var(--gold);flex:none}
.goalbar{display:flex;align-items:center;gap:8px;background:var(--gold-l);border-radius:12px;padding:10px 12px;font-size:14px}
.goalbar b{flex:1}
.cal-day{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.cal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.cal .fmt{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:#E7EAF0;margin-right:6px}
.cal .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cal .st .chip{padding:5px 10px;font-size:12.5px}
.num{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.num:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;font-weight:700}
.step input{width:76px;text-align:center;padding:8px}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wk div{background:var(--cream);border-radius:12px;padding:10px;text-align:center}
.wk b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.wk span{font-size:12px;color:var(--muted)}
[hidden]{display:none!important}
.row>div{min-width:0}
a.btn{text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.optact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.logo-box{width:72px;height:72px;border-radius:14px;border:1.5px dashed var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);flex:none;overflow:hidden}
.logo-box img{width:100%;height:100%;object-fit:contain}
.colour{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;font-weight:600;cursor:pointer}
.colour input{width:40px;height:40px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer;flex:none}
.imgprev{margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
.imgprev canvas{display:block;width:100%;height:auto}
.posted{font-size:11px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:999px;padding:2px 8px;white-space:nowrap}
@media print{body.printing>*:not(#app){display:none!important}body.printing #app>*:not(main),body.printing main>*:not(#printArea){display:none!important}body.printing,body.printing #app,body.printing main{background:#fff!important;padding:0!important;margin:0!important;max-width:none!important}body.printing .docpaper{border:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
[data-lesson] .t b,.li.soon .t b{white-space:normal}
.li.soon{background:transparent;border-style:dashed;opacity:.75}
.li .snip{display:block;margin-top:2px}
.ldot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.ldot.done{background:var(--green);border-color:var(--green)}
.reswelcome{background:#F2FBF6;border:1px solid #CFEBDB;border-radius:var(--radius);padding:16px}
.reswelcome h2{margin:0 0 6px;font-size:20px}
.reswelcome p{font-size:14.5px;color:var(--navy-2)}
.rsearch{display:flex;gap:8px;margin-top:12px}
.rsearch input{flex:1;min-width:0}
.pbar{display:block;height:7px;background:#E6EFE9;border-radius:999px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--green);border-radius:999px}
.modgrid{display:grid;grid-template-columns:1fr;gap:10px}
.modcard{display:grid!important;grid-template-columns:40px 1fr;column-gap:12px;row-gap:3px}
.modcard>*{grid-column:2}.modcard .mi{grid-column:1;grid-row:1/span 6}
@media(min-width:560px){.modgrid{grid-template-columns:1fr 1fr}}
.modcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.modcard .mi,.modhead .mi{width:40px;height:40px;border-radius:12px;background:#F2FBF6;color:var(--green);display:flex;align-items:center;justify-content:center}
.modcard .mn,.modhead .mn{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--green)}
.modcard b{font-family:var(--display);font-size:18px;line-height:1.2}
.modcard .md{font-size:14px;color:var(--muted)}
.modcard .mc{font-size:12.5px;font-weight:700;color:var(--navy-2)}
.modcard .mgo{font-weight:800;color:var(--green);font-size:14px;margin-top:2px}
.modhead{display:flex;gap:12px;align-items:center}
.modhead h1{font-size:24px}
.lesson .lmeta{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--green);text-transform:uppercase;margin-bottom:6px}
.lesson h1{font-size:26px}
.lsimg img{width:100%;border-radius:var(--radius);margin-top:12px;display:block}
.lsec{background:#F2FBF6;border:1px solid #CFEBDB;border-radius:var(--radius);padding:16px;margin-top:14px}
.lsec.see{background:#FFF8E6;border-color:#F3E2B3}
.lsec.do{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.lsec.do .rt p,.lsec.do .rt li{color:var(--cream)}
.lsec.use{background:#fff;border-color:var(--line)}
.lh{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:10px;line-height:1.2}
.lh span{font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:1.4px;background:var(--green);color:#fff;border-radius:999px;padding:4px 9px;flex:none}
.see .lh span{background:var(--gold);color:var(--navy)}.do .lh span{background:var(--gold);color:var(--navy)}
.rt{font-size:15.5px;line-height:1.65}
.rt p+p,.rt p+ul,.rt p+ol,.rt ul+p,.rt ol+p,.rt h3+p,.rt .tipbox+p,.rt p+.tipbox{margin-top:10px}
.rt h3{font-family:var(--display);font-size:18px;margin:18px 0 6px}
.rt ul,.rt ol{margin:8px 0 0 20px}.rt li{margin-bottom:4px}
.rt a{color:var(--green-d);font-weight:700}
.tipbox{background:#fff;border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;font-weight:500;margin-top:10px}
.useblock{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#FCFDFC}
.ubh{margin-bottom:8px}.ubh span{display:block;font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--green);text-transform:uppercase}.ubh b{font-size:16px}
.checks{display:flex;flex-direction:column;gap:2px}
.useblock textarea[rows="1"]{min-height:48px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;border-bottom:1px solid #EEF3EF;font-size:15px;cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--green);margin-top:1px}
.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.tpl{white-space:pre-wrap;font-family:var(--font);font-size:15px;background:#F2FBF6;border-radius:10px;padding:12px;line-height:1.55;border:1px dashed #BFE2CD}
.lfoot{margin-top:16px;font-size:13px;color:var(--muted)}.lfoot p+p{margin-top:4px}.lfoot a{color:var(--green-d)}
.pcout{background:#F2FBF6;border-radius:12px;padding:12px}.pcout .row{padding:2px 0}
#printArea.ponly{display:none}
.wsprint{font-family:var(--font);color:#0F1E36;padding:10px}.wsprint h1{font-family:var(--display);font-size:24px;margin:6px 0}.wsprint h3{font-size:14px;margin:16px 0 4px}
.wsp-brand{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#057A44;font-weight:800}
.wsp-ans{border-bottom:1px solid #999;padding:4px 0 8px;min-height:28px;font-size:14px}.wsp-ans.blank{min-height:60px}
@media print{body.printing #printArea.ponly{display:block!important}}
.free{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.8px;background:var(--gold-l);color:#7A5300;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.tool.freetool .ico{background:var(--gold-l);color:#7A5300}
.tool.freetool{position:relative}.tool.freetool b .free{position:absolute;top:14px;right:12px;margin:0}
h2 .free{font-family:var(--font)}
.setup{margin-bottom:14px}
.setstep{display:flex;gap:10px;align-items:center;width:100%;padding:9px 2px;border-bottom:1px solid #EEF3EF;font-size:15px;font-weight:500;color:var(--navy)}
.setstep:last-child{border-bottom:0}.setstep.done{color:var(--muted)}.setstep.done span:nth-child(2){text-decoration:line-through}
.installcard{margin-bottom:14px}
.act.chase{border-left:4px solid var(--gold)}.act.chase.overdue{border-left-color:var(--danger)}
.slugrow{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.slugrow span{padding:12px 0 12px 12px;color:var(--muted);font-size:14px;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.slugrow input{border:0!important;box-shadow:none!important;padding-left:2px!important;min-width:0}
ol.steps{margin-left:20px}ol.steps li{margin-bottom:8px}
.cust b{word-break:break-word}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="no-nav">

<header class="top" id="top">
  <button class="back hidden" id="backBtn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <img src="/tobi-face-128.png" alt="" id="topAvatar">
  <div class="brand">Business Studio<small>Auntie Tobi Business Club</small></div>
  <div class="spacer"></div>
  <span class="pill cream hidden" id="topPlan"></span>
  <button class="back hidden" id="acctBtn" aria-label="Account" style="margin-right:-6px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
</header>

<div id="app" aria-live="polite"></div>

<nav class="tabs hidden" id="tabs" aria-label="Main">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Today</button>
  <button data-tab="create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z"/></svg>Create</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="track"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Track</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Library</button>
</nav>

<script>
'use strict';
(function () {
  // ───────────── state ─────────────
  var S = { boot: null, email: '', view: null, history: [] };
  var app = document.getElementById('app');

  var TOOL_META = {
    ideas: { blurb: '6 fresh ideas for your business', hello: 'Stuck for what to post? I’ll give you 6 fresh ideas made for your business — each with a hook and what to film.', icon: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0012 3z"/>' },
    caption: { blurb: 'Three scroll-stopping captions', hello: 'Tell me what this post is about and I’ll write three captions in your brand voice.', icon: '<path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/>' },
    reel: { blurb: 'Hook, scenes and voiceover', hello: 'What should your Reel show? I’ll plan the hook, every scene and the words to say.', icon: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>' },
    promo: { blurb: 'Offers, launches and sales', hello: 'What are you promoting? I’ll write it to sell — honestly, no hype you can’t back up.', icon: '<path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M16 9a4 4 0 010 6M19 6a8 8 0 010 12"/>' },
    planner: { blurb: '7 or 30 days of ideas', hello: 'Let’s plan your content. Pick 7 or 30 days and I’ll map out every post.', icon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>' },
    bio: { blurb: 'Bios and descriptions', hello: 'Which bio or description do you need? I’ll give you three options to choose from.', icon: '<circle cx="9" cy="10" r="3"/><path d="M4 19c1-3 3-4 5-4s4 1 5 4M15 8h5M15 12h5M17 16h3"/>' },
    message: { blurb: 'Reply to customers well', hello: 'Paste what your customer said (or describe it) and I’ll help you reply the right way.', icon: '<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/><path d="M8 11h8M8 14h5"/>' }
  };
  var CHOICE_LABELS = { listing: 'Promote my Auntie Tobi listing', promote: 'Promote my product', engage: 'Get engagement', thank: 'Thank my customers', announce: 'Announce availability' };
  var QUICK = [
    { preset: 'promote', label: 'Promote my product', icon: '<path d="M3 11v2a1 1 0 001 1h2l5 4V6L6 10H4a1 1 0 00-1 1z"/><path d="M16 9a4 4 0 010 6"/>' },
    { preset: 'engage', label: 'Get engagement', icon: '<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/>' },
    { preset: 'thank', label: 'Thank my customers', icon: '<path d="M12 21s-7-4.4-9.3-9A5.3 5.3 0 0112 6a5.3 5.3 0 019.3 6c-2.3 4.6-9.3 9-9.3 9z"/>' },
    { preset: 'announce', label: 'Announce availability', icon: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 15l2 2 4-4"/>' }
  ];
  var KIND = { content: 'Content', sales: 'Customers', visibility: 'Visibility' };
  var STATUS_LABELS = { todo: 'To do', drafted: 'Drafted', posted: 'Posted', done: 'Done' };
  var TONE_LABELS = { warm: 'Warm & friendly', professional: 'Professional', vibrant: 'Vibrant', luxury: 'Luxury', bold: 'Bold', cultural: 'Proudly Naija-British' };
  var CTA_IDEAS = ['DM us to order', 'Send us a WhatsApp', 'Tap the link in bio', 'Book your slot today', 'Call us', 'Visit our website'];

  // ───────────── helpers ─────────────
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16); crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('').replace(/^(.{8})(.{4})(.{4})(.{4})/, '$1-$2-$3-$4-');
  }
  function fmtDate(iso, opts) { try { return new Date(iso).toLocaleDateString('en-GB', opts || { day: 'numeric', month: 'short' }); } catch (e) { return ''; } }
  function toast(msg) {
    $$('.toast').forEach(function (x) { x.remove(); });
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }
  function icon(path, size) { return '<svg width="' + (size || 22) + '" height="' + (size || 22) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>'; }
  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch (e) {
      var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast('Couldn’t copy — select and copy manually'); }
      ta.remove();
    }
  }

  // ───────────── API ─────────────
  async function api(fn, action, payload, opts) {
    opts = opts || {};
    var body = Object.assign({ action: action }, payload || {});
    var res, data;
    try {
      res = await fetch('/.netlify/functions/' + fn, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-Studio': '1' },
        body: JSON.stringify(body)
      });
      data = await res.json().catch(function () { return {}; });
    } catch (e) {
      var ne = new Error('You seem to be offline. Please check your connection and try again.'); ne.code = 'network'; throw ne;
    }
    if (res.ok) return data;
    var err = new Error(data.message || 'Something went wrong. Please try again.');
    err.code = data.error; err.status = res.status; err.data = data;
    if (res.status === 401 && !opts.quiet401) { S.boot = null; showSignIn(); }
    if (err.code === 'reauth_required' && !opts.noStepUp) {
      await stepUp();
      return api(fn, action, payload, Object.assign({}, opts, { noStepUp: true }));
    }
    throw err;
  }

  // ───────────── chrome ─────────────
  function setChrome(o) {
    document.getElementById('tabs').classList.toggle('hidden', !o.tabs);
    document.body.classList.toggle('no-nav', !o.tabs);
    var back = document.getElementById('backBtn');
    back.classList.toggle('hidden', !o.back);
    back.onclick = o.back || null;
    document.getElementById('topAvatar').classList.toggle('hidden', !!o.back);
    $$('nav.tabs button').forEach(function (b) { b.setAttribute('aria-current', b.dataset.tab === o.tab ? 'page' : 'false'); });
    var ab = document.getElementById('acctBtn');
    ab.classList.toggle('hidden', !o.tabs); ab.onclick = function () { showAccount(); };
    ab.style.background = o.tab === 'account' ? 'var(--navy-2)' : '';
    var tp = document.getElementById('topPlan');
    if (S.boot && S.boot.access && S.boot.access.canView) {
      tp.classList.remove('hidden');
      tp.className = 'pill ' + (S.boot.access.plan === 'power' ? 'gold' : 'cream');
      tp.textContent = S.boot.access.plan === 'club' ? 'Club' : planLabel();
    } else tp.classList.add('hidden');
    window.scrollTo(0, 0);
  }
  $$('nav.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.dataset.tab;
      if (t === 'home') showHome(); else if (t === 'create') showCreate(); else if (t === 'plan') showPlan(); else if (t === 'track') showTrack(); else openLibraryTab();
    });
  });

  // ───────────── sign in ─────────────
  // mode: 'signin' (members) or 'signup' (Get AI Power — anyone can verify their email to buy)
  function showSignIn(prefill, mode) {
    mode = mode || 'signin';
    var up = mode === 'signup';
    setChrome({ tabs: false, back: up ? function () { showSignIn(); } : null });
    app.innerHTML =
      '<div class="auth-wrap"><div class="auth-hero"><img src="/tobi-face-256.png" alt="Auntie Tobi">' +
      (up ? '<div class="kicker">AI Power</div><h1>Get AI Power</h1>' +
        '<p class="sub" style="margin-top:8px">100 AI generations a day for captions, Reels, promos, content ideas and more — written in your brand voice. £5 a month or £50 a year. First, confirm your email.</p></div>'
        : '<div class="kicker">Auntie Tobi</div><h1>Welcome to your Business Studio</h1>' +
        '<p class="sub" style="margin-top:8px">Create captions, Reels, promos and more in your brand voice. Sign in with your Business Club or AI Power email.</p></div>') +
      '<form class="card stack" id="emailForm" novalidate>' +
      '<div><label class="f" for="email">Email address</label><input type="email" id="email" autocomplete="email" inputmode="email" required placeholder="you@yourbusiness.co.uk" value="' + esc(prefill || S.email) + '"></div>' +
      '<div class="err hidden" id="err" role="alert"></div>' +
      '<button class="btn ' + (up ? 'gold' : 'primary') + ' block" id="sendBtn">' + (up ? 'Continue' : 'Send my code') + '</button>' +
      '<p class="hint" style="text-align:center">No password needed. We’ll email you a 6-digit code.</p></form>' +
      (up ? '<p class="hint" style="text-align:center;margin-top:18px">Already have access? <button class="btn link" id="toSignin">Sign in</button></p>'
        : '<div class="card plan stack" style="margin-top:18px;text-align:center"><b>Not a Business Club member?</b><div class="sub">Get AI Power on its own — 100 generations a day.</div><button class="btn gold block" id="toSignup">Get AI Power</button></div>' +
          '<p class="hint" style="text-align:center;margin-top:14px"><a href="/business-club">About the Business Club</a></p>') + '</div>';
    var ts = $('#toSignup'); if (ts) ts.onclick = function () { showSignIn($('#email').value, 'signup'); };
    var ti = $('#toSignin'); if (ti) ti.onclick = function () { showSignIn($('#email').value); };
    $('#emailForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = $('#email').value.trim();
      var err = $('#err'); err.classList.add('hidden');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Please enter a valid email address.'; err.classList.remove('hidden'); return; }
      var btn = $('#sendBtn'), label = btn.textContent; btn.disabled = true; btn.textContent = 'Sending…';
      try {
        var r = await api('studio-auth', up ? 'signup-request' : 'request-code', { email: email });
        S.email = email; showCode(r.message, mode);
      } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = label; }
    });
    setTimeout(function () { var i = $('#email'); if (i && !i.value) i.focus(); }, 50);
  }

  function showCode(message, mode) {
    var up = mode === 'signup';
    setChrome({ tabs: false, back: function () { showSignIn('', mode); } });
    app.innerHTML =
      '<div class="auth-wrap"><div class="auth-hero"><div class="kicker">Check your email</div><h1>Enter your code</h1>' +
      '<p class="sub" style="margin-top:8px">' + esc(message) + '</p><p class="sub" style="margin-top:6px"><b>' + esc(S.email) + '</b></p></div>' +
      '<form class="card stack" id="codeForm" novalidate>' +
      '<div><label class="f sr" for="code">6-digit code</label><input class="code-input" type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="••••••"></div>' +
      '<div class="err hidden" id="err" role="alert"></div>' +
      '<button class="btn primary block" id="verifyBtn">' + (up ? 'Confirm email' : 'Sign in') + '</button>' +
      '<p class="hint" style="text-align:center">You’ll stay signed in on this device.</p>' +
      '<div class="row" style="justify-content:space-between"><button type="button" class="btn link" id="resend" disabled>Resend code</button><button type="button" class="btn link" id="other">Use a different email</button></div>' +
      '</form><p class="hint" style="text-align:center;margin-top:16px">Can’t find it? Check spam or promotions.' + (up ? '' : ' Still nothing? This email may not have Studio access yet — you can <button class="btn link" id="toUp" style="font-size:inherit">get AI Power</button>.') + '</p></div>';
    var tu = $('#toUp'); if (tu) tu.onclick = function () { showSignIn(S.email, 'signup'); };
    var code = $('#code');
    code.addEventListener('input', function () {
      code.value = code.value.replace(/\D/g, '').slice(0, 6);
      if (code.value.length === 6) $('#codeForm').requestSubmit ? $('#codeForm').requestSubmit() : $('#verifyBtn').click();
    });
    $('#other').onclick = function () { showSignIn('', mode); };
    var left = 60, rs = $('#resend');
    var timer = setInterval(function () {
      left--; rs.textContent = left > 0 ? 'Resend code (' + left + 's)' : 'Resend code';
      if (left <= 0) { rs.disabled = false; clearInterval(timer); }
    }, 1000);
    rs.onclick = async function () {
      rs.disabled = true;
      try { await api('studio-auth', up ? 'signup-request' : 'request-code', { email: S.email }); toast('A new code is on its way'); }
      catch (x) { toast(x.message); }
    };
    $('#codeForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = $('#err'); err.classList.add('hidden');
      if (code.value.length !== 6) { err.textContent = 'Enter all 6 digits.'; err.classList.remove('hidden'); return; }
      var btn = $('#verifyBtn'), label = btn.textContent; btn.disabled = true; btn.textContent = 'Checking…';
      try {
        await api('studio-auth', up ? 'signup-verify' : 'verify-code', { email: S.email, code: code.value });
        clearInterval(timer); await start();
      } catch (x) {
        err.textContent = x.message; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = label; code.select();
      }
    });
    setTimeout(function () { code.focus(); }, 50);
  }

  // Fresh verification for sensitive actions (billing)
  function stepUp() {
    return new Promise(function (resolve, reject) {
      var scrim = document.createElement('div'); scrim.className = 'scrim';
      scrim.innerHTML = '<div class="sheet stack" role="dialog" aria-modal="true" aria-labelledby="suT">' +
        '<h2 id="suT" style="margin:0">Confirm it’s you</h2>' +
        '<p class="sub">For your security, payments need a fresh email code. We’ll send one to <b>' + esc(S.boot ? S.boot.member.email : '') + '</b>.</p>' +
        '<div id="suCodeWrap" class="hidden"><label class="f sr" for="suCode">Code</label><input class="code-input" id="suCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"></div>' +
        '<div class="err hidden" id="suErr" role="alert"></div>' +
        '<button class="btn primary block" id="suGo">Email me a code</button><button class="btn ghost block" id="suCancel">Cancel</button></div>';
      document.body.appendChild(scrim);
      var sent = false, go = $('#suGo', scrim), errEl = $('#suErr', scrim);
      function close(ok) { scrim.remove(); ok ? resolve() : reject(Object.assign(new Error('Cancelled'), { code: 'cancelled' })); }
      $('#suCancel', scrim).onclick = function () { close(false); };
      go.onclick = async function () {
        errEl.classList.add('hidden'); go.disabled = true;
        try {
          if (!sent) {
            await api('studio-auth', 'stepup-request', {}, { noStepUp: true });
            sent = true; $('#suCodeWrap', scrim).classList.remove('hidden'); go.textContent = 'Confirm'; $('#suCode', scrim).focus();
          } else {
            await api('studio-auth', 'stepup-verify', { code: $('#suCode', scrim).value.replace(/\D/g, '') }, { noStepUp: true });
            close(true);
          }
        } catch (x) { errEl.textContent = x.message; errEl.classList.remove('hidden'); }
        go.disabled = false;
      };
    });
  }

  // ───────────── boot ─────────────
  function planLabel() {
    var a = S.boot.access;
    if (a.plan === 'power') return 'AI Power';
    if (a.plan === 'club') return 'Business Club';
    return a.readOnly ? 'Read-only' : '';
  }

  async function start() {
    app.innerHTML = '<main><div class="empty"><div class="typing"><i></i><i></i><i></i></div></div></main>';
    S.today = null;
    try { S.boot = await api('studio-api', 'bootstrap', {}, { quiet401: true }); }
    catch (e) {
      if (e.status === 401) return showSignIn();
      if (e.code === 'account_blocked') return showMessage('Account suspended', e.message);
      app.innerHTML = '<main><div class="err">' + esc(e.message) + '</div><button class="btn ghost" style="margin-top:12px" onclick="location.reload()">Try again</button></main>'; return;
    }
    S.history = S.boot.recent || [];
    var q = new URLSearchParams(location.search);
    if (q.get('billing')) {
      history.replaceState(null, '', location.pathname);
      if (q.get('billing') === 'success' || q.get('billing') === 'managed') {
        if (q.get('billing') === 'success') toast('Payment received — setting up AI Power…');
        try { await api('studio-billing', 'refresh'); S.boot = await api('studio-api', 'bootstrap'); S.history = S.boot.recent || []; } catch (e) {}
        if (q.get('billing') === 'success' && S.boot.access.plan === 'power') toast('AI Power is active — ' + S.boot.limits.power + ' generations a day!');
      }
    }
    if (S.boot.state === 'buyer') return showBuy();
    if (S.boot.state === 'active' && !S.boot.profile) return showProfileForm(true);
    showHome();
  }

  function showMessage(title, text) {
    setChrome({ tabs: false });
    app.innerHTML = '<div class="auth-wrap"><div class="auth-hero"><img src="/tobi-face-256.png" alt=""><h1>' + esc(title) + '</h1><p class="sub" style="margin-top:8px">' + esc(text) + '</p></div><button class="btn link" id="out">Sign out</button></div>';
    $('#out').onclick = signOut;
  }

  // Plan choice: monthly / yearly AI Power
  function planChoices() {
    var iv = (S.boot.billing && S.boot.billing.intervals) || [];
    if (!iv.length) return '<div class="note">AI Power isn’t available to buy just yet. Please check back soon.</div>';
    var l = S.boot.limits.power;
    var opts = {

  function prefillFromListing(p, L) {
    if (!L) return;

    if (!p.description && L.desc) p.description = L.desc;
    if (!p.instagram && L.ig) p.instagram = '@' + L.ig;
    if (!p.website && L.website) p.website = L.website;
    if (!p.whatsapp && L.wa) p.whatsapp = L.wa;
    var ch = (p.channels || []).slice();
    ['listing'].concat(L.ig ? ['instagram'] : [], L.wa ? ['whatsapp'] : [], L.website ? ['website'] : []).forEach(function (c) { if (ch.indexOf(c) < 0) ch.push(c); });
    p.channels = ch;

  function prefillFromWebsite(p, r) {

    set('businessName', d.businessName || site.name);
    set('industry', d.industry); set('location', d.location); set('products', d.products);
    set('customers', d.customers); set('description', d.description || site.description);
    set('website', site.url ? site.url.replace(/\/$/, '') : '');
    set('instagram', site.instagram); set('whatsapp', site.whatsapp);
    var ch = (p.channels || []).slice();
    ['website'].concat(site.instagram ? ['instagram'] : [], site.whatsapp ? ['whatsapp'] : [], site.facebook ? ['facebook'] : [], site.tiktok ? ['tiktok'] : [])
      .forEach(function (c) { if (ch.indexOf(c) < 0) ch.push(c); });
    p.channels = ch;
    if (!p.mainChannel) p.mainChannel = 'website';

  function wrapLines(ctx, text, maxW) {
    var out = [];
    String(text || '').split('\n').forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), line = '';
      words.forEach(function (w) {
        var test = line ? line + ' ' + w : w;

      });
      out.push(line);
    });

  }
  function luminance(hex) {

    return 0.2126 * r + 0.7152 * g + 0.0722 * b;

    }

    function close() { if (list) { out.push('</' + list + '>'); list = null; } }
    String(src || '').replace(/\r/g, '').split(/\n{2,}/).forEach(function (block) {
      var lines = block.split('\n');
      if (lines.every(function (l) { return /^\s*-\s+/.test(l); })) { close(); out.push('<ul>' + lines.map(function (l) { return '<li>' + inline(l.replace(/^\s*-\s+/, '')) + '</li>'; }).join('') + '</ul>'); return; }
      if (lines.every(function (l) { return /^\s*\d+\.\s+/.test(l); })) { close(); out.push('<ol>' + lines.map(function (l) { return '<li>' + inline(l.replace(/^\s*\d+\.\s+/, '')) + '</li>'; }).join('') + '</ol>'); return; }

      '<div id="rvOut"></div>' +
      '<p class="hint" style="margin-top:14px">Ask every genuine customer for an honest review and don’t offer anything in return — see the “How to Ask for Customer Reviews” lesson for the UK rules.</p></main>';
    function hint() { var l = $('#rvL').value; $('#rvHint').textContent = l === 'Google' ? 'In your Google Business Profile, look for “Ask for reviews” or “Share review form” and copy the link.' : l === 'Auntie Tobi listing' ? 'Use the link to your listing page on Auntie Tobi.' : 'Paste the page where customers can leave a review.'; }
    $('#rvL').onchange = hint; hint();
    var ul = $('#rvUseL'); if (ul) ul.onclick = function () { $('#rvL').value = 'Auntie Tobi listing'; $('#rvU').value = listing.url; hint(); };
    async function out(link) {
      if (!link) { $('#rvOut').innerHTML = ''; return; }
      var biz = (S.boot.profile && S.boot.profile.businessName) || '';
      var msg = 'Hi [name], thank you so much for choosing ' + biz + '! 😊 If you have a minute, an honest review would really help my small business: ' + link + ' Thank you!';
      $('#rvOut').innerHTML = '<h2>Your QR card</h2><div class="imgprev" style="max-width:300px"><canvas id="rvC" aria-label="Review QR card"></canvas></div>' +
        '<div class="row" style="margin-top:10px;justify-content:center"><button class="btn primary" id="rvDl">Save / share card</button></div><p class="hint" style="text-align:center">Print it for your counter, stall, packaging or receipts.</p>' +
        '<h2>Message to send</h2><div class="option"><textarea id="rvMsg" aria-label="Review request message">' + esc(msg) + '</textarea><div class="optact"><button class="btn small ghost" id="rvCopy">Copy</button><a class="btn small ghost" id="rvWa" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(msg) + '">Send on WhatsApp</a></div></div>';
      autosize($('#rvMsg'));
      $('#rvMsg').oninput = function () { autosize(this); $('#rvWa').href = 'https://wa.me/?text=' + encodeURIComponent(this.value); };
      $('#rvCopy').onclick = function () { copyText($('#rvMsg').value); };
      var card = await reviewCard(link, 'Enjoyed it? Leave us a review', 'Scan with your phone camera — it only takes a minute. Thank you! 💚');
      var v = $('#rvC'); if (!v) return; v.width = card.width; v.height = card.height; v.getContext('2d').drawImage(card, 0, 0);
      $('#rvDl').onclick = function () { shareOrDownload(card, 'review-qr-card.png', ''); };
    }
    $('#rvSave').onclick = async function () {
      var b = this; b.disabled = true;
      try { var r = await api('studio-extras', 'prefs-save', { prefs: { reviewLink: $('#rvU').value, reviewLabel: $('#rvL').value } }); $('#rvU').value = r.prefs.reviewLink; toast(r.prefs.reviewLink ? 'Review link saved' : 'Review link removed'); out(r.prefs.reviewLink); }
      catch (x) { toast(x.message); }
      b.disabled = false;
    };
    out(p.reviewLink);
  }

  // ───────────── Price list page ─────────────
  async function showShop(back) {
    back = back || showCreate;
    setChrome({ tabs: true, tab: 'create', back: back });
    app.innerHTML = '<main><div class="empty"><div class="typing"><i></i><i></i><i></i></div></div></main>';
    var r; try { r = await api('studio-extras', 'shop-get'); } catch (x) { app.innerHTML = '<main><div class="err">' + esc(x.message) + '</div></main>'; return; }
    var sh = r.shop, base = r.base, items = (sh.items || []).map(function (i) { return Object.assign({}, i); });
    function draw() {
      var url = sh.slug ? base + sh.slug : '';
      app.innerHTML = '<main><h1 style="font-size:22px">Price list page</h1><p class="sub" style="margin:6px 0 14px">A simple page with your products, prices and a WhatsApp order button. Share it in your bio, Status and messages. Free.</p>' +
        (sh.slug && !sh.isNew ? '<div class="card stack" style="margin-bottom:14px;' + (sh.published ? 'border-color:#CFEBDB;background:#F2FBF6' : '') + '"><div class="row" style="justify-content:space-between"><b>' + (sh.published ? '🟢 Live' : 'Not published yet') + '</b>' + (sh.published ? '<a class="btn small ghost" href="' + esc(url) + '" target="_blank" rel="noopener">View page</a>' : '') + '</div>' +
          '<div class="hint" style="margin:0;word-break:break-all">' + esc(url) + '</div><div class="row wrap">' + (sh.published ? '<button class="btn small primary" id="shShare">Share link</button><button class="btn small ghost" id="shCopy">Copy link</button><button class="btn small ghost" id="shQr">QR code</button><button class="btn link danger" id="shOff">Unpublish</button>' : '<button class="btn small primary" id="shOn">Publish my page</button>') + '</div></div>' : '') +
        '<div class="card stack"><div><label class="f" for="shSlug">Page link</label><div class="slugrow"><span>' + esc(base.replace(/^https?:\/\//, '')) + '</span><input id="shSlug" value="' + esc(sh.slug || sh.suggestedSlug || '') + '" maxlength="40" autocapitalize="off" spellcheck="false"></div><div class="hint">Letters, numbers and dashes, e.g. ada-cakes-croydon.</div></div>' +
          '<div><label class="f" for="shTitle">Title</label><input id="shTitle" maxlength="80" value="' + esc(sh.title || '') + '"></div>' +
          '<div><label class="f" for="shIntro">Short introduction <span class="opt">(optional)</span></label><textarea id="shIntro" rows="2" maxlength="400">' + esc(sh.intro || '') + '</textarea></div>' +
          '<div class="row"><div style="flex:1"><label class="f" for="shArea">Area <span class="opt">(optional)</span></label><input id="shArea" maxlength="80" value="' + esc(sh.area || '') + '" placeholder="e.g. Croydon · UK delivery"></div><div style="flex:1"><label class="f" for="shWa">WhatsApp number</label><input id="shWa" inputmode="tel" maxlength="20" value="' + esc(sh.whatsapp || '') + '" placeholder="07700 900123"></div></div>' +
          '<div><label class="f" for="shNote">Ordering note <span class="opt">(optional)</span></label><input id="shNote" maxlength="200" value="' + esc(sh.orderNote || '') + '" placeholder="e.g. Order 3 days ahead. 50% deposit to confirm."></div></div>' +
        '<h2>Products and prices</h2><div class="stack" id="shItems">' + items.map(function (it, i) {
          return '<div class="card stack" data-it="' + i + '"><div class="row" style="justify-content:space-between"><b class="hint" style="margin:0">Item ' + (i + 1) + '</b><div class="row">' + (i ? '<button class="btn small ghost" data-up="' + i + '" aria-label="Move up">↑</button>' : '') + '<button class="btn link danger" data-del="' + i + '">Remove</button></div></div>' +
            '<div class="row"><div style="flex:2"><label class="f" for="in_' + i + '">Name</label><input id="in_' + i + '" data-k="name" maxlength="70" value="' + esc(it.name) + '" placeholder="e.g. Party tray (serves 20)"></div><div style="flex:1"><label class="f" for="ip_' + i + '">Price</label><input id="ip_' + i + '" data-k="price" maxlength="30" value="' + esc(it.price) + '" placeholder="£85 / from £45"></div></div>' +
            '<div><label class="f" for="id_' + i + '">Description <span class="opt">(optional)</span></label><input id="id_' + i + '" data-k="desc" maxlength="260" value="' + esc(it.desc) + '"></div>' +
            '<div class="row">' + (it.id ? (it.hasImg ? '<span class="pill green">📷 Photo added</span><label class="btn small ghost" style="cursor:pointer">Change<input type="file" accept="image/*" class="sr-only" data-img="' + i + '"></label><button class="btn link danger" data-imgdel="' + i + '">Remove photo</button>' : '<label class="btn small ghost" style="cursor:pointer">Add photo<input type="file" accept="image/*" class="sr-only" data-img="' + i + '"></label>') : '<span class="hint" style="margin:0">Save to add a photo</span>') + '</div></div>';
        }).join('') + '</div>' +
        (items.length < 30 ? '<button class="btn ghost small" id="shAdd" style="margin-top:10px">+ Add item</button>' : '') +
        '<div class="err hidden" id="shErr" style="margin-top:12px"></div><button class="btn primary block" id="shSave" style="margin-top:14px">Save page</button>' +
        '<p class="hint">Only publish prices you’re happy to honour. Your page shows while your membership or AI Power is active.</p></main>';
      $$('[data-it] input[data-k]').forEach(function (inp) { inp.oninput = function () { items[Number(inp.closest('[data-it]').dataset.it)][inp.dataset.k] = inp.value; }; });
      $$('[data-del]').forEach(function (b) { b.onclick = function () { keep(); items.splice(Number(b.dataset.del), 1); draw(); }; });
      $$('[data-up]').forEach(function (b) { b.onclick = function () { keep(); var i = Number(b.dataset.up), t = items[i - 1]; items[i - 1] = items[i]; items[i] = t; draw(); }; });
      var add = $('#shAdd'); if (add) add.onclick = function () { keep(); items.push({ name: '', price: '', desc: '' }); draw(); var l = $('#in_' + (items.length - 1)); if (l) l.focus(); };
      $('#shSave').onclick = save;
      $$('[data-img]').forEach(function (inp) {
        inp.onchange = async function () {
          var f = inp.files[0], it = items[Number(inp.dataset.img)]; if (!f) return; keep();
          try { var url = await resizeImage(f, 900, 'image/jpeg'); if (url.length > 270000) url = await resizeImage(f, 640, 'image/jpeg'); var x = await api('studio-extras', 'shop-img', { itemId: it.id, dataUrl: url }); sh = x.shop; items = sh.items.map(function (i) { return Object.assign({}, i); }); toast('Photo added'); draw(); }
          catch (x) { toast(x.message); }
        };
      });
      $$('[data-imgdel]').forEach(function (b) { b.onclick = async function () { keep(); try { var x = await api('studio-extras', 'shop-img-delete', { itemId: items[Number(b.dataset.imgdel)].id }); sh = x.shop; items = sh.items.map(function (i) { return Object.assign({}, i); }); draw(); } catch (e) { toast(e.message); } }; });
      var on = $('#shOn'); if (on) on.onclick = function () { publish(true); };
      var off = $('#shOff'); if (off) off.onclick = function () { if (confirm('Unpublish your page? The link will stop working until you publish again.')) publish(false); };
      var cp = $('#shCopy'); if (cp) cp.onclick = function () { copyText(url); };
      var ss = $('#shShare'); if (ss) ss.onclick = function () { shareText(sh.title + ' — prices and ordering: ' + url); };
      var qb = $('#shQr'); if (qb) qb.onclick = async function () { var card = await reviewCard(url, 'See our prices & order', 'Scan with your phone camera to see what we offer and order on WhatsApp.'); shareOrDownload(card, 'price-list-qr.png', ''); };
    }
    function keep() {
      var g = function (id) { var e = $('#' + id); return e ? e.value : ''; };
      sh = Object.assign({}, sh, { slug: g('shSlug'), title: g('shTitle'), intro: g('shIntro'), area: g('shArea'), whatsapp: g('shWa'), orderNote: g('shNote') });
    }
    async function save() {
      keep(); var b = $('#shSave'); b.disabled = true; $('#shErr').classList.add('hidden');
      try { var x = await api('studio-extras', 'shop-save', { shop: { slug: sh.slug, title: sh.title, intro: sh.intro, area: sh.area, whatsapp: sh.whatsapp, orderNote: sh.orderNote, items: items } }); sh = x.shop; items = sh.items.map(function (i) { return Object.assign({}, i); }); toast('Page saved'); draw(); }
      catch (e) { $('#shErr').textContent = e.message; $('#shErr').classList.remove('hidden'); b.disabled = false; }
    }
    async function publish(onOff) {
      try { var x = await api('studio-extras', 'shop-publish', { on: onOff }); sh = x.shop; toast(onOff ? 'Your page is live 🎉' : 'Page unpublished'); draw(); } catch (e) { toast(e.message); }
    }
    draw();
  }

  // ───────────── account & billing ─────────────
  async function startCheckout(interval) {
    try { var r = await api('studio-billing', 'checkout', { interval: interval === 'year' ? 'year' : 'month' }); location.href = r.url; }
    catch (x) { if (x.code !== 'cancelled') toast(x.message); }
  }
  async function openPortal() {
    try { var r = await api('studio-billing', 'portal'); location.href = r.url; }
    catch (x) { if (x.code !== 'cancelled') toast(x.message); }
  }
  async function signOut() {
    try { await api('studio-auth', 'logout', {}, { quiet401: true }); } catch (e) {}
    S.boot = null; S.today = null; showSignIn();
  }

  function d(iso, y) { return fmtDate(iso, y ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long' }); }

  function planSection() {
    var a = S.boot.access, ad = S.boot.addon, l = S.boot.limits, m = S.boot.member;
    var html = '';
    // Business Club (only shown to Club members)
    if (m.isClub) {
      html += '<h2>Business Club</h2><div class="card stack"><div class="row" style="justify-content:space-between"><b>Annual membership</b><span class="pill ' + (a.membershipActive ? 'green' : 'cream" style="background:#ECEDF0;color:var(--muted)') + '">' + (a.membershipActive ? 'Active' : 'Not active') + '</span></div>' +
        '<div class="sub">' + (a.membershipActive ? 'Valid until <b>' + d(m.membershipExpiresAt, 1) + '</b>. Includes ' + l.standard + ' AI generations a day.' : 'Your Business Club membership isn’t active. <a href="/business-club">Renew it here</a>.') + '</div></div>';
    }
    // AI Power
    html += '<h2>AI Power</h2>';
    var period = ad && ad.interval === 'year' ? '£50/year' : '£5/month';
    if (ad && ['active', 'trialing'].indexOf(ad.status) > -1) {
      html += '<div class="card plan stack"><div class="row" style="justify-content:space-between"><b>AI Power · ' + (ad.interval === 'year' ? 'Yearly' : 'Monthly') + '</b><span class="pill gold">' + (ad.cancelAtPeriodEnd ? 'Ending' : 'Active') + '</span></div>' +
        '<div class="sub">' + l.power + ' generations a day · ' + period + '</div>' +
        '<div>' + (ad.cancelAtPeriodEnd ? 'Ends on <b>' + d(ad.currentPeriodEnd, 1) + '</b>.' + (a.membershipActive ? ' You’ll go back to ' + l.standard + ' a day with your Business Club membership.' : ' After that you can still view your library.') : 'Renews on <b>' + d(ad.currentPeriodEnd, 1) + '</b>.') + '</div>' +
        '<button class="btn ghost block" id="manage">' + (ad.cancelAtPeriodEnd ? 'Restart or manage subscription' : 'Switch plan, manage or cancel') + '</button></div>';
    } else if (ad && ['past_due', 'unpaid', 'incomplete'].indexOf(ad.status) > -1) {
      html += '<div class="card stack" style="border-color:var(--danger)"><b>AI Power is paused</b><div class="err">Your last payment didn’t go through. Update your card to get your ' + l.power + ' generations a day back.' + (a.membershipActive ? ' Your Business Club membership is not affected.' : '') + '</div>' +
        '<button class="btn primary block" id="manage">Update payment details</button></div>';
    } else if (S.boot.billing.enabled) {
      html += '<div class="card stack">' + (a.membershipActive ? '<p class="sub" style="margin:0">You have ' + l.standard + ' a day with Business Club. Upgrade for ' + l.power + ' a day.</p>' : '') + planChoices() + '</div>';
    } else if (!m.isClub) {
      html += '<div class="note">AI Power isn’t available right now.</div>';
    }
    return html;
  }

  function showAccount(section) {
    if (typeof section !== 'string') section = '';
    setChrome({ tabs: true, tab: 'account' });
    var p = S.boot.profile;
    app.innerHTML = '<main><h1>Account</h1><p class="sub" style="margin-top:4px">' + esc(S.boot.member.email) + '</p>' +
      planSection() +
      (p ? '<h2>Business profile</h2><div class="card"><b>' + esc(p.businessName) + '</b><div class="sub">' + esc(p.industry) + ' · ' + esc(p.location) + '</div>' +
        '<div class="sub" style="margin-top:4px">Tone: ' + esc(TONE_LABELS[p.tone] || p.tone) + (p.instagram ? ' · ' + esc(p.instagram) : '') + '</div>' +
        '<div class="sub" style="margin-top:4px">Customers find you on: ' + esc((p.channels || ['instagram']).map(channelName).join(', ')) + (p.mainChannel ? ' \u00b7 posts point to ' + esc(channelName(p.mainChannel)) : '') + '</div>' +
        (S.boot.listing ? '<div class="sub" style="margin-top:4px">Auntie Tobi listing: <a href="' + esc(S.boot.listing.url) + '" target="_blank" rel="noopener">' + esc(S.boot.listing.name) + '</a></div>' : '<div class="sub" style="margin-top:4px">No Auntie Tobi listing linked \u2014 add it in your profile.</div>') +
        '<button class="btn ghost block" style="margin-top:12px" id="editP">Edit business profile</button></div>' : '') +
      (p ? brandKitHtml() : '') + extrasAccountHtml() +
      '<h2>Help</h2><details class="faq"><summary>What counts as a generation?</summary><ul><li>Every <b>Create</b> or <b>Regenerate</b> that gives you a result = 1 generation.</li><li>A <b>30-day content plan uses 3</b>. Everything else uses 1.</li><li>Editing, copying, saving and browsing your library are free.</li><li>If it fails, you’re not charged.</li><li>Allowances reset at midnight (UK time). Unused generations don’t carry over.</li></ul></details>' +
      '<h2>Security</h2><div class="card stack"><p class="sub">You stay signed in on this device for up to 30 days of inactivity, and we’ll ask for a fresh email code at least every 90 days and before any payment.</p>' +
      '<button class="btn ghost block" id="out">Sign out</button><button class="btn link danger" id="outAll">Sign out on all devices</button></div></main>';
    var ep = $('#editP'); if (ep) ep.onclick = function () { showProfileForm(false); };
    $('#out').onclick = signOut;
    $('#outAll').onclick = async function () {
      if (!confirm('Sign out everywhere, including this device?')) return;
      try { await api('studio-auth', 'logout-all'); } catch (e) {}
      S.boot = null; showSignIn();
    };
    bindPlanChoices();
    bindBrandKit();
    bindExtrasAccount();
    if (section === 'brand') setTimeout(function () { var bk = $('#bkCard'); if (bk) bk.scrollIntoView({ block: 'start' }); }, 50);
    var mg = $('#manage'); if (mg) mg.onclick = openPortal;
  }

  start();
})();
</script>
</body>
</html>
