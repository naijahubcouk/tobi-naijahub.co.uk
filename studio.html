<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1E36">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://*.onesignal.com https://naijabiz.b-cdn.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://onesignal.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com https://onesignal.com; connect-src 'self' https://onesignal.com https://*.onesignal.com; form-action 'self'; base-uri 'none'">
<title>Business Studio — Auntie Tobi</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/studio-icon-32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/studio-icon-16.png?v=1">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/studio-icon-48.png?v=1">
<link rel="apple-touch-icon" href="/icons/studio-icon-180.png?v=1">
<link rel="manifest" id="mfLink" href="/studio-manifest.json">
<script>/* The app's own address uses its own home-screen settings. */ if (/^studio\./i.test(location.host)) document.getElementById('mfLink').href = '/studio-app-manifest.json';</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Business Studio">
<script src="/studio-qr.js" defer></script>
<script src="/studio-carousel.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#057A44;--green-d:#04613A;--green-l:#E3F2EA;
  --gold:#FFB81C;--gold-l:#FFF1CF;--navy:#0F1E36;--navy-2:#1C2E4D;
  --cream:#FBF6EC;--card:#FFFFFF;--line:#EADFC8;--muted:#5B6475;--danger:#B3261E;--danger-l:#FCE8E6;
  --radius:16px;--shadow:0 1px 2px rgba(15,30,54,.06),0 4px 16px rgba(15,30,54,.06);
  --font:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --display:'Fraunces',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--navy);font-family:var(--font);font-size:17.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
body.no-nav{padding-bottom:24px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--green)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--cream);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:var(--cream)}
.top .brand{font-family:var(--display);font-weight:700;font-size:19.5px;letter-spacing:.2px;line-height:1.1}
.top .brand small{display:block;font-family:var(--font);font-weight:500;font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.top .back{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--cream);margin-left:-6px}
.top .back:focus-visible,.top .back:hover{background:var(--navy-2)}
.top .spacer{flex:1}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700;letter-spacing:.3px}
.pill.gold{background:var(--gold);color:var(--navy)}
.pill.green{background:var(--green-l);color:var(--green-d)}
.pill.grey{background:#ECEDF0;color:var(--muted)}
.pill.goldl{background:var(--gold-l);color:#7A5300}
.opt{font-weight:400;color:var(--muted)}
.chips.libtabs{flex-wrap:nowrap !important;overflow-x:auto;scrollbar-width:none;margin-left:-16px !important;margin-right:-16px !important;padding:2px 16px}.libtabs::-webkit-scrollbar{display:none}.libtabs .chip{flex:0 0 auto}
.acctags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}.acctag{display:inline-block;align-self:flex-start;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:#ECEDF0;color:var(--navy);white-space:nowrap}.acctag.club{background:#E3F4EA;color:#05663A}.acctag.free{background:#FFF1C9;color:#7A5300}.modcard .acctag{margin:6px 0 2px;justify-self:start;width:max-content;max-width:100%}.ldot.tnum{font-weight:800;font-size:14px;color:var(--muted)}
.aiopt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line,#e5e7eb);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer}.aiopt b{display:block;font-size:16.5px}.aiopt span{display:block;color:var(--muted);font-size:15px;margin-top:2px}.aiopt[aria-pressed=true]{border-color:#16a34a;background:#f0fdf4}
.pill.cream{background:rgba(251,246,236,.12);color:var(--cream)}

main{max-width:640px;margin:0 auto;padding:16px}
h1{font-family:var(--display);font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.2px}
h2{font-family:var(--display);font-size:21.5px;line-height:1.2;font-weight:700;margin:22px 0 10px}
.sub{color:var(--muted);font-size:16.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}

/* forms */
label.f{display:block;font-weight:700;font-size:15.5px;margin-bottom:6px}
label.f .opt{font-weight:400;color:var(--muted)}
.hint{font-size:15px;color:var(--muted);margin-top:4px}
input:not([type]),input[type=search],input[type=email],input[type=text],input[type=url],input[type=date],input[type=number],textarea,select{
  width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17.5px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(5,122,68,.15)}
.code-input{font-size:32px!important;letter-spacing:12px;text-align:center;font-weight:700;padding:14px!important}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15.5px;font-weight:500;line-height:1.2}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:500}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line);transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .15s}
.switch[aria-checked=true]{background:var(--green)}
.switch[aria-checked=true]::after{left:23px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:700;font-size:17.5px;min-height:48px;transition:transform .05s,background .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--green);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--green-d)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy)}
.btn.small{min-height:38px;padding:8px 12px;font-size:15.5px;border-radius:10px}
.btn.block{width:100%}
.btn.link{padding:6px 0;min-height:0;color:var(--green);font-weight:700}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.err{background:var(--danger-l);color:var(--danger);border-radius:12px;padding:10px 12px;font-size:15.5px;font-weight:500}
.note{background:var(--gold-l);border-radius:12px;padding:12px;font-size:15.5px}
.li.tl{align-items:flex-start}.li.tl .t small{display:block;line-height:1.4}.li.tl .snip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.li.tl .t{min-width:0}.li.tl .tli{font-size:21.5px;line-height:1.2;margin-top:1px}.li.tl.locked{opacity:.78}.li.tl .tlk{font-size:17.5px}
.rtool .useblock .ubh{display:none}.rtool .useblock{background:#fff;padding:14px}
.cpack{text-align:left;width:100%;cursor:pointer}
.fbres{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line,#EEE6D3);border-radius:12px;padding:10px 12px}

/* sign in */
.auth-wrap{max-width:420px;margin:0 auto;padding:28px 18px}
.auth-hero{text-align:center;margin-bottom:20px}
.auth-hero img{width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);background:#fff;margin-bottom:12px}
.auth-hero .kicker{font-size:14px;letter-spacing:1.6px;text-transform:uppercase;color:var(--green);font-weight:700}

/* allowance */
.allow{background:var(--navy);color:var(--cream);border:0;position:relative;overflow:hidden}
.allow::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,28,.25),transparent 70%)}
.allow .big{font-family:var(--display);font-size:47px;line-height:1;font-weight:700;color:var(--gold)}
.bar{height:8px;background:rgba(251,246,236,.15);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.bar span{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .4s}
.allow .meta{font-size:15px;color:rgba(251,246,236,.8)}
.allow button.link{color:var(--gold);font-weight:700;font-size:15px;text-decoration:underline;text-underline-offset:3px}

/* tools */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:116px;box-shadow:var(--shadow);transition:border-color .15s,transform .05s}
.tool:hover{border-color:var(--green)}
.tool:active{transform:scale(.98)}
.tool .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--green-l);color:var(--green)}
.tool:nth-child(3n+2) .ico{background:var(--gold-l);color:#9A6A00}
.tool:nth-child(3n) .ico{background:#E7EAF0;color:var(--navy)}
.tool b{font-size:16.5px;line-height:1.25}
.tool span{font-size:14.5px;color:var(--muted);line-height:1.35}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{color:var(--muted);font-size:14.5px}
.li .star{color:var(--gold);font-size:19.5px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:16.5px}

/* conversation */
.bubble{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.bubble img{width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);background:#fff;flex:none}
.bubble p{background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;font-size:16.5px;box-shadow:var(--shadow)}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:.4;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.option{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.option .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--green)}
.option textarea{border:0;padding:4px 2px;min-height:60px;box-shadow:none;font-size:16.5px;line-height:1.55;resize:none;overflow:hidden}
.option textarea:focus{box-shadow:none;background:#FFFCF5}
.cost{font-size:15px;color:var(--muted);text-align:center;margin-top:8px}
.saved-tag{font-size:14px;color:var(--muted)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:13.5px;font-weight:700;color:var(--muted);border-radius:12px}
nav.tabs button[aria-current=page]{color:var(--green)}
nav.tabs button[aria-current=page] svg{background:var(--green-l)}
nav.tabs svg{width:40px;height:28px;padding:4px 10px;border-radius:999px}

/* modal & toast */
.scrim{position:fixed;inset:0;background:rgba(15,30,54,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--cream);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
@media(min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 16px;border-radius:12px;font-size:15.5px;font-weight:500;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
details.faq{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.faq summary{font-weight:700;cursor:pointer}
details.faq ul{margin:8px 0 0 18px;font-size:15.5px;color:var(--navy)}
details.faq li+li{margin-top:4px}
.steps{display:flex;gap:6px;margin:6px 0 16px}
.steps span{flex:1;height:4px;border-radius:999px;background:var(--line)}
.steps span.on{background:var(--green)}
.plan{border:2px solid var(--gold);background:linear-gradient(180deg,#fff, var(--gold-l))}
.plan .price{font-family:var(--display);font-size:32px;font-weight:700}
.plan ul{margin:10px 0 14px 18px;font-size:16px}
/* growth */
.act{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.act.done{opacity:.6}
.act .tick{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;margin-top:2px}
.act.done .tick{background:var(--green);border-color:var(--green)}
.act .kind{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green)}
.act .kind.sales{color:#9A6A00}.act .kind.visibility{color:var(--navy)}
.act b{display:block;font-size:17px;line-height:1.3;margin:2px 0}
.act p{font-size:15px;color:var(--muted);margin-bottom:8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick button{background:var(--navy);color:var(--cream);border-radius:14px;padding:12px;text-align:left;display:flex;gap:8px;align-items:center;font-weight:700;font-size:15.5px;line-height:1.2;min-height:56px}
.quick button svg{color:var(--gold);flex:none}
.tipcard{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.tipcard .tk{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tipcard .tk img{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:var(--cream);flex:none}
.tipcard .tk small{display:block;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--green)}
.tipcard .tk span{font-size:15px;color:var(--muted)}
.tipcard h3{font-family:var(--display);font-size:22.5px;line-height:1.25;margin:2px 0 8px;color:var(--navy)}
.tipcard p.tb{font-size:16.5px;line-height:1.55;margin:0 0 12px}
.tipcard .try{background:var(--green-l);border-radius:12px;padding:11px 12px;font-size:15.5px;line-height:1.45;margin-bottom:12px}
.tipcard .try b{color:var(--green-d)}
.tipcard .tact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.goalbar{display:flex;align-items:center;gap:8px;background:var(--gold-l);border-radius:12px;padding:10px 12px;font-size:15.5px}
.goalbar b{flex:1}
.cal-day{font-size:14px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.cal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.cal .fmt{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:2px 7px;background:#E7EAF0;margin-right:6px}
.cal .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cal .st .chip{padding:5px 10px;font-size:14.5px}
.num{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.num:last-child{border-bottom:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:21.5px;font-weight:700}
.step input{width:76px;text-align:center;padding:8px}
.wk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wk div{background:var(--cream);border-radius:12px;padding:10px;text-align:center}
.wk b{display:block;font-family:var(--display);font-size:25px;line-height:1.1}
.wk span{font-size:14px;color:var(--muted)}
[hidden]{display:none!important}
.row>div{min-width:0}
a.btn{text-decoration:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.optact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.logo-box{width:72px;height:72px;border-radius:14px;border:1.5px dashed var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);flex:none;overflow:hidden}
.logo-box img{width:100%;height:100%;object-fit:contain}
.colour{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15.5px;font-weight:600;cursor:pointer}
.colour input{width:40px;height:40px;border:0;padding:0;background:none;border-radius:8px;cursor:pointer;flex:none}
.imgprev{margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#fff}
.imgprev canvas{display:block;width:100%;height:auto}
.posted{font-size:13px;font-weight:700;color:var(--green-d);background:var(--green-l);border-radius:999px;padding:2px 8px;white-space:nowrap}
@media print{body.printing>*:not(#app){display:none!important}body.printing #app>*:not(main),body.printing main>*:not(#printArea){display:none!important}body.printing,body.printing #app,body.printing main{background:#fff!important;padding:0!important;margin:0!important;max-width:none!important}body.printing .docpaper{border:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
[data-lesson] .t b,.li.soon .t b{white-space:normal}
.li.soon{background:transparent;border-style:dashed;opacity:.75}
.li .snip{display:block;margin-top:2px}
.ldot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff}
.ldot.done{background:var(--green);border-color:var(--green)}
.reswelcome{background:#F2FBF6;border:1px solid #CFEBDB;border-radius:var(--radius);padding:16px}
.reswelcome h2{margin:0 0 6px;font-size:21.5px}
.reswelcome p{font-size:16px;color:var(--navy-2)}
.rsearch{display:flex;gap:8px;margin-top:12px}
.rsearch input{flex:1;min-width:0}
.pbar{display:block;height:7px;background:#E6EFE9;border-radius:999px;overflow:hidden}
.pbar span{display:block;height:100%;background:var(--green);border-radius:999px}
.modgrid{display:grid;grid-template-columns:1fr;gap:10px}
.modcard{display:grid!important;grid-template-columns:40px 1fr;column-gap:12px;row-gap:3px}
.modcard>*{grid-column:2}.modcard .mi{grid-column:1;grid-row:1/span 6}
@media(min-width:560px){.modgrid{grid-template-columns:1fr 1fr}}

  async function api(fn, action, payload, opts) {
    opts = opts || {};

    var res, data;
    try {
      res = await fetch('/.netlify/functions/' + fn, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-Studio': '1' },
        body: JSON.stringify(body)
      });
      data = await res.json().catch(function () { return {}; });
    } catch (e) {
      var ne = new Error('You seem to be offline. Please check your connection and try again.'); ne.code = 'network'; throw ne;
    }
    if (res.ok) return data;
    var err = new Error(data.message || 'Something went wrong. Please try again.');
    err.code = data.error; err.status = res.status; err.data = data;
    if (res.status === 401 && !opts.quiet401) { S.boot = null; showSignIn(); }
    if (err.code === 'reauth_required' && !opts.noStepUp) {
      await stepUp();
      return api(fn, action, payload, Object.assign({}, opts, { noStepUp: true }));
    }
    throw err;

  async function showProfileForm(firstTime) {
    var p = Object.assign({}, S.boot.profile || {});

    if (firstTime) await maybeConfirmListing(p);
    if (firstTime && !p._listing) await showFindBusiness(p);
    if (!p.channels || !p.channels.length) p.channels = p.listingSlug ? ['listing'] : ['instagram'];
    var step = 0;
    function collect() {
      $$('[name]', app).forEach(function (el) { p[el.name] = el.name === 'ctas' ? el.value.split('\n') : el.value; });
      var tc = $('[data-single=tone] [aria-pressed=true]', app); if (tc) p.tone = tc.dataset.val;
      var mc = $('[data-multi=channels]', app); if (mc) p.channels = $$('.chip[aria-pressed=true]', mc).map(function (c) { return c.dataset.val; });
      var mn = $('#mainChips [aria-pressed=true]', app); if (mn) p.mainChannel = mn.dataset.val;
    }

      var box = $('#mainChips', app); if (!box) return;

      if (!ch.length) ch = ['instagram'];

      box.innerHTML = ch.map(function (c) { return '<button type="button" class="chip" data-val="' + c + '" aria-pressed="' + (c === p.mainChannel) + '">' + esc(channelName(c)) + '</button>'; }).join('');
      $$('.chip', box).forEach(function (c) { c.onclick = function () { p.mainChannel = c.dataset.val; $$('.chip', box).forEach(function (x) { x.setAttribute('aria-pressed', x === c); }); }; });
    }
    function bindListing() {
      var ck = $('#checkL', app), ul = $('#unlinkL', app);
      if (ck) ck.onclick = async function () {
        var link = $('#pf_listingLink').value.trim(), out = $('#lres');
        if (!link) return;
        ck.disabled = true; out.innerHTML = '<p class="hint">Checking…</p>';
        try {
          var r = await api('studio-api', 'listing-lookup', { link: link });
          var L = r.listing;
          out.innerHTML = '<div class="note stack" style="margin-top:8px"><div>Found: <b>' + esc(L.name) + '</b>' + (L.loc ? ' · ' + esc(L.loc) : '') + '</div><button type="button" class="btn primary small" id="useL">Link this listing and fill in my details</button></div>';

        } catch (x) { out.innerHTML = '<div class="err" style="margin-top:8px">' + esc(x.message) + '</div>'; }

      };

    }
    function render() {
      var steps = firstTime ? [PROFILE_STEPS[step]] : PROFILE_STEPS;
      var last = PROFILE_STEPS.length - 1;
      setChrome({ tabs: !firstTime, tab: 'account', back: firstTime ? (step > 0 ? function () { collect(); step--; render(); } : null) : showAccount });
      var hello = ['Welcome! Tell me about your business once, and I’ll use it every time I write for you. You can change it any time.', 'Lovely. Now, what do you sell and who buys it?', 'Where do customers find you? I’ll point your posts there.', 'Last bit — how should you sound?'];
      app.innerHTML = '<main><form id="pform" novalidate>' +
        (firstTime ? '<div class="steps">' + PROFILE_STEPS.map(function (s, i) { return '<span class="' + (i <= step ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
          '<div class="bubble"><img src="/tobi-face-128.png" alt=""><p>' + (step === 0 && p._filledFrom ? 'I\u2019ve filled in what I could from your ' + (p._filledFrom === 'listing' ? 'Auntie Tobi listing' : 'website') + ' \u2014 check it and change anything you like.' : hello[step]) + '</p></div>'
          : '<h1>Business profile</h1><p class="sub" style="margin:6px 0 16px">Used automatically in everything you create.</p>') +
        steps.map(function (s) { return (firstTime ? '' : '<h2>' + esc(s.title) + '</h2>') + '<div class="card stack">' + s.fields.map(function (f) { return fieldHtml(f, p); }).join('') + '</div>'; }).join('') +

        '<button class="btn primary block" style="margin-top:16px" id="psave">' + (firstTime && step < last ? 'Next' : 'Save profile') + '</button></form></main>';

        var missing = [];
        stepDef.forEach(function (s) { s.fields.forEach(function (f) { if (['text', 'area'].indexOf(f[2]) > -1 && !f[5] && !String(p[f[0]] || '').trim()) missing.push(f[1]); }); });

        } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Save profile'; }
      });
    }
    render();
  }

  // ───────────── Track: progress + weekly summary ─────────────

  async function showTrack(date) {

    bindTrackHeader();
    var p, sum;
    try { p = await api('studio-growth', 'progress-get'); sum = await api('studio-growth', 'summary'); }
    catch (x) { if ($('#trBox')) $('#trBox').innerHTML = '<div class="err">' + esc(x.message) + '</div>'; return; }
    if (!$('#trBox')) return;
    var today = p.today, yday = new Date(Date.parse(today + 'T12:00:00Z') - 86400000).toISOString().slice(0, 10);
    date = date === yday ? yday : (date || today);
    function draw() {

        '<div>' + TRACK_FIELDS.map(function (f) {

            (f[0] === 'salesGbp' ? '' : '<button type="button" data-dec="' + f[0] + '" aria-label="Less">−</button>') +
            '<input id="n_' + f[0] + '" type="number" inputmode="' + (f[0] === 'salesGbp' ? 'decimal' : 'numeric') + '" min="0" step="' + (f[0] === 'salesGbp' ? '0.01' : '1') + '" value="' + (e[f[0]] || 0) + '">' +

        '<div class="err hidden" id="nerr" role="alert"></div><button class="btn primary block" id="nsave">' + (p.entries[date] ? 'Update' : 'Save') + '</button></div>' +

  // ───────────── tools ─────────────
  function toolDef(id) { return S.boot.tools.filter(function (t) { return t.id === id; })[0]; }

  // opts: { back, onSuccess(item), autoRun, intro }
  // Free plan: an advanced tool shows what it does and how to unlock it (nothing is charged for opening it).
  function showLockedTool(t, m, opts) {

    opts = opts || {};

      prefill = prefill || {};
      return showCarouselMaker({ topic: prefill.topic || '', slides: /^(?:[3-9]|10)$/.test(String(prefill.slides || '')) ? String(prefill.slides) : undefined, purpose: prefill.purpose, source: prefill.source || '' }, opts);
    }
    var t = toolDef(toolId); if (!t) return showHome();
    var m = TOOL_META[toolId] || {};
    if (t.paid && isFree()) return showLockedTool(t, m, opts);
    var po = isFree() && t.paidOption ? t.paidOption : null;   // e.g. the 30-day planner on the Free plan
    var input = {};
    t.fields.forEach(function (f) { input[f.name] = prefill && prefill[f.name] !== undefined ? prefill[f.name] : (f.name === 'platform' ? defaultPlatform() : f.type === 'text' ? '' : f.default); });

      '<form class="card stack" id="tform" novalidate>' + t.fields.map(function (f) {
        if (f.type === 'text') return '<div><label class="f" for="tf_' + f.name + '">' + esc(f.label) + (f.required ? '' : ' <span class="opt">(optional)</span>') + '</label><textarea id="tf_' + f.name + '" data-field="' + f.name + '" maxlength="' + f.max + '" rows="' + (f.max > 600 ? 4 : 2) + '"' + (f.required ? ' required' : '') + '>' + esc(input[f.name]) + '</textarea></div>';
        if (f.type === 'choice') return '<div><span class="f" style="display:block;font-weight:700;font-size:15.5px;margin-bottom:6px">' + esc(f.label) + '</span><div class="chips" data-choice="' + f.name + '">' + f.options.map(function (o) { var lk = po && po.field === f.name && po.values.indexOf(o) > -1; return '<button type="button" class="chip" data-val="' + esc(o) + '"' + (lk ? ' data-locked="1"' : '') + ' aria-pressed="' + (o === input[f.name]) + '">' + esc(CHOICE_LABELS[o] || (o === '7' || o === '30' ? o + ' days' : o.charAt(0).toUpperCase() + o.slice(1))) + (lk ? ' 🔒' : '') + '</button>'; }).join('') + '</div></div>';
        if (f.type === 'bool') return '<div class="toggle"><span id="lb_' + f.name + '">' + esc(f.label) + '</span><button type="button" class="switch" role="switch" aria-labelledby="lb_' + f.name + '" data-bool="' + f.name + '" aria-checked="' + !!input[f.name] + '"></button></div>';

      }).join('') +
      '<div class="err hidden" id="terr" role="alert"></div>' +
      '<button class="btn primary block" id="go">' + icon('<path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.8-.7z"/>', 18) + ' Create</button>' +
      '<div class="cost" id="cost"></div></form>' +
      '<div id="result" style="margin-top:18px"></div></main>';

    $$('[data-choice]', app).forEach(function (g) {
      $$('.chip', g).forEach(function (c) { c.onclick = function () { if (c.dataset.locked) return showUpgrade(lcFirst(po.label)); $$('.chip', g).forEach(function (x) { x.setAttribute('aria-pressed', x === c); }); }; });

    var first = $('textarea', app); if (first && !prefill) setTimeout(function () { first.focus(); }, 60);

    function readInput() {
      var out = {};

    function costFor(inp) { return (t.cost && t.cost.values[inp[t.cost.field]]) || 1; }
    function updateCost() {
      var c = costFor(readInput());
      $('#cost').textContent = 'Uses ' + c + ' AI credit' + (c > 1 ? 's' : '') + ' \u00b7 ' + S.boot.usage.remaining + ' daily left' + (creditBal() ? ' + ' + creditBal() + ' extra' : '');

    async function run(inp) {
      var err = $('#terr'); err.classList.add('hidden');

      if (miss.length) { err.textContent = 'Please fill in: ' + miss[0].label; err.classList.remove('hidden'); return; }
      if (avail() <= 0) return showLimitReached();

    if (opts.autoRun) run(readInput());
  }

  function addToHistory(item) {

  }

  function splitOptions(text) {
    return String(text).split(/\n\s*-{3,}\s*\n/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // Editable result with copy / save / regenerate. Edits autosave (free).
  var NOT_POST = { message: 1, followup: 1, complaint: 1, idealcustomer: 1, usp: 1, seo: 1, salesideas: 1, growth30: 1, collab: 1, checkup: 1, weekly: 1, planner: 1, hashtags: 1, bio: 1, faq: 1 };

      }).join('') + '</div>' +

      (onRegenerate ? '<button class="btn ghost small" id="regen">\u21bb Regenerate <span class="saved-tag">(' + (item.cost || 1) + ' AI credit' + ((item.cost || 1) > 1 ? 's' : '') + ')</span></button>' : '') +

  function resizeImage(file, maxSide, type) {
    return new Promise(function (res, rej) {
      if (!/^image\//.test(file.type)) return rej(new Error('Please choose an image.'));
      var fr = new FileReader();
      fr.onerror = function () { rej(new Error('Couldn’t read that image.')); };
      fr.onload = function () {
        var im = new Image();
        im.onerror = function () { rej(new Error('Couldn’t read that image.')); };
        im.onload = function () {
          var r = Math.min(1, maxSide / Math.max(im.width, im.height)), c = document.createElement('canvas');
          c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
          var x = c.getContext('2d');
          if (type === 'image/jpeg') { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
          x.drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL(type || 'image/png', 0.86));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  // Light lesson formatting: ## heading, - bullets, 1. numbers, **bold**, > tip, [link](https://…)
  function rt(src) {
    function inline(s) {
      return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g, function (m, t, u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>'; });
    }
    var out = [], list = null;
    function close() { if (list) { out.push('</' + list + '>'); list = null; } }
    String(src || '').replace(/\r/g, '').split(/\n{2,}/).forEach(function (block) {
      var lines = block.split('\n');
      if (lines.every(function (l) { return /^\s*-\s+/.test(l); })) { close(); out.push('<ul>' + lines.map(function (l) { return '<li>' + inline(l.replace(/^\s*-\s+/, '')) + '</li>'; }).join('') + '</ul>'); return; }
      if (lines.every(function (l) { return /^\s*\d+\.\s+/.test(l); })) { close(); out.push('<ol>' + lines.map(function (l) { return '<li>' + inline(l.replace(/^\s*\d+\.\s+/, '')) + '</li>'; }).join('') + '</ol>'); return; }
      close();
      if (/^##\s+/.test(block)) { out.push('<h3>' + inline(block.replace(/^##\s+/, '')) + '</h3>'); return; }
      if (/^>\s?/.test(block)) { out.push('<div class="tipbox">' + inline(block.replace(/^>\s?/gm, '')).replace(/\n/g, '<br>') + '</div>'); return; }
      out.push('<p>' + inline(block).replace(/\n/g, '<br>') + '</p>');
    });
    close();

  var ONESIGNAL_APP_ID = '34d14bd0-a5fe-40c4-9b8e-56c1f178cebe';
  function loadOneSignal() {
    if (S.osPromise) return S.osPromise;
    // On the app's own address, reminders use its own OneSignal app (set in Netlify as STUDIO_ONESIGNAL_APP_ID).
    if (/^studio\./i.test(location.host)) { var sid = S.appCfg && S.appCfg.pushApp; if (!sid) return Promise.reject(new Error('Reminders are being set up for the new Business Studio address — please try again soon.')); ONESIGNAL_APP_ID = sid; }
    S.osPromise = new Promise(function (resolve, reject) {
      var done = false, timer = setTimeout(function () { if (!done) { S.osPromise = null; reject(new Error('Reminders couldn’t start. They only work on the live Auntie Tobi site, in a browser that supports notifications.')); } }, 15000);
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function (OS) {
        try { await OS.init({ appId: ONESIGNAL_APP_ID, serviceWorkerPath: 'sw.js', serviceWorkerParam: { scope: '/' }, notifyButton: { enable: false } }); done = true; clearTimeout(timer); resolve(OS); }
        catch (e) { done = true; clearTimeout(timer); S.osPromise = null; reject(new Error('Reminders only work on the live Auntie Tobi site.')); }
      });
      var s = document.createElement('script'); s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; s.defer = true;
      s.onerror = function () { done = true; clearTimeout(timer); S.osPromise = null; reject(new Error('Couldn’t load notifications. Check your connection.')); };
      document.head.appendChild(s);
    });
    return S.osPromise;
  }
  async function setReminders(on) {
    if (!('Notification' in window)) throw new Error(isIOS() ? 'On iPhone, add Business Studio to your home screen first, then turn on reminders from the app.' : 'This browser doesn’t support notifications.');
    var OS = await loadOneSignal();
    if (on) {
      await OS.Notifications.requestPermission();
      if (!OS.Notifications.permission) throw new Error('Notifications are blocked for this site. Allow them in your browser settings, then try again.');
      var p = await api('studio-extras', 'prefs-get');
      await OS.login(p.pushId);
      OS.User.addTag('studio_reminder', '1');
    } else {
      try { OS.User.removeTag('studio_reminder'); } catch (e) {}
    }
    await api('studio-extras', 'prefs-save', { prefs: { remindersOn: on } });
  }

  // ───────────── Follow-ups (members follow up with their customers) ─────────────
  var FU_SOURCES = ['Instagram', 'WhatsApp', 'TikTok', 'Facebook', 'Auntie Tobi', 'Referral', 'Website', 'Walk-in', 'Other'];
  var FU_KEEP = [[0, 'Off'], [14, 'Every 2 weeks'], [30, 'Monthly'], [60, 'Every 2 months'], [90, 'Every 3 months'], [180, 'Every 6 months'], [365, 'Yearly']];
  var FU_STAGE = { new: ['New', 'cream'], contacted: ['Contacted', 'cream'], quoted: ['Quoted', 'gold'], booked: ['Booked', 'green'], completed: ['Completed', 'green'], notnow: ['Not now', 'grey'], lost: ['Lost', 'grey'] };
  var FU_KIND = { fu1: 'Follow up', fu2: 'Second follow-up', checkback: 'Check back in', thanks: 'Say thank you', keep: 'Keep in touch' };

  function fuFirst(n) { return (n || '').trim().split(/\s+/)[0] || 'there'; }
  function fuAgo(iso) {
    var d = Math.round((Date.parse(S.fuToday || new Date().toISOString().slice(0, 10)) - Date.parse(String(iso).slice(0, 10))) / 86400000);
    return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 14 ? d + ' days ago' : d < 60 ? Math.round(d / 7) + ' weeks ago' : Math.round(d / 30) + ' months ago';
  }
  function fuPeriod(days) { return days >= 330 ? 'a year' : days >= 45 ? Math.round(days / 30) + ' months' : days >= 12 ? Math.round(days / 7) + ' weeks' : days + ' days'; }
  function fuMessage(it, kind, reviewLink) {
    var f = fuFirst(it.name), biz = (S.boot.profile && S.boot.profile.businessName) || '', about = it.about || 'your enquiry';
    var sign = biz ? '\n\nThank you — ' + biz : '';
    if (kind === 'fu1') return 'Hi ' + f + ', just checking in about ' + about + ' 😊 Did you have any questions, or would you like me to go ahead and book you in or take your order? Happy to help.' + sign;
    if (kind === 'fu2') return 'Hi ' + f + ', I’m planning my bookings for the next couple of weeks. Would you still like ' + about + '? No worries at all if plans have changed — just let me know 😊' + sign;
    if (kind === 'checkback') return 'Hi ' + f + ', hope you’re well! You asked about ' + about + ' a little while ago. I have availability coming up — would you like me to send you the details?' + sign;
    if (kind === 'thanks') return 'Hi ' + f + ', thank you so much for choosing ' + (biz || 'us') + '! 💚 I really hope you loved your ' + about + '.' + (reviewLink ? '\n\nIf you have a minute, an honest review would really help my small business: ' + reviewLink : '') + sign;
    if (kind === 'keep') {
      var since = it.bookedAt ? Math.round((Date.now() - Date.parse(it.bookedAt)) / 86400000) : it.keepDays || 30;
      if (it.keepKind === 'rebook') return 'Hi ' + f + ', hope you’re well! It’s been about ' + fuPeriod(since) + ' since your ' + about + '. Would you like me to save you a slot or take your next order? I have availability on [dates].' + sign;

        'Hi ' + f + ', hope you’re well! 😊 Just a quick hello from ' + (biz || 'us') + ' — I have availability coming up if you need anything. Any celebrations or plans coming up?',

      row('⭐', 'Featured Business (app & website)', b.featured.done ? 'Live since ' + esc(dmy(b.featured.date)) : 'Being set up', b.featured.done) +
      row('🛍️', 'Marketplace listing', b.marketplace.done ? 'Live since ' + esc(dmy(b.marketplace.date)) : 'Not listed yet', b.marketplace.done,
        b.marketplace.done ? '<button class="btn link" style="font-size:15px;padding:0;min-height:0" data-gomkt="1">Manage my listing →</button>' : '<a class="btn link" style="font-size:15px;padding:0;min-height:0" href="/marketplace/list" target="_blank" rel="noopener">Add my product or service →</a>') +
      row('✅', 'Verification badge', b.badge === 'yes' ? 'Verified' : b.verify && b.verify.status === 'pending' ? '⏳ Verification requested (Companies House ' + esc(b.verify.number) + ') — Auntie Tobi will check' : b.badge === 'not_eligible' || (b.verify && b.verify.status === 'not_eligible') ? 'Not verified at the moment' + (b.verify && b.verify.note ? ' — ' + esc(b.verify.note) : '') : 'Not verified yet', b.badge === 'yes',
        b.badge === 'yes' || (b.verify && b.verify.status === 'pending') ? '' : '<button class="btn link" style="font-size:15px;padding:0;min-height:0" data-goverify="1">Verify your Business →</button>') +
      [
      ['discovery', '💚', 'Discovery features', 'feature'], ['stories', '📲', 'Instagram Story reposts', 'repost'], ['reposts', '🖼️', 'Instagram Post/Reel reposts', 'repost'], ['collabs', '🤝', 'Collabs', 'collab']].map(function (c) {
        var n = (b.counts || {})[c[0]] || 0;
        return row(c[1], c[2], n ? n + ' ' + c[3] + (n === 1 ? '' : 's') + ' this membership year' : 'Not yet — they happen through the year', n > 0);
      }).join('') +
      row('🧭', 'Business Check-Up/Accountability', b.checkup.done ? 'Done ' + esc(dmy(b.checkup.date)) + (b.checkup.priorities.length ? ' · ' + b.prioritiesDone.length + ' of ' + b.checkup.priorities.length + ' priorities done' : '') : '', b.checkup.done) +
      benFeedHtml(b.feed || []);
    $$('[data-gomkt]', card).forEach(function (x) { x.onclick = function () { showMarket(showAccount); }; });
    $$('[data-goverify]', card).forEach(function (x) { x.onclick = function () { showVerify(showAccount); }; });
    if (S.nudges) S.nudges.shared = [];
    var sc = $('#sharedCard'); if (sc) sc.remove();
  }
  var BEN_ICO = { verified: '✅', stories: '📲', reposts: '🖼️', reels: '🎬', discovery: '💚', collabs: '🤝', spotlight: '📣', featured: '⭐', marketplace: '🛍️', checkup: '📊' };
  function benFeedItem(e) {
    return '<div class="benrow" style="padding:6px 0"><span class="benico">' + (BEN_ICO[e.kind] || '💚') + '</span><div style="flex:1;min-width:0"><b>' + esc(e.label) + '</b> <span class="hint" style="margin:0">' + esc(dmy(e.at)) + '</span>' +
      (e.note ? '<div class="hint" style="margin:0">' + esc(e.note) + '</div>' : '') + (e.link ? '<div><a class="btn link" style="font-size:15px;padding:0;min-height:0" target="_blank" rel="noopener" href="' + esc(e.link) + '">View →</a></div>' : '') + '</div></div>';
  }
  function benFeedHtml(feed) {
    if (!feed.length) return '<div style="border-top:1px solid var(--line);padding-top:10px"><b>What Auntie Tobi has done for you</b><p class="hint" style="margin:4px 0 0">Nothing yet this membership year — it’ll appear here, with dates, as soon as it happens.</p></div>';
    var first = feed.slice(0, 8), rest = feed.slice(8);
    return '<div style="border-top:1px solid var(--line);padding-top:10px"><b>What Auntie Tobi has done for you</b> <span class="hint" style="margin:0">(' + feed.length + ' this year)</span>' + first.map(benFeedItem).join('') +
      (rest.length ? '<details><summary class="hint" style="cursor:pointer;margin:4px 0">Show ' + rest.length + ' more</summary>' + rest.map(benFeedItem).join('') + '</details>' : '') + '</div>';
  }
  function sharedCard(items) {
    if (!items || !items.length) return '';
    return '<section class="card stack shared" id="sharedCard"><b>' + (items.every(function (i) { return /stories|reposts|reels|discovery|collabs|spotlight/.test(i.kind); }) ? '💚 Auntie Tobi shared your business' : '💚 News from Auntie Tobi') + '</b>' + items.slice(0, 4).map(benFeedItem).join('') +
      (items.length > 4 ? '<p class="hint" style="margin:0">…and ' + (items.length - 4) + ' more in Account → My benefits.</p>' : '') +
      '<div class="row"><button class="btn small primary" id="sharedOk">Thank you 💚</button><button class="btn link" id="sharedAll" style="font-size:15px">See all my benefits</button></div></section>';
  }
  function bindShared(root) {
    var ok = $('#sharedOk', root), all = $('#sharedAll', root);
    if (ok) ok.onclick = async function () { var c = $('#sharedCard'); if (c) c.remove(); try { await api('studio-extras', 'benefits-seen'); } catch (x) {} };
    if (all) all.onclick = function () { showAccount(); };
  }

  // ───────────── account & billing ─────────────
  async function startCheckout(interval, tier) {
    try { var r = await api('studio-billing', 'checkout', { interval: interval === 'year' ? 'year' : 'month', tier: tier === 'pro' ? 'pro' : 'plus' }); location.href = r.url; }
    catch (x) { if (x.code !== 'cancelled') toast(x.message); }
  }
  // Cancel in one tap: stops renewal, keeps the plan until the end date.
  function cancelSheet() {
    var ad = S.boot.addon || {}, a = S.boot.access, l = S.boot.limits, tier = ad.tier === 'pro' ? 'pro' : 'plus';
    var after = a.membershipActive ? 'your Business Club allowance (' + l.standard + ' a day)' : 'the Free plan (' + l.free + ' a day)';
    var scrim = document.createElement('div'); scrim.className = 'scrim';
    scrim.innerHTML = '<div class="sheet stack" role="dialog" aria-modal="true" aria-labelledby="cnT"><h2 id="cnT" style="margin:0">Cancel ' + esc(TIER_NAME[tier]) + '?</h2>' +
      '<p style="margin:0">You won’t be charged again. Your plan stays on until <b>' + esc(d(ad.currentPeriodEnd, 1)) + '</b>, then you’ll go back to ' + esc(after) + '. Everything in your library stays.</p>' +
      '<p class="hint" style="margin:0">Changed your mind later? Tap “Keep my plan” any time before then.</p>' +
      '<button class="btn primary block" id="cnGo" style="background:var(--danger);border-color:var(--danger)">Cancel subscription</button><button class="btn ghost block" id="cnX">Keep my plan</button></div>';
    document.body.appendChild(scrim);
    $('#cnX', scrim).onclick = function () { scrim.remove(); };
    $('#cnGo', scrim).onclick = async function () {
      var b = $('#cnGo', scrim); b.disabled = true; b.textContent = 'Cancelling…';
      try { var r = await api('studio-billing', 'cancel'); S.boot.addon = Object.assign({}, S.boot.addon, r.addon); scrim.remove(); toast('Cancelled — your plan stays on until ' + d(ad.currentPeriodEnd)); showAccount(); }
      catch (x) { toast(x.message); b.disabled = false; b.textContent = 'Cancel subscription'; }
    };
  }
  // Opened from the "Cancel subscription" button in our emails — works without signing in.
  async function showCancelLink(e, t) {
    setChrome({ tabs: false });
    app.innerHTML = '<div class="auth-wrap"><div class="auth-hero"><img src="/tobi-face-256.png" alt=""><h1>Your subscription</h1></div><div class="card stack" id="clBox"><p class="sub">Loading…</p></div></div>';
    var box = $('#clBox'), info;
    var draw = function () {
      if (info.cancelled || !info.live) {
        box.innerHTML = '<b>' + esc(info.plan) + ' is cancelled ✅</b><p class="sub" style="margin:0">You won’t be charged again.' + (info.live ? ' It stays on until <b>' + esc(d(info.endsAt, 1)) + '</b>. Changed your mind? Sign in and tap Account → Keep my plan.' : '') + '</p><a class="btn ghost block" href="/studio" style="text-align:center">Open Business Studio</a>';
        return;
      }
      box.innerHTML = '<b>Cancel ' + esc(info.plan) + '?</b><p class="sub" style="margin:0">It’s ' + esc(info.amount) + ' a ' + esc(info.period) + '. If you cancel, you won’t be charged again and it stays on until <b>' + esc(d(info.endsAt, 1)) + '</b>. Your library stays.</p>' +
        '<button class="btn primary block" id="clGo" style="background:var(--danger);border-color:var(--danger)">Cancel subscription</button><a class="btn ghost block" href="/studio" style="text-align:center">Keep it</a>';
      $('#clGo').onclick = async function () { var b = $('#clGo'); b.disabled = true; b.textContent = 'Cancelling…'; try { info = (await api('studio-billing', 'link-cancel', { email: e, token: t }, { quiet401: true })).info; draw(); } catch (x) { toast(x.message); b.disabled = false; b.textContent = 'Cancel subscription'; } };
    };
    try { info = (await api('studio-billing', 'link-info', { email: e, token: t }, { quiet401: true })).info; draw(); }
    catch (x) { box.innerHTML = '<p class="err" style="margin:0">' + esc(x.message) + '</p><a class="btn ghost block" href="/studio" style="text-align:center">Open Business Studio</a>'; }
  }

  async function openPortal() {
    try { var r = await api('studio-billing', 'portal'); location.href = r.url; }
    catch (x) { if (x.code !== 'cancelled') toast(x.message); }
  }
  async function downloadMyData() {
    try {
      var r = await api('studio-extras', 'my-data');
      var blob = new Blob([JSON.stringify(r.data, null, 2)], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'business-studio-my-data-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('Your data is downloading');
    } catch (x) { toast(x.message); }
  }
  function deleteAccountSheet() {
    var a = S.boot.access || {};
    var scrim = document.createElement('div'); scrim.className = 'scrim';
    scrim.innerHTML = '<div class="sheet stack" role="dialog" aria-modal="true" aria-labelledby="daT"><h2 id="daT" style="margin:0">Delete my account?</h2>' +
      '<p style="margin:0">This permanently deletes your business profile, customers and follow-ups, to-do list, calendar, quotes and invoices, saved content and your price list page. <b>It can’t be undone.</b></p>' +
      (a.addonLive ? '<p class="err" style="margin:0">Your subscription will be cancelled straight away (no refund for the rest of this period).</p>' : '') +
      (a.membershipActive ? '<p class="err" style="margin:0">You’ll lose access to your Business Club membership and its benefits.</p>' : '') +
      '<p class="hint" style="margin:0">Tip: download your data first. Payment records stay with Stripe as the law requires.</p>' +
      '<div><label class="f" for="daC">Type DELETE to confirm</label><input id="daC" autocomplete="off" autocapitalize="characters"></div>' +
      '<button class="btn primary block" id="daGo" style="background:var(--danger);border-color:var(--danger)">Delete my account</button><button class="btn ghost block" id="daX">Keep my account</button></div>';
    document.body.appendChild(scrim);
    $('#daX', scrim).onclick = function () { scrim.remove(); };
    $('#daGo', scrim).onclick = async function () {
      var b = $('#daGo', scrim); b.disabled = true;
      try { await api('studio-extras', 'account-delete', { confirm: $('#daC', scrim).value }); scrim.remove(); S.boot = null; showMessage('Account deleted', 'Your Business Studio account and data have been deleted. Thank you for using Auntie Tobi Business Studio 💚'); }
      catch (x) { if (x.code !== 'cancelled') toast(x.message); b.disabled = false; }
    };
  }

  async function signOut() {
    try { await api('studio-auth', 'logout', {}, { quiet401: true }); } catch (e) {}
    S.boot = null; S.today = null; showSignIn();
  }

  function d(iso, y) { return fmtDate(iso, y ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'long' }); }

  function planSection() {
    var a = S.boot.access, ad = S.boot.addon, l = S.boot.limits, m = S.boot.member;
    var html = '';
    // Business Club
    if (m.isClub) {
      html += '<h2>Business Club</h2><div class="card stack"><div class="row" style="justify-content:space-between"><b>Annual membership</b><span class="pill ' + (a.membershipActive ? 'green' : 'cream" style="background:#ECEDF0;color:var(--muted)') + '">' + (a.membershipActive ? 'Active' : 'Not active') + '</span></div>' +
        '<div class="sub">' + (a.membershipActive ? 'Valid until <b>' + d(m.membershipExpiresAt, 1) + '</b>. Includes every tool and ' + l.standard + ' daily AI credits.' : 'Your Business Club membership isn’t active. <a href="/business-club">Renew it here</a>.') + '</div></div>';
    }
    if (a.free) {
      html += '<h2>Your plan</h2><div class="card stack"><div class="row" style="justify-content:space-between"><b>Free plan</b><span class="pill green">Active</span></div>' +
        '<div class="sub" style="margin:0">' + l.free + ' daily AI credits with the everyday tools — captions, Reels, Stories, offers, customer replies and more.</div></div>' +
        (m.isClub ? '' : '<div class="card stack"><div class="row" style="justify-content:space-between"><b>Business Club</b><b>£50/year</b></div><div class="sub" style="margin:0">Every tool and ' + l.standard + ' daily AI credits — plus promotion by Auntie Tobi, the directory, your Verified badge, the Marketplace and Resources.</div><a class="btn primary block" href="/business-club" style="text-align:center">Join the Business Club</a></div>');
    }
    // Add-ons: Pro / Plus
    html += '<h2>' + (ad && ad.tier === 'pro' ? 'Business Studio Plus' : 'Business Studio Plus') + '</h2>';
    var tier = ad && ad.tier === 'pro' ? 'pro' : 'plus';
    var period = ad ? TIER_PRICE[tier][ad.interval === 'year' ? 'year' : 'month'] + (ad.interval === 'year' ? '/year' : '/month') : '';
    var after = a.membershipActive ? ' You’ll go back to ' + l.standard + ' a day with your Business Club membership.' : l.free > 0 ? ' You’ll go back to the Free plan (' + l.free + ' a day).' : ' After that you can still view your library.';
    if (ad && ['active', 'trialing'].indexOf(ad.status) > -1) {
      html += '<div class="card plan stack"><div class="row" style="justify-content:space-between"><b>' + TIER_NAME[tier] + ' · ' + (ad.interval === 'year' ? 'Yearly' : 'Monthly') + '</b><span class="pill gold">' + (ad.cancelAtPeriodEnd ? 'Ending' : 'Active') + '</span></div>' +
        '<div class="sub">' + tierLimit(tier) + ' daily AI credits · ' + period + '</div>' +
        '<div>' + (ad.cancelAtPeriodEnd ? 'Ends on <b>' + d(ad.currentPeriodEnd, 1) + '</b>.' + after : 'Renews on <b>' + d(ad.currentPeriodEnd, 1) + '</b>' + (ad.amount ? ' (£' + (ad.amount % 100 ? (ad.amount / 100).toFixed(2) : ad.amount / 100) + ')' : '') + '. We’ll remind you before then.') + '</div>' +
        (!ad.cancelAtPeriodEnd ? '<p class="hint" style="margin:0">Need more on a busy day? <button class="btn link" data-buycredits style="padding:0;min-height:0">Buy extra credits</button>.</p>' : '') +
        (ad.cancelAtPeriodEnd ? '<button class="btn gold block" id="resumeSub">Keep my plan</button>' : '') +
        '<button class="btn ghost block" id="manage">' + (ad.cancelAtPeriodEnd ? 'Payment details & invoices' : 'Switch plan, payment details & invoices') + '</button>' +
        (ad.cancelAtPeriodEnd ? '' : '<button class="btn link" id="cancelSub" style="color:var(--danger);font-weight:700">Cancel subscription</button>') + '</div>';
    } else if (ad && ['past_due', 'unpaid', 'incomplete'].indexOf(ad.status) > -1) {
      html += '<div class="card stack" style="border-color:var(--danger)"><b>' + TIER_NAME[tier] + ' is paused</b><div class="err">Your last payment didn’t go through. Update your card to get your ' + tierLimit(tier) + ' daily AI credits back.' + (a.membershipActive ? ' Your Business Club membership is not affected.' : '') + '</div>' +
        '<button class="btn primary block" id="manage">Update payment details</button></div>';
    } else if (S.boot.billing.enabled) {
      html += '<div class="card stack">' + (a.membershipActive ? '<p class="sub" style="margin:0">You have ' + l.standard + ' a day with Business Club. Add Plus for ' + l.power + ' a day.</p>' : '') + planChoices() + '</div>';
    } else if (!m.isClub) {
      html += '<div class="note">Business Studio Plus isn’t available right now.</div>';
    }
    if (creditsOn() || creditBal()) {
      var uu = S.boot.usage || {};
      html += '<h2>Extra AI credits</h2><div class="card stack"><div><b style="font-size:23px">' + creditBal().toLocaleString('en-GB') + ' credits</b>' +
        (uu.creditsExpiry ? '<div class="sub" style="margin:0">First ones expire ' + d(uu.creditsExpiry, 1) + '</div>' : '') + '</div>' +
        '<div class="sub" style="margin:0">Used after your daily AI credits. One-off top-ups — nothing renews. Credits last 12 months.</div>' +
        (creditsOn() ? '<button class="btn primary block" data-buycredits>Buy credits</button>' : '') +
        '<button class="btn link" id="crHist">See credit history</button><div id="crHistBox"></div></div>';
    }
    return html;
  }

  function showAccount(section) {
    if (typeof section !== 'string') section = '';
    setChrome({ tabs: true, tab: 'account' });
    var p = S.boot.profile;
    app.innerHTML = '<main><h1>Account</h1><p class="sub" style="margin-top:4px">' + esc(S.boot.member.email) + '</p>' +
      planSection() +
      (p ? '<h2>Business profile</h2><div class="card"><b>' + esc(p.businessName) + '</b><div class="sub">' + esc(p.industry) + ' · ' + esc(p.location) + '</div>' +
        '<div class="sub" style="margin-top:4px">Tone: ' + esc(TONE_LABELS[p.tone] || p.tone) + (p.instagram ? ' · ' + esc(p.instagram) : '') + '</div>' +
        '<div class="sub" style="margin-top:4px">Customers find you on: ' + esc((p.channels || ['instagram']).map(channelName).join(', ')) + (p.mainChannel ? ' \u00b7 posts point to ' + esc(channelName(p.mainChannel)) : '') + '</div>' +
        (S.boot.listing ? '<div class="sub" style="margin-top:4px">Auntie Tobi listing: <a href="' + esc(S.boot.listing.url) + '" target="_blank" rel="noopener">' + esc(S.boot.listing.name) + '</a></div>' : '<div class="sub" style="margin-top:4px">No Auntie Tobi listing linked \u2014 add it in your profile.</div>') +
        '<button class="btn ghost block" style="margin-top:12px" id="editP">Edit business profile</button></div>' : '') +
      benefitsAccountHtml() + (p ? brandKitHtml() : '') + extrasAccountHtml() +
      '<h2>Help</h2><details class="faq"><summary>What uses an AI credit?</summary><ul><li>Every <b>Create</b> or <b>Regenerate</b> that gives you a result = 1 AI credit.</li><li>A <b>30-day content plan uses 3</b>. Everything else uses 1.</li><li>Editing, copying, saving and browsing your library are free.</li><li>If it fails, you’re not charged.</li><li>Allowances reset at midnight (UK time). Unused daily credits don’t carry over.</li></ul></details>' +
      '<h2>Ideas for Business Studio</h2><div class="card stack"><p class="sub" style="margin:0">Missing a tool, a lesson or a template? Tell Auntie Tobi — every idea is read.</p><button class="btn ghost block" data-idea="">💡 Share an idea</button></div>' +
      '<h2>Your data</h2><div class="card stack"><p class="sub" style="margin:0">Your Business Studio is private to your account — your customers, tasks, quotes, invoices and content aren’t shown to anyone else. Business Studio stores them so it can remind you and keep your records; requests you make in Create are sent to our AI provider to write the content.</p>' +
        '<button class="btn ghost block" id="myData">⬇️ Download my data</button><button class="btn link danger" id="delAcct">Delete my account</button></div>' +
      '<h2>Security</h2><div class="card stack"><p class="sub">You stay signed in on this device for up to 30 days of inactivity, and we’ll ask for a fresh email code once a month and before any payment.</p>' +
      '<button class="btn ghost block" id="out">Sign out</button><button class="btn link danger" id="outAll">Sign out on all devices</button></div></main>';
    var ep = $('#editP'); if (ep) ep.onclick = function () { showProfileForm(false); };
    $('#myData').onclick = downloadMyData;
    $('#delAcct').onclick = deleteAccountSheet;
    $('#out').onclick = signOut;
    $('#outAll').onclick = async function () {
      if (!confirm('Sign out everywhere, including this device?')) return;
      try { await api('studio-auth', 'logout-all'); } catch (e) {}
      S.boot = null; showSignIn();
    };
    bindPlanChoices();
    bindBrandKit();
    bindExtrasAccount();
    bindBenefitsAccount();
    if (section === 'brand') setTimeout(function () { var bk = $('#bkCard'); if (bk) bk.scrollIntoView({ block: 'start' }); }, 50);
    var mg = $('#manage'); if (mg) mg.onclick = openPortal;
    var cs = $('#cancelSub'); if (cs) cs.onclick = cancelSheet;
    var rs = $('#resumeSub'); if (rs) rs.onclick = async function () {
      rs.disabled = true;
      try { var r = await api('studio-billing', 'resume'); S.boot.addon = Object.assign({}, S.boot.addon, r.addon); toast('Great — your plan carries on 💚'); showAccount(); }
      catch (x) { toast(x.message); rs.disabled = false; }
    };
  }

  start();
})();
</script>
</body>
</html>
