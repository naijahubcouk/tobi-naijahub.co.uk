<body>
<div class="top"><img data-lsrc="/tobi-face-128.png" alt=""><div><b>Auntie Tobi</b><span>Free Instagram check</span></div><a href="/">🏠 App</a></div>
<div class="wrap" id="app"></div>
<script>
(function () {
  var API = '/.netlify/functions/glowup', app = document.getElementById('app');
  var GOALS = ['More followers', 'More enquiries', 'More sales'], WA = '447594674940', SITE = location.origin, YOURS = null;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var $ = function (q) { return document.querySelector(q); };
  var post = function (b) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' }, body: JSON.stringify(b) }).then(function (x) { return x.json().then(function (j) { if (!x.ok) throw new Error(j.message || 'Something went wrong — please try again.'); return j; }); }); };
  var get = function (q) { return fetch(API + q).then(function (x) { return x.json().then(function (j) { if (!x.ok) throw new Error(j.message || 'Something went wrong.'); return j; }); }); };
  var shrink = function (file) { return new Promise(function (ok, bad) { var fr = new FileReader(); fr.onerror = function () { bad(new Error('Couldn’t read that picture')); }; fr.onload = function () { var im = new Image(); im.onerror = function () { bad(new Error('That doesn’t look like a picture')); }; im.onload = function () { var k = Math.min(1, 1400 / Math.max(im.width, im.height)), cv = document.createElement('canvas'); cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/jpeg', 0.8)); }; im.src = fr.result; }; fr.readAsDataURL(file); }); };

  // ── 1. the form ──
  function form() {
    var shots = [], goal = '', listing = null;
    app.innerHTML = '<div class="hero"><div class="badge">🆓 Free Instagram check</div><h1>Is your Instagram <span>bringing you customers?</span></h1><p>Send Auntie Tobi a screenshot of your business page. In about a minute you’ll get your score out of 100, what’s working, your top fixes with step-by-step how-tos, a new bio idea and one quick win for today.</p></div>' +
      '<div class="card">' +
      '<div class="stp"><i>1</i>Is your business on Auntie Tobi?</div>' +
      '<div id="s1"><div class="find" id="fnd"><input id="lq" placeholder="Type your business name" autocomplete="off"><div class="res" id="res"></div></div>' +
      '<p class="hint">We’ll fill in your details for you.</p>' +
      '<div class="add"><b>Your business isn’t listed yet?</b><span>Add it free — it takes 2 mins. Nigerians across the UK can then find you on Auntie Tobi.</span><a href="/add-business?from=igcheck" target="_blank" rel="noopener">➕ Add my business free</a></div>' +
      '<button type="button" class="skip" id="skip">Or carry on without it →</button></div>' +
      '<div id="lpk"></div>' +
      '<div id="man" class="hidden"><label>Your business name</label><input id="biz" placeholder="e.g. Kemi’s Kitchen" autocomplete="organization">' +
      '<label>What do you sell?</label><input id="sells" placeholder="e.g. jollof trays and small chops for parties"></div>' +
      '<div class="stp" style="margin-top:22px"><i>2</i>A screenshot of your Instagram</div>' +
      '<div class="shot" id="sh">📷 Add your screenshot<small>Your profile with your bio and the top of your posts. You can add a 2nd one (like your highlights or a post).</small></div><input type="file" id="shF" accept="image/*" multiple hidden><div class="thumbs" id="th"></div>' +
      '<div class="stp" style="margin-top:22px"><i>3</i>What do you want most from Instagram?</div><div class="chips" id="goal">' + GOALS.map(function (g) { return '<button type="button" data-g="' + g + '">' + g + '</button>'; }).join('') + '</div>' +
      '<div class="err" id="err"></div><button class="go" id="go">✨ Check my page — free</button>' +
      '<p class="note" style="margin-top:10px">Your screenshot is only used for your check — we don’t keep it.</p></div>';
    var th = function () { $('#th').innerHTML = shots.map(function (u, i) { return '<div><img src="' + u + '" alt=""><button type="button" data-rm="' + i + '" aria-label="Remove">✕</button></div>'; }).join(''); $('#sh').firstChild.textContent = shots.length ? (shots.length < 2 ? '📷 Add a 2nd screenshot (optional)' : '✓ 2 screenshots added') : '📷 Add your screenshot'; [].forEach.call(document.querySelectorAll('[data-rm]'), function (b) { b.onclick = function () { shots.splice(+b.dataset.rm, 1); th(); }; }); };
    $('#sh').onclick = function () { if (shots.length < 2) $('#shF').click(); };
    $('#shF').onchange = async function () { var fs = [].slice.call(this.files || []); this.value = ''; for (var i = 0; i < fs.length && shots.length < 2; i++) { try { shots.push(await shrink(fs[i])); } catch (e) { showErr(e.message); } } th(); };
    [].forEach.call(document.querySelectorAll('[data-g]'), function (b) { b.onclick = function () { goal = b.dataset.g; [].forEach.call(document.querySelectorAll('[data-g]'), function (x) { x.classList.toggle('on', x === b); }); }; });
    // step 1 — find their listing, or carry on without it
    var tmr = null, seq = 0, res = $('#res');
    var reset = function () { listing = null; $('#lpk').innerHTML = ''; $('#s1').classList.remove('hidden'); $('#man').classList.add('hidden'); $('#lq').value = ''; $('#lq').focus(); };
    var pick = function (b) {
      res.style.display = 'none'; $('#lq').value = b.name;
      get('?listing=' + encodeURIComponent(b.slug)).then(function (j) {
        var L = j.listing; listing = L; YOURS = L;
        $('#s1').classList.add('hidden');
        $('#biz').value = L.name; $('#sells').value = L.desc || L.cat || '';
        $('#lpk').innerHTML = '<div class="picked">✅ <div style="flex:1"><b>' + esc(L.name) + '</b><div style="font-size:13px;color:#374151">' + esc([L.cat, L.loc].filter(Boolean).join(' · ')) + '</div></div><button type="button" id="led">Edit</button><button type="button" id="lx">Not me</button></div>';
        $('#led').onclick = function () { $('#man').classList.toggle('hidden'); };
        $('#lx').onclick = reset;
      }).catch(function (e) { showErr(e.message); });
    };
    $('#lq').oninput = function () {

        res.innerHTML = r.length ? r.map(function (b, i) { return '<button type="button" data-k="' + i + '"><b>' + esc(b.name) + '</b><div>' + esc([b.cat, b.loc].filter(Boolean).join(' · ')) + '</div></button>'; }).join('')
          : '<div style="padding:11px 13px;font-size:14px">We can’t find it. <a href="/add-business?from=igcheck" target="_blank" rel="noopener" style="color:#057A44;font-weight:700">Add it free — 2 mins →</a></div>';
        res.style.display = 'block';
        [].forEach.call(res.querySelectorAll('[data-k]'), function (b) { b.onmousedown = function (e) { e.preventDefault(); pick(r[+b.dataset.k]); }; });
      }).catch(function () {}); }, 250);
    };
    $('#lq').onblur = function () { setTimeout(function () { res.style.display = 'none'; }, 150); };
    $('#skip').onclick = function () { $('#s1').classList.add('hidden'); $('#man').classList.remove('hidden');
      $('#lpk').innerHTML = '<div class="picked" style="background:#F6F4EE">📝 <b style="flex:1;font-weight:600">Tell us about your business</b><button type="button" id="lx">Search again</button></div>'; $('#lx').onclick = reset;
      var q = $('#lq').value.trim(); if (q && !$('#biz').value) $('#biz').value = q; $('#biz').focus(); };
    var showErr = function (m) { var e = $('#err'); e.textContent = m; e.style.display = 'block'; };
    $('#go').onclick = function () {
      $('#err').style.display = 'none';
      if (!listing && !$('#s1').classList.contains('hidden')) return showErr('Find your business above, or tap “Carry on without it”.');

      waiting();

        .catch(function (e) { form(); setTimeout(function () { showErrAgain(e.message); }, 0); });

  function showErrAgain(m) { var e = $('#err'); if (e) { e.textContent = m + ' (Please add your screenshot again.)'; e.style.display = 'block'; e.scrollIntoView({ block: 'center' }); } }
  function waiting() {

    var say = { great: 'Your page is working hard for you — a few tweaks will make it even better.', good: 'A good page — some simple changes could bring you a lot more ' + goalW + '.', mid: 'You’re getting there — a few clear changes could make a real difference.', low: 'There’s a big opportunity here — your page could be bringing you much more.' }[d.tone] || '';
    var h = '<div class="hero"><div class="badge">' + (d.byHq ? '💚 A free gift from Auntie Tobi' : '🆓 Your free Instagram check') + '</div><h1>' + esc(d.biz) + '</h1><p>' + (d.byHq ? 'Auntie Tobi checked your Instagram for you! Here’s your score, what’s working, and the changes that could bring you more ' + esc(goalW) + '.' : (d.name ? 'Hi ' + esc(d.name) + '! ' : '') + 'Here’s what Auntie Tobi found.') + '</p></div>' +
      '<div class="card"><div class="score"><div class="ring" style="background:conic-gradient(' + col + ' ' + d.score + '%,#EEE9DD 0)"><i>' + d.score + '<small>out of 100</small></i></div><div><span class="band" style="background:' + col + '">' + esc(d.band) + '</span><p style="margin-top:6px">' + esc(say) + '</p></div></div>' +
      '<div class="bars">' + d.groups.map(function (g) { var pc = g.got == null ? 0 : Math.round(g.got * 100 / g.max), c = g.got == null ? '#CFC8B8' : pc >= 80 ? TONE.great : pc >= 60 ? TONE.good : pc >= 40 ? TONE.mid : TONE.low;
        return '<div class="bar"><div class="bl"><span>' + esc(g.name) + '</span><b>' + (g.got == null ? '<small>couldn’t see</small>' : g.got + '<small>/' + g.max + '</small>') + '</b></div><div class="bt"><i style="width:' + pc + '%;background:' + c + '"></i></div></div>'; }).join('') + '</div>' +
      '<details class="how"><summary>How is my score worked out?</summary><p>Auntie Tobi checks 12 things across 5 areas. Each counts for points: good gets them all, “needs fixing” gets half, missing gets none.' + (d.unseen ? ' ' + d.unseen + ' thing' + (d.unseen > 1 ? 's' : '') + ' couldn’t be seen in your screenshot, so they don’t count against you.' : '') + ' <span style="display:block;margin-top:6px"><b>80–100</b> Great · <b>60–79</b> Good · <b>40–59</b> Getting there · <b>0–39</b> Needs work</span></p></details></div>';
    if (d.working.length) h += '<div class="card"><h2>💚 What’s working</h2>' + d.working.map(function (x) { return '<div class="li"><span>✅</span><div><b style="display:inline;font-size:15px">' + esc(x.t) + '</b>' + (x.why ? '<div style="font-size:14px;color:#4B5563">' + esc(x.why) + '</div>' : '') + '</div></div>'; }).join('') + '</div>';
    if (d.locked) {
      h += '<div class="card lock"><h2>🔓 Unlock your full results</h2><p style="font-size:14.5px;margin-bottom:8px">Your top ' + (d.nFix || 3) + ' fixes with step-by-step how-tos, a new bio written for you, your full breakdown and a quick win for today.</p>' +
        '<div class="blur" aria-hidden="true"><div class="fix"><b>1. Say what you sell in your name field</b><div>Say what you sell and how to order in the first line so new visitors…</div></div><div class="fix"><b>2. Add highlights for your prices</b><div>People want to know the price before they message…</div></div></div>' +
        '<p style="font-size:15px;margin:6px 0 12px"><b>Tell Auntie Tobi where to send them</b> — it’s free.</p>' +
        '<label>Your first name</label><input id="un" autocomplete="given-name">' +
        '<label>WhatsApp number</label><input id="uw" inputmode="tel" placeholder="07…" autocomplete="tel" value="' + esc(YOURS && YOURS.wa ? String(YOURS.wa).replace(/^44/, '0') : '') + '">' +
        '<label>Email <small>(optional)</small></label><input id="ue" inputmode="email" autocomplete="email">' +
        '<label class="tick"><input type="checkbox" id="uok"> Auntie Tobi can message me about my results and the Instagram Revamp.</label>' +
        '<div class="err" id="err"></div><button class="go" id="ugo">🔓 Show my full results</button></div>';
    } else {
      if (d.overall) h += '<div class="card"><h2>👀 The big picture</h2><p style="font-size:15px">' + esc(d.overall) + '</p></div>';
      if (d.improve.length) h += '<div class="card"><h2>🔧 Your top ' + d.improve.length + ' fixes</h2>' + d.improve.map(function (x, i) {
        return '<div class="fx"><div class="fh"><b>' + (i + 1) + '. ' + esc(x.fix) + '</b></div>' +
          '<div class="tags">' + (x.area ? '<span>' + esc(x.area) + '</span>' : '') + (x.impact ? '<span class="' + (x.impact === 'big' ? 'big' : '') + '">' + (x.impact === 'big' ? '🔥 Big difference' : '👍 Good difference') + '</span>' : '') + (x.mins ? '<span>⏱ ' + (x.mins >= 60 ? Math.round(x.mins / 60) + ' hr' : x.mins + ' mins') + '</span>' : '') + '</div>' +
          (x.saw ? '<p><em>What we saw:</em> ' + esc(x.saw) + '</p>' : '') + (x.why ? '<p><em>Why it matters:</em> ' + esc(x.why) + '</p>' : '') +
          (x.steps && x.steps.length ? '<p><em>How to do it:</em></p><ol>' + x.steps.map(function (y) { return '<li>' + esc(y) + '</li>'; }).join('') + '</ol>' : '') +
          (x.example ? '<div class="ex"><small>Example for you</small>' + esc(x.example) + '</div>' : '') + '</div>'; }).join('') + '</div>';
      if (d.bio) h += '<div class="card"><h2>✍🏾 A new bio for you</h2><div class="biob">' + esc(d.bio) + '</div><button type="button" class="cpb" id="cpBio">📋 Copy bio</button><p class="note" style="text-align:left;margin-top:8px">Change anything you like, then paste it in Edit profile → Bio.</p></div>';
      if (d.quickWin) h += '<div class="quick"><b>⚡ Your quick win for today</b>' + esc(d.quickWin) + '</div>';
      if (d.breakdown.length) { var GN = {}; d.groups.forEach(function (g) { GN[g.k] = g; }); var LAB = { good: '✅ Good', fix: '🔧 Fix', missing: '❌ Missing' };
        h += '<div class="card"><h2>📋 Your full breakdown</h2>' + d.groups.map(function (g) { var it = d.breakdown.filter(function (x) { return x.g === g.k; });
          return '<div class="bdg"><div class="bdh">' + esc(g.name) + ' <b>' + (g.got == null ? '—' : g.got + '/' + g.max) + '</b></div>' + it.map(function (x) { return '<div class="bdr"><span class="st ' + (x.s || 'none') + '">' + (LAB[x.s] || '👀 Couldn’t see') + '</span><div><b>' + esc(x.name) + '</b>' + (x.note ? '<small>' + esc(x.note) + '</small>' : '') + '</div></div>'; }).join('') + '</div>'; }).join('') + '</div>'; }
      h += '<a class="go wa" style="text-decoration:none;text-align:center;margin-top:0" target="_blank" rel="noopener" href="https://wa.me/' + WA + '?text=' + encodeURIComponent('Hi Auntie Tobi 👋🏾 I have a question about my Instagram check for ' + d.biz + ' (' + d.score + '/100): ' + link) + '">💬 Questions about your results? Message Auntie Tobi</a>';
    }
    if (!d.listed) h += '<div class="list"><b>📍 Get found on Auntie Tobi too</b><p>Add your business to the Auntie Tobi directory for free, so Nigerians across the UK can find you.</p><a href="/add-business?from=igcheck" target="_blank" rel="noopener">Add my business free →</a></div>';
    h += '<div class="save"><span>🔖 Come back to your results: ' + esc(link.replace(/^https?:\/\//, '')) + '</span><button type="button" id="cpy">Copy</button></div>' +
      '<p class="note">These are suggestions to test, not guarantees — every page is different.<br><a href="/instagram-check" style="color:#057A44">Check another page</a></p>';
    app.innerHTML = h;
    $('#cpy').onclick = function () { try { navigator.clipboard.writeText(link); this.textContent = 'Copied ✓'; } catch (e) {} };
    if ($('#cpBio')) $('#cpBio').onclick = function () { try { navigator.clipboard.writeText(d.bio); this.textContent = 'Copied ✓'; } catch (e) {} };
    if (d.locked) $('#ugo').onclick = function () {
      var b = this, e = $('#err'); e.style.display = 'none';
      if (!$('#uok').checked) { e.textContent = 'Please tick the box so Auntie Tobi can send you your results.'; e.style.display = 'block'; return; }
      b.disabled = true; b.textContent = 'Unlocking…';
      post({ action: 'unlock', t: d.t, name: $('#un').value, wa: $('#uw').value, email: $('#ue').value, ok: true }).then(function (r) { result(r); var f = document.querySelector('.fix'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' }); })
        .catch(function (x) { e.textContent = x.message; e.style.display = 'block'; b.disabled = false; b.textContent = '🔓 Show my full results'; });
    };
  }

  var c = new URLSearchParams(location.search).get('c');
  if (c) { app.innerHTML = '<div class="card wait"><div class="spin"></div><b>Loading your results…</b></div>'; get('?c=' + encodeURIComponent(c) + (new URLSearchParams(location.search).get('hq') === '1' ? '&hq=1' : '')).then(result).catch(function (e) { form(); var x = $('#err'); x.textContent = e.message; x.style.display = 'block'; }); }
  else form();
  document.querySelectorAll('img[data-lsrc]').forEach(function (i) { i.src = i.getAttribute('data-lsrc'); });
  document.querySelectorAll('template[data-icons]').forEach(function (t) { document.head.appendChild(t.content.cloneNode(true)); });
})();
</script>
</body>
</html>
