<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1E36">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; media-src 'self' blob: https://*.fal.media https://fal.media https://storage.googleapis.com; connect-src 'self' https://*.fal.media https://fal.media https://storage.googleapis.com; form-action 'self'; base-uri 'none'">
<title>Auntie Tobi HQ — Content Hub</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/hq-icon-32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/hq-icon-16.png?v=1">
<link rel="icon" type="image/png" sizes="48x48" href="/icons/hq-icon-48.png?v=1">
<link rel="apple-touch-icon" href="/icons/hq-icon-180.png?v=1">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;500;700&family=Poppins:ital,wght@0,600;0,700;0,800;0,900;1,900&family=Inter+Tight:wght@900&family=Inter:wght@500;700&family=Anton&family=Playfair+Display:ital,wght@0,900;1,900&family=Archivo+Black&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--green:#057A44;--green-d:#04613A;--green-l:#E3F2EA;--gold:#FFB81C;--gold-l:#FFF1CF;--navy:#0F1E36;--navy-2:#1C2E4D;--navy-3:#2A3D60;--cream:#FBF6EC;--line:#EADFC8;--muted:#5B6475;--danger:#B3261E;--danger-l:#FCE8E6;--font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--display:'Fraunces',Georgia,serif;--side:260px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--navy);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--green)}
.hidden,[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;min-height:40px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--green-d)}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;min-height:0;font-size:13px;border-radius:8px}
.btn.link{padding:0;min-height:0;color:var(--green)}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
.muted{color:var(--muted)}.err{background:var(--danger-l);color:var(--danger);border-radius:10px;padding:10px 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 14px;border-radius:10px;z-index:80;max-width:92vw;display:flex;gap:12px;align-items:center}
.toast button{background:var(--gold);color:var(--navy);border-radius:7px;padding:4px 10px;font-weight:800;font-size:13px}

.app{display:flex;height:100vh;height:100dvh}
aside{width:var(--side);flex:none;background:var(--navy);color:var(--cream);display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand img{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);background:var(--cream)}
.brand b{font-family:var(--display);font-size:19px;display:block;line-height:1.1}.brand small{color:var(--gold);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700}
.side-actions{padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
.side-nav{display:flex;flex-direction:column;padding:0 8px;gap:2px}
.side-nav button,.side-nav a{text-align:left;padding:10px 12px;border-radius:8px;color:#D5DCE8;font-weight:600;display:flex;gap:10px;align-items:center;text-decoration:none}
.side-nav button[aria-current=page]{background:var(--navy-3);color:#fff}
.side-nav .n{margin-left:auto;background:var(--navy-3);border-radius:999px;padding:0 8px;font-size:12px;color:#fff}
.side-foot{margin-top:auto;padding:12px 16px 16px;font-size:12.5px;color:#9AA6BC;border-top:1px solid var(--navy-3)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:56px}
.top h1{font-family:var(--display);font-size:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;font-size:22px;padding:4px 8px}
.view{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:1100px;margin:0 auto;padding:16px}

/* chips & badges */
.t{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;background:#F1ECE1;color:var(--navy)}
.t.reel{background:#FDE7EF;color:#9B1B4F}.t.carousel{background:#E7EEFD;color:#1F4AA8}.t.story{background:#FFF1CF;color:#7A5300}.t.blog{background:#EAE7FD;color:#4B2BA8}.t.post{background:var(--green-l);color:var(--green-d)}
.tp{font-size:12px;color:var(--muted);font-weight:600}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--navy)}.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.stats .card b{display:block;font-family:var(--display);font-size:28px;line-height:1.1}.stats .card span{font-size:13px;color:var(--muted)}
.h2{font-family:var(--display);font-size:19px;margin:20px 0 8px}

/* content card */
.kc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative}
.kc:hover{border-color:#CFC2A4;box-shadow:0 2px 8px rgba(15,30,54,.06)}
.kc .tt{font-weight:700;line-height:1.3;padding-right:24px}
.kc .cp{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kc .star{position:absolute;top:8px;right:8px;font-size:16px;color:#C9BFA8}.kc .star.on{color:var(--gold)}
.kc .qa{display:flex;gap:4px;margin-top:2px}
.kc .qa button{font-size:12px;font-weight:700;color:var(--muted);padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:#fff}.kc .qa button:hover{color:var(--navy);border-color:#CFC2A4}
.kc.late{border-color:#F2B8B3;background:#FFF8F7}
.kc img.th{width:100%;height:110px;object-fit:cover;border-radius:8px}
.date{font-size:12px;font-weight:700;color:var(--green-d)}.date.late{color:var(--danger)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px}
.col{background:#F4EEE2;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-size:14px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col h3 span{background:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.col .empty{font-size:13px;color:var(--muted);padding:8px 4px}
.tabs{display:none}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:108px;padding:6px;display:flex;flex-direction:column;gap:4px}
.cal .d.out{background:transparent;border-style:dashed;opacity:.55}
.cal .d.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.cal .d .n{font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cal .d .add{opacity:0;color:var(--green);font-weight:800;font-size:15px;padding:0 4px}.cal .d:hover .add{opacity:1}
.ev{font-size:12px;border-radius:6px;padding:3px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ev.s{background:var(--gold-l)}.ev.p{background:var(--green-l);color:var(--green-d)}.ev.late{background:var(--danger-l);color:var(--danger)}
.agenda{display:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,30,54,.5);z-index:60;display:grid;place-items:center;padding:14px}
.sheet{background:var(--cream);border-radius:16px;padding:18px;width:min(720px,100%);max-height:92vh;overflow-y:auto}
.sheet h2{font-family:var(--display);font-size:21px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.posttools{background:var(--green-l);border-radius:12px;padding:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imgs{display:flex;gap:8px;flex-wrap:wrap}
.imgs div{position:relative}.imgs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.imgs button{position:absolute;top:-6px;right:-6px;background:var(--navy);color:#fff;border-radius:50%;width:22px;height:22px;font-size:13px}

/* paste preview */
.pv{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.pv .pvh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pv input.pt{font-weight:700;flex:1;min-width:180px}
.pv select{width:auto;padding:6px 8px}
.pv textarea{font-size:13.5px}
.pv .tags{font-size:12.5px;color:var(--muted)}

.signin{max-width:400px;margin:12vh auto 0;padding:24px}
.signin img{width:72px;height:72px;border-radius:50%;border:3px solid var(--gold)}

@media (max-width:900px){
  aside{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,30,54,.45)}
  .menu-btn{display:block}
  .board{display:block}.board .col{display:none}.board .col.on{display:flex}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
  .tabs .chip{white-space:nowrap}
  .cal{display:none}.agenda{display:block}
  .f2,.f3{grid-template-columns:1fr}
  .top h1{font-size:19px}
}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:8px 0 3px}.sctag{font-size:13px}.note{background:var(--gold-l);border-radius:10px;padding:8px 12px;font-size:13.5px}
.binrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}.binrow:last-child{border-bottom:0}
/* Publish to App */
.aprow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}.aprow:last-child{border-bottom:0}
.apact{display:flex;gap:6px;flex-wrap:wrap}.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.ak{color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;white-space:nowrap}.as{white-space:nowrap}
.as{font-size:12px;font-weight:700}.as.live{color:var(--green-d)}.as.ended{color:var(--muted)}.as.hidden{color:#9B6B00}
.apgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
.appv{background:#f0f2f5;border-radius:12px;padding:10px;position:sticky;top:0}
.apcard{background:#fff;border-radius:12px;overflow:hidden;border:.5px solid #e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.aph{color:#fff;padding:7px 12px;display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.apb{padding:12px 14px}.apt{font-size:15px;font-weight:700;line-height:1.35;margin-bottom:6px}.apm{font-size:12.5px;color:#555;margin-bottom:6px;line-height:1.6}
.aptx{font-size:13.5px;color:#444;line-height:1.65}.aptx h3{font-size:14px;margin:10px 0 2px;color:var(--navy)}.aptx ul{padding-left:18px;margin:4px 0}.aptx p{margin:0 0 6px}
.apl{margin-top:8px;font-size:13px;color:#057A44;font-weight:700}
.aeimg{display:flex;gap:12px;align-items:flex-start}.aepic{width:110px;height:138px;border-radius:10px;border:1px solid var(--line);background:#F7F2E7;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}.aepic.wide{width:150px;height:150px}.aepic img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}.aeibtn{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.carx{position:fixed;inset:0;z-index:60;background:var(--cream);display:flex;flex-direction:column}
.carbar{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.cartitle{flex:1;font-weight:800;font-size:16px;border:1px solid transparent;background:transparent}.cartitle:focus{border-color:var(--line);background:#fff}
.carbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:16px;padding:16px;overflow:hidden}
.carleft{overflow:auto;padding-right:4px}.carright{overflow:auto}
.carstage{background:#1b1b1b;border-radius:14px;padding:10px;display:flex;justify-content:center}
.carstage canvas{width:100%;max-width:400px;height:auto;border-radius:8px;display:block}
.carthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.carthumbs canvas{width:54px;height:67px;border-radius:6px;cursor:pointer;border:2px solid transparent}.carthumbs canvas.on{border-color:var(--gold)}
.cslide{margin-top:10px;border:2px solid transparent}.cslide.on{border-color:var(--green)}.cslide .cbtns{display:flex;gap:2px}.cslide label{margin-top:8px}
.chk{display:flex;gap:6px;align-items:center;font-weight:600;font-size:14px}.chk input{width:auto}
.cargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.carcard{display:flex;gap:12px;align-items:flex-start;cursor:pointer}.carthumb{width:96px;height:120px;border-radius:8px;flex:none;background:#eee}
@media (max-width:900px){.carbody{overflow:auto;display:flex;flex-direction:column}.carright{order:-1;margin-bottom:12px}.carleft,.carright{overflow:visible}.carstage canvas{max-width:300px}}
.vasset{position:relative;display:inline-block;margin:6px 8px 0 0}.vasset img{width:54px;height:54px;object-fit:cover;border-radius:8px;display:block;background:#eee}.vasset button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#0F1E36;color:#fff;font-size:11px;line-height:20px;padding:0;cursor:pointer}
.vconcept{margin-top:8px}.vconcept h4{margin:0 0 4px;font-size:16px}.vconcept ol{margin:6px 0 8px;padding-left:20px;font-size:13.5px}
.vmcast{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.vmcast:last-child{border-bottom:0}.vmcast img,.vmcast .ph{width:54px;height:72px;border-radius:8px;object-fit:cover;background:#0F1E36;flex:none;display:flex;align-items:center;justify-content:center;color:#cbd5e1}
.vmcell{position:relative}.vmcell button{position:absolute;bottom:3px;right:3px;border:0;border-radius:6px;background:rgba(15,30,54,.8);color:#fff;font-size:11px;padding:2px 4px;cursor:pointer}.vmchk{font-size:12.5px;margin-top:2px}.vmchk.bad{color:#B45309}
.sctools{display:flex;gap:2px;justify-content:flex-end;margin:-6px -6px 4px 0}.sctools .btn{padding:2px 7px;font-size:15px;min-height:0}.sctools .btn[disabled]{opacity:.3}.vbadd{display:flex;align-items:center;justify-content:center;min-height:160px;border-style:dashed}
.vmstep{margin-top:10px}.vmchar{height:140px;border-radius:10px;margin-top:8px;display:block}
.vmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:8px}.vmcell{aspect-ratio:9/16;background:#0F1E36;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-weight:700}.vmcell img{width:100%;height:100%;object-fit:cover}
.vmrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.vmrow:last-child{border-bottom:0}.vmrow audio{height:34px;max-width:220px}
.vmthumb{width:54px;height:96px;border-radius:6px;overflow:hidden;background:#0F1E36;flex:none}.vmthumb img,.vmthumb video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.vf{margin-top:8px}.vf label{margin:0}.vfbtn{display:flex;gap:2px}.vfbtn .btn.link{font-size:12.5px;padding:0 4px}
.vscene{margin-top:10px}.vtag{font-size:12px;font-weight:700;background:var(--green-l);color:var(--green-d);border-radius:999px;padding:2px 8px}.vtag.gold{background:var(--gold-l);color:#7A5300}
.vboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.vbcard{padding:10px}
.vbimg{aspect-ratio:9/16;background:#0F1E36;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#cbd5e1;text-align:center;font-weight:700}.vbimg.feed{aspect-ratio:4/5}.vbimg img{width:100%;height:100%;object-fit:cover}
.vlist{padding-left:20px;margin:8px 0}.vlist li{margin:4px 0}.vcheck{padding:6px 0;border-bottom:1px solid var(--line);align-items:flex-start}.vcheck input{margin-top:3px}
.vres{display:flex;flex-direction:column;gap:4px;margin-top:6px}.vres .btn{justify-content:flex-start;text-align:left}
#veCv{width:100%;max-width:300px;height:auto;display:block;border-radius:8px}
.subc{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}.subimg{width:130px;max-height:180px;object-fit:cover;border-radius:10px;cursor:zoom-in;flex:none;background:#eee}.subimg.none{height:90px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);cursor:default}.side-nav .n.gold:not(:empty){background:var(--gold);color:var(--navy)}
/* Comment Assistant */
.side-sec{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--gold);padding:12px 12px 2px}
.igwrap{max-width:780px}
.igprog{display:flex;align-items:center;gap:14px}.igprog b{font-family:var(--display);font-size:26px;line-height:1}
.igbar{flex:1;height:10px;background:#F1ECE1;border-radius:999px;overflow:hidden}.igbar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
.igprog.done .igbar i{background:var(--gold)}
.igdrop{border:2px dashed #D9CCAE;border-radius:12px;background:#FFFCF5;padding:16px;text-align:center;cursor:pointer;display:block;font-weight:400}
.igdrop:hover,.igdrop.over{border-color:var(--green);background:var(--green-l)}
.igdrop b{display:block;font-size:15px}.igdrop span{font-size:13px;color:var(--muted)}
.igshot{display:flex;gap:12px;align-items:flex-start}.igshot img{width:92px;max-height:160px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line)}
.igres{display:flex;flex-direction:column;gap:10px}
.igc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.igc.best{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.igc.done{background:var(--green-l)}
.igk{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.igc.best .igk{color:var(--green-d)}
.igc textarea{border:0;padding:0;font-size:15.5px;line-height:1.45;background:transparent;resize:none;overflow:hidden}
.igc textarea:focus{outline:none}
.igc .igcnt{font-size:12px;color:var(--muted);margin-left:auto}
.ighrow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.ighrow:last-child{border-bottom:0}
.ighrow .tx{flex:1;min-width:0;font-size:14px}.ighrow .tx q{display:block;quotes:none;margin-top:2px}

      <button data-nav="find" id="navFind" class="hidden">🔎 Business Finder</button>
      <button data-nav="out" id="navOut" class="hidden">📧 Outreach</button>
      <button data-nav="mail" id="navMail" class="hidden">📝 Emails</button>
      <button data-nav="imgm" id="navImgm" class="hidden">🎨 Image model</button>

  </aside>
  <div class="main">
    <div class="top"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><h1 id="ttl">Today</h1><span id="topRight"></span></div>
    <div class="view" id="view"></div>
  </div>
</div>

<script src="/hq-split.js"></script>
<script src="/vendor/mp4-muxer-5.2.2.js"></script>

<script src="/hq-market.js?v=20261107"></script>

<script src="/hq-videoad.js"></script>
<script src="/hq-videomake.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var TYPE = { post: '🖼️ Post', reel: '🎬 Reel', carousel: '🗂️ Carousel', story: '⏳ Story', blog: '📝 Blog' };
  var TOPIC = { discovery: 'Business discovery', 'uk-info': 'UK info', community: 'Community', promo: 'Promotion', event: 'Event', motivation: 'Motivation' };
  var STATUS = { idea: '💡 Ideas', drafting: '✍️ Drafting', ready: '✅ Ready', scheduled: '📅 Scheduled', posted: '📲 Posted', archived: '🗄️ Archived' };
  var NEXT = { idea: 'drafting', drafting: 'ready', ready: 'scheduled' };
  var S = { items: [], view: 'today', filter: { q: '', type: '', topic: '', star: false }, tab: 'idea', month: null };
  function toast(m, undo) {
    var t = document.createElement('div'); t.className = 'toast'; t.innerHTML = '<span></span>' + (undo ? '<button>Undo</button>' : ''); t.firstChild.textContent = m; document.body.appendChild(t);
    var gone = setTimeout(function () { t.remove(); }, undo ? 6000 : 2600);
    if (undo) t.lastChild.onclick = function () { clearTimeout(gone); t.remove(); undo(); };
  }
  async function call(fn, action, payload) {
    var res, data;
    try {
      res = await fetch('/.netlify/functions/' + fn, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' }, body: JSON.stringify(Object.assign({ action: action }, payload || {})) });
      data = await res.json().catch(function () { return {}; });
    } catch (e) { throw new Error('No connection — check your internet and try again.'); }
    if (res.status === 401 && fn === 'studio-hq') { showSignIn(); throw new Error('Please sign in.'); }
    if (!res.ok) throw new Error((data && data.message) || 'Something went wrong.');
    return data;
  }
  var api = function (a, p) { return call('studio-hq', a, p); };
  function today() { return S.today; }
  function addDays(day, n) { var d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function fmtDay(day) { if (day === today()) return 'Today'; if (day === addDays(today(), 1)) return 'Tomorrow'; return new Date(day + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function weekStart(day) { var d = new Date(day + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); }
  function byId(id) { return S.items.filter(function (x) { return x.id === id; })[0]; }
  function upsert(it) { var i = S.items.findIndex(function (x) { return x.id === it.id; }); if (i >= 0) S.items[i] = it; else S.items.unshift(it); }
  function isLate(c) { return c.status === 'scheduled' && c.planDate && c.planDate < today(); }

  // ── sign in ──
  function showSignIn() { $('#app').classList.add('hidden'); $('#signin').classList.remove('hidden'); $('#em').focus(); }
  $('#siBtn').onclick = async function () {
    var b = this, err = $('#siErr'); err.classList.add('hidden'); b.disabled = true;
    try {
      if ($('#cdBox').classList.contains('hidden')) { await call('studio-hq', 'login-request', { email: $('#em').value.trim() }); $('#cdBox').classList.remove('hidden'); b.textContent = 'Sign in'; $('#cd').focus(); }
      else { await call('studio-hq', 'login-verify', { email: $('#em').value.trim(), code: $('#cd').value.trim() }); $('#signin').classList.add('hidden'); boot(); }
    } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
    b.disabled = false;
  };
  ['#em', '#cd'].forEach(function (s) { $(s).addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#siBtn').click(); }); });
  $('#so').onclick = async function () { try { await call('studio-hq', 'logout'); } catch (x) {} location.reload(); };

  async function boot() {
    var r; try { r = await api('boot'); } catch (x) { return; }
    S.items = r.items; S.bin = r.bin || []; S.trashDays = r.trashDays || 30; S.today = r.today; S.month = r.today.slice(0, 7); S.me = r.me; S.isAdmin = !!r.isAdmin; S.team = r.team || { emails: [], names: {} }; S.names = r.names || {}; S.app = r.app || []; S.appCats = r.appCategories || []; S.subs = r.subs || []; S.abizNew = r.abizNew || 0; S.igc = r.igc || []; S.igcTarget = r.igcTarget || 10; S.cars = r.cars || []; S.tcars = r.tcars || []; S.vads = r.vads || []; S.sections = r.sections || null;
    $$('.side-nav [data-nav]').forEach(function (b) { b.classList.toggle('hidden', !allowed(b.dataset.nav)); });
    $$('.side-nav .side-sec').forEach(function (h) { h.classList.toggle('hidden', !['igc', 'cars', 'vads'].some(allowed)); });
    var cardsOk = ['today', 'board', 'calendar', 'posted'].some(allowed); $('#pasteBtn').classList.toggle('hidden', !cardsOk); $('#addBtn').classList.toggle('hidden', !cardsOk);
    $('#adminLink').classList.toggle('hidden', !S.isAdmin); $('#navDir').classList.toggle('hidden', !S.isAdmin); $('#navAbiz').classList.toggle('hidden', !S.isAdmin); $('#navFind').classList.toggle('hidden', !S.isAdmin); $('#navOut').classList.toggle('hidden', !S.isAdmin); $('#navMail').classList.toggle('hidden', !S.isAdmin); $('#navImgm').classList.toggle('hidden', !S.isAdmin); $('#navIgu').classList.toggle('hidden', !S.isAdmin); $('#navDisc').classList.toggle('hidden', !S.isAdmin); $('#navMkt').classList.toggle('hidden', !S.isAdmin); if (S.isAdmin && window.HQMkt) window.HQMkt.count().then(function (n) { $('#nMkt').textContent = n || ''; }); $('#navDm').classList.toggle('hidden', !S.isAdmin); $('#navIga').classList.toggle('hidden', !S.isAdmin); $('#teamBtn').classList.toggle('hidden', !S.isAdmin);
    $('#signin').classList.add('hidden'); $('#app').classList.remove('hidden');
    go(location.hash.slice(1) || 'today');
  }
  var SECTIONS = ['today', 'board', 'calendar', 'posted', 'app', 'subs', 'igc', 'cars', 'vads', 'bin'];
  var SECTION_NAMES = { today: '🏠 Today', board: '🗂️ Board', calendar: '📅 Calendar', posted: '📲 Posted', app: '📣 Publish to App', subs: '📥 Event submissions', igc: '💬 Comment Assistant', cars: '🎬 Animated Carousels', vads: '🎥 Video Ad Studio', bin: '🗑 Bin' };
  function allowed(v) { if (v === 'tcars') v = 'cars'; return !S.sections || S.sections.indexOf(v) >= 0; }
  function go(v) {
    S.view = (['dir', 'abiz', 'find', 'out', 'mail', 'igu', 'dm', 'iga', 'disc', 'mkt', 'imgm'].indexOf(v) >= 0 && S.isAdmin) || ((SECTIONS.indexOf(v) >= 0 || v === 'tcars') && allowed(v)) ? v : (allowed('today') ? 'today' : SECTIONS.filter(allowed)[0] || 'today');
    try { history.replaceState(null, '', '#' + S.view); } catch (e) {}
    $$('.side-nav [data-nav]').forEach(function (b) { b.setAttribute('aria-current', b.dataset.nav === S.view ? 'page' : 'false'); });
    $('#side').classList.remove('open');
    var n = S.items.filter(function (c) { return c.status === 'idea'; }).length; $('#nIdeas').textContent = n || '';
    $('#nBin').textContent = (S.bin || []).length || '';
    $('#nApp').textContent = (S.app || []).filter(function (p) { return appState(p) === 'live'; }).length || '';
    $('#nSubs').textContent = subsNew().length || '';
    $('#nAbiz').textContent = abizCount() || '';
    $('#nIgc').textContent = igcToday() + '/' + (S.igcTarget || 10);
    $('#nVads').textContent = (S.vads || []).filter(function (c) { return c.status !== 'posted'; }).length || '';
    $('#nTcars').textContent = (S.tcars || []).filter(function (c) { return c.status !== 'posted'; }).length || '';
    $('#nCars').textContent = (S.cars || []).filter(function (c) { return c.status !== 'posted'; }).length || '';
    ({ today: vToday, board: vBoard, calendar: vCalendar, posted: vPosted, app: vApp, subs: vSubs, dir: vDir, find: vFind, out: vOut, mail: vMail, igu: vIgu, imgm: vImgm, disc: function () { window.HQDisc.view(); }, mkt: function () { window.HQMkt.view(); }, abiz: vAbiz, dm: vDm, iga: vIga, igc: vIgc, cars: function () { window.HQCar.view(); }, tcars: function () { window.HQTpl.view(); }, vads: function () { window.HQVad.view(); }, bin: vBin })[S.view]();
  }
  function rerender() { go(S.view); }
  if (window.HQCar) window.HQCar.init({ api: api, sheet: sheet, toast: toast, esc: esc, S: S });
  if (window.HQTpl) window.HQTpl.init({ api: api, sheet: sheet, toast: toast, esc: esc, S: S });
  if (window.HQDisc) window.HQDisc.init({ api: api, sheet: sheet, toast: toast, esc: esc, S: S });
  if (window.HQMkt) window.HQMkt.init({ api: api, sheet: sheet, toast: toast, esc: esc, S: S, updateBadge: function (n) { var b = document.getElementById('nMkt'); if (b) b.textContent = n || ''; } });
  if (window.HQBoost) window.HQBoost.init({ api: api, sheet: sheet, toast: toast, esc: esc, S: S, go: function (v) { go(v); } });
  if (window.HQVad) window.HQVad.init({ api: api, sheet: sheet, toast: toast, esc: esc, S: S });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (S.today && h && h !== S.view) go(h); });
  $$('.side-nav [data-nav]').forEach(function (b) { b.onclick = function () { go(b.dataset.nav); }; });
  $('#menuBtn').onclick = function (e) { e.stopPropagation(); $('#side').classList.toggle('open'); };
  document.addEventListener('click', function (e) { var sd = $('#side'); if (sd.classList.contains('open') && !sd.contains(e.target)) sd.classList.remove('open'); });
  $('#pasteBtn').onclick = function () { $('#side').classList.remove('open'); pasteSheet(); };
  $('#addBtn').onclick = function () { $('#side').classList.remove('open'); editCard(null); };

  // ── card ──
  function cardHtml(c, opts) {
    opts = opts || {};
    var late = isLate(c);
    var when = c.status === 'posted' ? '<span class="date">Posted ' + esc(fmtDay((c.postedAt || '').slice(0, 10))) + '</span>' : c.planDate ? '<span class="date' + (late ? ' late' : '') + '">' + (late ? 'Missed · ' : '') + esc(fmtDay(c.planDate)) + (c.planTime ? ' ' + esc(c.planTime) : '') + '</span>' : '';
    var qa = '';
    if (!opts.noQa) {
      if (NEXT[c.status]) qa += '<button data-next="' + c.id + '">' + (c.status === 'ready' ? '📅 Plan' : '→ ' + STATUS[NEXT[c.status]].replace(/^\S+\s/, '')) + '</button>';
      if (c.status === 'scheduled') qa += '<button data-posted="' + c.id + '">✅ Posted</button>';
      qa += '<button data-del="' + c.id + '" title="Delete">🗑</button>';
    }
    return '<div class="kc' + (late ? ' late' : '') + '" data-open="' + c.id + '">' +
      (opts.thumb && c.imgs && c.imgs[0] ? '<img class="th" src="/.netlify/functions/studio-hq?img=' + esc(c.imgs[0]) + '" alt="">' : '') +
      '<button class="star' + (c.starred ? ' on' : '') + '" data-star="' + c.id + '" aria-label="Star">★</button>' +
      '<div class="meta"><span class="t ' + c.type + '">' + TYPE[c.type] + '</span><span class="tp">' + esc(TOPIC[c.topic] || '') + '</span></div>' +
      '<div class="tt">' + esc(c.title) + (c.script ? ' <span class="sctag" title="Has a script">🎬</span>' : '') + '</div>' + (c.caption || c.script ? '<div class="cp">' + esc(c.caption || c.script) + '</div>' : '') +
      (when ? '<div>' + when + '</div>' : '') + (qa ? '<div class="qa">' + qa + '</div>' : '') + '</div>';
  }
  function bindCards(root) {
    $$('[data-open]', root).forEach(function (el) { el.onclick = function (e) { if (e.target.closest('button')) return; editCard(byId(el.dataset.open)); }; });
    $$('[data-star]', root).forEach(function (b) { b.onclick = function () { var c = byId(b.dataset.star); quickSave({ id: c.id, starred: !c.starred }); }; });
    $$('[data-next]', root).forEach(function (b) { b.onclick = function () { var c = byId(b.dataset.next); if (c.status === 'ready') planSheet(c); else quickSave({ id: c.id, status: NEXT[c.status] }, 'Moved to ' + STATUS[NEXT[c.status]].replace(/^\S+\s/, '')); }; });
    $$('[data-posted]', root).forEach(function (b) { b.onclick = function () { markPosted(byId(b.dataset.posted)); }; });
    $$('[data-del]', root).forEach(function (b) { b.onclick = function () { del([b.dataset.del]); }; });
  }
  async function quickSave(patch, msg) { try { var r = await api('save', { item: patch }); upsert(r.item); if (msg) toast(msg); rerender(); return r.item; } catch (x) { toast(x.message); } }
  function toBin(cards) { var now = new Date().toISOString(); S.bin = cards.map(function (c) { return Object.assign({}, c, { deletedAt: now, deletedBy: S.me, daysLeft: S.trashDays }); }).concat((S.bin || []).filter(function (b) { return !cards.some(function (c) { return c.id === b.id; }); })); }
  function fromBin(ids) { S.bin = (S.bin || []).filter(function (b) { return ids.indexOf(b.id) < 0; }); }
  async function del(ids) {
    try {
      await api('delete', { ids: ids }); var gone = S.items.filter(function (c) { return ids.indexOf(c.id) >= 0; });
      S.items = S.items.filter(function (c) { return ids.indexOf(c.id) < 0; }); toBin(gone); rerender();
      toast((ids.length === 1 ? 'Moved to Bin' : ids.length + ' cards moved to Bin') + ' — kept for ' + S.trashDays + ' days', async function () { try { await api('restore', { ids: ids }); gone.forEach(upsert); fromBin(ids); rerender(); toast('Restored'); } catch (x) { toast(x.message); } });
    } catch (x) { toast(x.message); }
  }
  function markPosted(c) {
    var s = sheet('<h2>Mark as posted</h2><p class="muted" style="margin:4px 0 12px">' + esc(c.title) + '</p><div class="stack"><div><label for="pl">Link to the post <span class="muted" style="font-weight:400">(optional)</span></label><input id="pl" placeholder="https://www.instagram.com/p/…" value="' + esc(c.postLink || '') + '"></div><div class="row"><button class="btn primary" id="plS">✅ Mark as posted</button><button class="btn ghost" id="plX">Cancel</button></div></div>');
    $('#plX', s).onclick = function () { s.remove(); };
    $('#plS', s).onclick = async function () { var link = $('#pl', s).value.trim(); s.remove(); await quickSave({ id: c.id, status: 'posted', postLink: link }, 'Marked as posted 🎉'); boostCard(byId(c.id) || c, link); };
  }
  // 🚀 After posting checklist for a Content Hub card
  function boostCard(c, link) {
    if (!window.HQBoost || !c) return;
    window.HQBoost.open({ key: 'hub:' + c.id, kind: 'hub', title: c.title || 'Post', url: link || c.postLink || '', postedAt: c.postedAt || new Date().toISOString(),
      onUrl: function (u) { if (u !== (c.postLink || '')) quickSave({ id: c.id, postLink: u }, 'Link saved'); } });
  }
  function planSheet(c, day) {
    var s = sheet('<h2>Plan this post</h2><p class="muted" style="margin:4px 0 12px">' + esc(c.title) + '</p><div class="f2"><div><label for="pd">Date</label><input type="date" id="pd" value="' + esc(c.planDate || day || today()) + '"></div><div><label for="pt">Time <span class="muted" style="font-weight:400">(optional)</span></label><input type="time" id="pt" value="' + esc(c.planTime || '') + '"></div></div><div class="row" style="margin-top:12px"><button class="btn primary" id="pS">📅 Schedule</button><button class="btn ghost" id="pX">Cancel</button></div>');
    $('#pX', s).onclick = function () { s.remove(); };
    $('#pS', s).onclick = async function () { var d = $('#pd', s).value; if (!d) return; s.remove(); await quickSave({ id: c.id, planDate: d, planTime: $('#pt', s).value }, 'Planned for ' + fmtDay(d)); };
  }

  // ── Today ──
  function vToday() {
    $('#ttl').textContent = 'Today'; $('#topRight').innerHTML = '';
    var t = today(), ws = weekStart(t);
    var todays = S.items.filter(function (c) { return c.status === 'scheduled' && c.planDate === t; }).sort(function (a, b) { return (a.planTime || '99').localeCompare(b.planTime || '99'); });
    var missed = S.items.filter(isLate).sort(function (a, b) { return a.planDate.localeCompare(b.planDate); });
    var soon = S.items.filter(function (c) { return c.status === 'scheduled' && c.planDate > t && c.planDate <= addDays(t, 7); }).sort(function (a, b) { return (a.planDate + (a.planTime || '')).localeCompare(b.planDate + (b.planTime || '')); });
    var postedWeek = S.items.filter(function (c) { return c.status === 'posted' && (c.postedAt || '').slice(0, 10) >= ws; }).length;
    var cnt = function (st) { return S.items.filter(function (c) { return c.status === st; }).length; };
    var h = new Date().toLocaleString('en-GB', { hour: 'numeric', hour12: false, timeZone: 'Europe/London' });
    var hi = Number(h) < 12 ? 'Good morning' : Number(h) < 18 ? 'Good afternoon' : 'Good evening';
    $('#view').innerHTML = '<div class="wrap"><p class="muted">' + hi + (S.names[S.me] ? ', ' + esc(S.names[S.me]) : '') + ' 👋🏾</p>' +
      '<div class="stats">' +
        '<div class="card"><b>' + todays.length + '</b><span>📅 to post today</span></div>' +
        '<div class="card"><b>' + soon.length + '</b><span>planned next 7 days</span></div>' +
        '<div class="card"><b>' + cnt('ready') + '</b><span>✅ ready to plan</span></div>' +
        '<div class="card"><b>' + cnt('idea') + '</b><span>💡 ideas to review</span></div>' +

      var meta = k === 'event' ? '<div class="apm">📅 ' + esc(fmtLong(v.eventDate) || 'Pick a date') + (v.eventTime ? ' · ' + esc(v.eventTime) : '') + (v.location ? '<br>📍 ' + esc(v.location) : '') + '</div>' : '';
      if (!painting) { painting = true; try { paintImg(); } finally { painting = false; } }
      var pv = k === 'article' && imgSrc() ? '<img src="' + esc(imgSrc()) + '" alt="" style="display:block;width:100%;max-height:340px;object-fit:contain;background:#f0f2f5">' : k === 'event' && imgSrc() ? '<img src="' + esc(imgSrc()) + '" alt="" style="display:block;width:100%;max-height:260px;object-fit:contain;background:#0F1E36">' : '';
      $('#aePv', s).innerHTML = '<div class="apcard"><div class="aph" style="background:' + KIND_COLOR[k] + '"><span>' + label + '</span><span>' + esc(new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })) + '</span></div>' + pv +
        '<div class="apb"><div class="apt">' + esc(v.title || 'Your title') + '</div>' + meta + '<div class="aptx">' + (appHtml(v.body) || '<p class="muted">Your message…</p>') + '</div>' +
        (v.link ? '<div class="apl">🔗 ' + (k === 'event' ? 'Get tickets' : 'Read more') + '</div>' : '') + '</div></div>';
    }
    $$('#aeK [data-k]', s).forEach(function (b) { b.onclick = function () { $$('#aeK [data-k]', s).forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); paint(); }; });
    $$('input,textarea,select', s).forEach(function (el) { el.addEventListener('input', paint); el.addEventListener('change', paint); });
    paintImg();
    $('#aeImgMake', s).onclick = makeImg;
    $('#aeImgHead', s).onclick = function () { if (!img.photo) return; blogHeadSheet(img.photo, img.lines || blogLines(vals().title), function (d, l) { img.data = d; img.lines = l; paintImg(); }); };
    $('#aeImgOk', s).onclick = function () { img.from = 'own'; paintImg(); $('#aeImgNote', s).textContent = 'Great — this image will be used.'; };
    $('#aeImgNone', s).onclick = function () { img = { id: '', data: '', from: '' }; paintImg(); };
    $('#aeImgFile', s).onchange = async function () { var f = this.files && this.files[0]; if (!f) return; try { img = { id: '', data: await imgShrink(f), from: 'own' }; paintImg(); } catch (x) { toast(x.message); } this.value = ''; };
    // AI draft with no image → create one straight away, then ask
    if (ai && (p.kind === 'event' || p.kind === 'article') && !imgSrc() && p.title) makeImg();
    $('#aeX', s).onclick = function () { s.remove(); };
    if (ai) {
      $('#aeNotes', s).onclick = function () { s.remove(); appAiSheet(ai); };
      $('#aeAgain', s).onclick = async function () {
        var b = this; b.disabled = true; b.textContent = 'Writing…';
        try { var d = await aiDraft(ai); if (ai.rewrite && p.id) d = Object.assign({}, p, { title: d.title, summary: d.summary, body: d.body, link: d.link || p.link }); if (!d._img && img.data) { d._img = img.data; d._imgFrom = img.from; } s.remove(); appEditor(d, onDone, ai); }
        catch (x) { toast(x.message); b.disabled = false; b.textContent = 'Try again'; }
      };
    }
    async function submit(status) {
      var err = $('#aeErr', s); err.classList.add('hidden');
      var item = Object.assign(vals(), { status: status }); if (!isNew) item.id = p.id;
      if (item.kind === 'update' && !item.showUntil && isNew && !confirm('No “show until” date — this update will stay in the app until you hide it. Publish anyway?')) return;
      $$('button', s).forEach(function (b) { b.disabled = true; });
      try {
        if (item.kind === 'event' || item.kind === 'article') {
          if (img.data) { var ri = await api('app-img', { image: img.data }); img = { id: ri.imgId, data: '', from: img.from }; }
          item.imgId = img.id;
        }
        if (sub) { var ra = await api('sub-approve', { id: sub.id, item: item }); S.subs = ra.subs; S.app = ra.app; s.remove(); toast('Approved — it’s in the app’s Events within a minute 🎉'); rerender(); return; }
        var r = await api('app-save', { item: item }); upsertApp(r.item); s.remove();
        toast(isNew ? (status === 'hidden' ? 'Saved (hidden)' : 'Published — it’s in the app within a minute 🎉') : 'Saved');
        if (onDone) onDone(r.item);
        if (S.view === 'app') rerender(); else go2app();
      } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); $$('button', s).forEach(function (b) { b.disabled = false; }); $$('#aeK [data-k]', s).forEach(function (b) { b.disabled = !isNew; }); }
    }
    function go2app() { if (S.view !== 'app') go('app'); }
    $('#aeP', s).onclick = function () { submit(isNew ? 'live' : (p.status || 'live')); };
    if (isNew && !sub) $('#aeH', s).onclick = function () { submit('hidden'); };
  }


  // ── 💬 Comment Assistant (Instagram Growth) ──
  var IGK = { recommended: '⭐ Recommended', conversation: '💬 Conversation starter', standout: '✨ Standout' };
  var IGSTYLE = [['friendly', '😊 Friendly'], ['helpful', '💡 Helpful'], ['playful', '😄 Playful'], ['supportive', '💚 Supportive']];
  var IGGOAL = [['visits', 'Profile visits & followers'], ['conversation', 'Start a conversation'], ['relationships', 'Build business relationships']];
  var IG = { shot: '', link: '', context: '', style: 'friendly', goal: 'visits', cur: null, busy: false, hist: 'all', more: false };
  try { var igp = JSON.parse(localStorage.getItem('hq-igc') || '{}'); if (igp.style) IG.style = igp.style; if (igp.goal) IG.goal = igp.goal; } catch (e) {}
  function igcToday() { return (S.igc || []).filter(function (e) { return e.posted && e.posted.day === today(); }).length; }
  function igUpsert(e) { var i = (S.igc || []).findIndex(function (x) { return x.id === e.id; }); if (i >= 0) S.igc[i] = e; else S.igc.unshift(e); }
  function igAgo(iso) {
    var d = new Date(iso), day = d.toLocaleDateString('en-CA', { timeZone: 'Europe/London' });
    var t = d.toLocaleTimeString('en-GB', { timeZone: 'Europe/London', hour: 'numeric', minute: '2-digit' });
    return (day === today() ? 'Today' : fmtDay(day)) + ' ' + t;
  }
  function igFit(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

  function vIgc() {
    $('#ttl').textContent = 'Comment Assistant'; $('#topRight').innerHTML = '';
    var n = igcToday(), goal = S.igcTarget || 10, pct = Math.min(100, Math.round(n / goal * 100));
    $('#view').innerHTML = '<div class="wrap igwrap stack">' +
      '<div class="card igprog' + (n >= goal ? ' done' : '') + '"><b>' + n + '<span class="muted" style="font-size:16px">/' + goal + '</span></b><div style="flex:1"><div style="font-weight:700;font-size:14px;margin-bottom:5px">' + (n >= goal ? 'Daily target done — well done! 🎉' : 'Meaningful comments posted today') + '</div><div class="igbar"><i style="width:' + pct + '%"></i></div></div></div>' +
      '<div class="card stack" id="igForm">' +
        '<div><label>Screenshot of the post</label><div id="igShot"></div></div>' +
        '<div><label for="igLink">Instagram link <span class="muted" style="font-weight:500">(optional — saved with the history)</span></label><input id="igLink" type="url" inputmode="url" placeholder="https://www.instagram.com/p/…" value="' + esc(IG.link) + '"></div>' +
        '<div><label>Comment style</label><div class="chipbar" id="igStyle">' + IGSTYLE.map(function (o) { return '<button class="chip" data-v="' + o[0] + '" aria-pressed="' + (IG.style === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>' +
        '<div><label>What should this comment achieve?</label><div class="chipbar" id="igGoal">' + IGGOAL.map(function (o) { return '<button class="chip" data-v="' + o[0] + '" aria-pressed="' + (IG.goal === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>' +
        '<div><label for="igCtx">Caption or context <span class="muted" style="font-weight:500">(optional)</span></label><textarea id="igCtx" rows="3" placeholder="Paste the caption, or add a note — e.g. “she’s a Leeds caterer who just opened her first shop”">' + esc(IG.context) + '</textarea></div>' +
        '<div class="err hidden" id="igErr"></div>' +
        '<button class="btn primary" id="igGo" style="width:100%">✨ Generate comment ideas</button>' +
      '</div>' +
      '<div id="igOut"></div>' +
      '<h2 class="h2">History</h2><div id="igHist"></div>' +
    '</div>';
    drawShot(); drawOut(); drawHist();

    $('#igLink').oninput = function () { IG.link = this.value.trim(); };
    $('#igCtx').oninput = function () { IG.context = this.value; };
    var remember = function () { try { localStorage.setItem('hq-igc', JSON.stringify({ style: IG.style, goal: IG.goal })); } catch (e) {} };
    $$('#igStyle .chip').forEach(function (b) { b.onclick = function () { IG.style = b.dataset.v; remember(); $$('#igStyle .chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); }; });
    $$('#igGoal .chip').forEach(function (b) { b.onclick = function () { IG.goal = b.dataset.v; remember(); $$('#igGoal .chip').forEach(function (x) { x.setAttribute('aria-pressed', x === b); }); }; });
    $('#igGo').onclick = function () { igGenerate(false); };
  }

  function drawShot() {
    var box = $('#igShot'); if (!box) return;
    if (IG.shot) {
      box.innerHTML = '<div class="igshot"><img src="' + IG.shot + '" alt="Screenshot"><div class="stack" style="margin:0"><span class="muted" style="font-size:13px">Screenshot added ✓<br>It’s only used to write the comments — it isn’t saved.</span><div class="row"><label class="btn small ghost" style="margin:0">Change<input type="file" accept="image/*" id="igFile" hidden></label><button class="btn small ghost danger" id="igRm">Remove</button></div></div></div>';
      $('#igRm').onclick = function () { IG.shot = ''; drawShot(); };
    } else {
      box.innerHTML = '<label class="igdrop" id="igDrop"><b>📸 Upload a screenshot</b><span>The post, caption or comment thread. On a computer you can also paste (Ctrl/⌘+V) or drop it here.</span><input type="file" accept="image/*" id="igFile" hidden></label>';
      var d = $('#igDrop');
      d.ondragover = function (e) { e.preventDefault(); d.classList.add('over'); };
      d.ondragleave = function () { d.classList.remove('over'); };
      d.ondrop = function (e) { e.preventDefault(); d.classList.remove('over'); if (e.dataTransfer.files[0]) takeShot(e.dataTransfer.files[0]); };
    }
    $('#igFile').onchange = function () { if (this.files[0]) takeShot(this.files[0]); };
  }
  async function takeShot(file) {
    if (!/^image\//.test(file.type)) { toast('Please choose an image'); return; }
    try { IG.shot = await resize(file, 1800); drawShot(); } catch (x) { toast('Couldn’t read that image — try another'); }
  }
  document.addEventListener('paste', function (e) {
    if (S.view !== 'igc' || !e.clipboardData) return;
    var f = Array.prototype.slice.call(e.clipboardData.files || []).filter(function (x) { return /^image\//.test(x.type); })[0];
    if (f) { e.preventDefault(); takeShot(f); }
  });

  async function igGenerate(again) {
    if (IG.busy) return;
    var err = $('#igErr'); err.classList.add('hidden');
    if (!IG.shot && IG.context.trim().length < 15) {
      err.textContent = IG.link ? 'Instagram doesn’t let us read post links — please add a screenshot of the post (or paste its caption).' : 'Add a screenshot of the post, or paste its caption.';
      err.classList.remove('hidden'); return;
    }
    IG.busy = true;
    var btns = [$('#igGo'), $('#igAgain')].filter(Boolean);
    btns.forEach(function (b) { b.disabled = true; }); $('#igGo').textContent = '✍️ Auntie Tobi is thinking…';
    try {
      var avoid = again && IG.cur ? IG.cur.comments.map(function (c) { return c.text; }) : [];
      var r = await api('igc-gen', { image: IG.shot, link: IG.link, context: IG.context, style: IG.style, goal: IG.goal, avoid: avoid });
      IG.cur = r.entry; igUpsert(r.entry);
      $('#nIgc').textContent = igcToday() + '/' + (S.igcTarget || 10);
      drawOut(); drawHist();
      var o = $('#igOut'); if (o) o.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
    IG.busy = false;
    var g = $('#igGo'); if (g) { g.disabled = false; g.textContent = '✨ Generate comment ideas'; }
    var a = $('#igAgain'); if (a) a.disabled = false;
  }

  function drawOut() {
    var o = $('#igOut'); if (!o) return;
    var e = IG.cur;
    if (!e) { o.innerHTML = ''; return; }
    var posted = e.posted;
    o.innerHTML = '<div class="stack">' +
      '<div class="row" style="justify-content:space-between"><div style="min-width:0"><div style="font-weight:700">' + esc(e.about || 'Comment ideas') + '</div>' + (e.account ? '<div class="muted" style="font-size:13px">' + esc(e.account) + '</div>' : '') + '</div>' +
        '<button class="btn small ghost" id="igAgain">🔄 New ideas</button></div>' +
      (e.sensitive ? '<div class="note">💚 This looks like a serious post, so all three are kept sincere — no jokes.</div>' : '') +
      '<div class="igres">' + e.comments.map(function (c, i) {
        var done = posted && posted.i === i;
        return '<div class="igc' + (i === 0 ? ' best' : '') + (done ? ' done' : '') + '"><div class="row"><span class="igk">' + (IGK[c.kind] || '') + '</span><span class="igcnt" data-cnt="' + i + '"></span></div>' +
          '<textarea rows="1" data-t="' + i + '" aria-label="' + esc(IGK[c.kind] || 'Comment') + ' — you can edit it">' + esc(done ? posted.text : c.text) + '</textarea>' +
          '<div class="row"><button class="btn small primary" data-cp="' + i + '">📋 Copy comment</button>' +
          (done ? '<span class="ok" style="color:var(--green-d);font-weight:700;font-size:13px">✅ Posted</span><button class="btn small link" data-un="' + i + '" style="margin-left:auto;font-size:13px">Undo</button>'
                : '<button class="btn small ghost" data-po="' + i + '">✅ I posted this</button>') + '</div></div>';
      }).join('') + '</div>' +
      '<p class="muted" style="font-size:13px;margin:0">Tap a comment to tweak it, copy it, post it on Instagram yourself, then tap “I posted this” so it counts towards today’s ' + (S.igcTarget || 10) + '.</p></div>';
    $$('#igOut textarea').forEach(function (t) {
      var cnt = function () { var w = t.value.trim().split(/\s+/).filter(Boolean).length; $('[data-cnt="' + t.dataset.t + '"]').textContent = w + ' words'; };
      igFit(t); cnt(); t.oninput = function () { igFit(t); cnt(); };
    });
    var text = function (i) { return $('#igOut [data-t="' + i + '"]').value.trim(); };
    $$('#igOut [data-cp]').forEach(function (b) { b.onclick = function () { copy(text(b.dataset.cp), 'Copied — paste it into Instagram'); }; });
    $$('#igOut [data-po]').forEach(function (b) { b.onclick = function () { igPosted(e.id, Number(b.dataset.po), text(b.dataset.po)); }; });
    $$('#igOut [data-un]').forEach(function (b) { b.onclick = function () { igPosted(e.id, null); }; });
    $('#igAgain').onclick = function () { igGenerate(true); };
  }

  async function igPosted(id, i, txt) {
    try {
      var r = await api('igc-posted', { id: id, i: i, text: txt });
      igUpsert(r.entry); if (IG.cur && IG.cur.id === id) IG.cur = r.entry;
      var n = igcToday(), goal = S.igcTarget || 10;
      toast(i === null ? 'Un-marked' : n === goal ? 'That’s ' + goal + ' today — target done! 🎉' : 'Nice one — ' + n + '/' + goal + ' today');
      if (i !== null) { IG.shot = ''; IG.link = ''; IG.context = ''; }
      var keep = IG.cur; vIgc(); IG.cur = keep; drawOut();
      $('#nIgc').textContent = n + '/' + goal;
    } catch (x) { toast(x.message); }
  }

  function drawHist() {
    var h = $('#igHist'); if (!h) return;
    var all = S.igc || [];
    var list = all.filter(function (e) { return IG.hist === 'all' || (IG.hist === 'posted' ? !!e.posted : !e.posted); });
    var shown = IG.more ? list : list.slice(0, 25);
    h.innerHTML = (all.length ? '<div class="chipbar" style="margin-bottom:10px">' + [['all', 'All'], ['posted', '✅ Posted'], ['open', 'Not posted']].map(function (o) { return '<button class="chip" data-hf="' + o[0] + '" aria-pressed="' + (IG.hist === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div>' : '') +
      (shown.length ? '<div class="card ighist" style="padding:2px 14px">' + shown.map(function (e) {
        var p = e.posted;
        return '<div class="ighrow"><div class="tx"><div style="font-weight:700">' + esc(e.about || 'Comment ideas') + (e.account ? ' <span class="muted" style="font-weight:500">' + esc(e.account) + '</span>' : '') + '</div>' +
          '<div class="muted" style="font-size:12px">' + esc(igAgo(e.createdAt)) + (e.by && e.by !== S.me ? ' · ' + esc(who(e.by)) : '') + (e.link ? ' · <a href="' + esc(e.link) + '" target="_blank" rel="noopener">Open post ↗</a>' : '') + '</div>' +
          (p ? '<q>“' + esc(p.text) + '”</q><span class="ok">✅ Posted ' + esc(igAgo(p.at)) + (p.by && p.by !== S.me ? ' by ' + esc(who(p.by)) : '') + '</span>' : '<span class="no">Not posted yet</span>') + '</div>' +
          '<div class="row" style="gap:4px;flex:none"><button class="btn small ghost" data-ho="' + e.id + '">Open</button><button class="btn small ghost danger" data-hd="' + e.id + '" title="Delete" aria-label="Delete">🗑</button></div></div>';
      }).join('') + '</div>' : '<div class="card"><p class="muted" style="margin:0">' + (all.length ? 'Nothing here yet.' : 'Your comment ideas will show here, so you can see what you’ve posted and where.') + '</p></div>') +
      (list.length > shown.length ? '<button class="btn small ghost" id="igMore" style="margin-top:10px">Show all ' + list.length + '</button>' : '');
    $$('[data-hf]', h).forEach(function (b) { b.onclick = function () { IG.hist = b.dataset.hf; IG.more = false; drawHist(); }; });
    $$('[data-ho]', h).forEach(function (b) { b.onclick = function () { IG.cur = S.igc.filter(function (x) { return x.id === b.dataset.ho; })[0]; drawOut(); $('#igOut').scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
    $$('[data-hd]', h).forEach(function (b) { b.onclick = async function () {
      if (!confirm('Delete this from the history?')) return;
      try { await api('igc-delete', { id: b.dataset.hd }); S.igc = S.igc.filter(function (x) { return x.id !== b.dataset.hd; }); if (IG.cur && IG.cur.id === b.dataset.hd) { IG.cur = null; drawOut(); } drawHist(); $('#nIgc').textContent = igcToday() + '/' + (S.igcTarget || 10); toast('Deleted'); } catch (x) { toast(x.message); }
    }; });
    var m = $('#igMore'); if (m) m.onclick = function () { IG.more = true; drawHist(); };
  }

  function sheet(html) { var s = document.createElement('div'); s.className = 'scrim'; s.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; document.body.appendChild(s); s.addEventListener('click', function (e) { if (e.target === s) s.remove(); }); return s; }
  boot();
})();
</script>
</body>
