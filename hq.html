<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1E36">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; worker-src 'self' blob: https://cdnjs.cloudflare.com; connect-src 'self'; form-action 'self'; base-uri 'none'">
<title>Auntie Tobi HQ</title>
<link rel="icon" href="/favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#057A44;--green-d:#04613A;--green-l:#E3F2EA;--gold:#FFB81C;--gold-l:#FFF1CF;--navy:#0F1E36;--navy-2:#1C2E4D;--navy-3:#2A3D60;--cream:#FBF6EC;--line:#EADFC8;--muted:#5B6475;--danger:#B3261E;--danger-l:#FCE8E6;--font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--display:'Fraunces',Georgia,serif;--side:290px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--cream);color:var(--navy);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--green)}
.hidden,[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;min-height:40px;text-decoration:none}
.btn.primary{background:var(--green);color:#fff}.btn.primary:hover{background:var(--green-d)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--navy)}
.btn.small{padding:5px 10px;min-height:0;font-size:13px;border-radius:8px}
.btn.link{padding:0;min-height:0;color:var(--green)}
.btn:disabled{opacity:.55;cursor:default}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
label{display:block;font-weight:700;font-size:13px;margin-bottom:4px}
.muted{color:var(--muted)}.err{background:var(--danger-l);color:var(--danger);border-radius:10px;padding:10px 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:10px 16px;border-radius:10px;z-index:60;max-width:90vw}

/* layout */
.app{display:flex;height:100vh;height:100dvh}
aside{width:var(--side);flex:none;background:var(--navy);color:var(--cream);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.brand img{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);background:var(--cream)}
.brand b{font-family:var(--display);font-size:19px;display:block;line-height:1.1}.brand small{color:var(--gold);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;font-weight:700}
.side-actions{padding:6px 12px 10px;display:flex;flex-direction:column;gap:8px}
.newchat{background:var(--gold);color:var(--navy);border-radius:10px;padding:10px;font-weight:800;text-align:center}
.side-search{background:var(--navy-2);border-color:var(--navy-3);color:var(--cream)}.side-search::placeholder{color:#9AA6BC}
.side-nav{display:flex;flex-direction:column;padding:0 8px}
.side-nav button{text-align:left;padding:9px 10px;border-radius:8px;color:#D5DCE8;font-weight:600;display:flex;gap:10px;align-items:center}
.side-nav button[aria-current=page]{background:var(--navy-3);color:#fff}
.side-h{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#8E9AB2;font-weight:700;padding:14px 18px 6px}
.convs{flex:1;overflow-y:auto;padding:0 8px 12px;min-height:0}
.conv{display:flex;align-items:center;gap:4px;border-radius:8px}
.conv>button:first-child{flex:1;text-align:left;padding:8px 10px;color:#D5DCE8;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.conv.on{background:var(--navy-3)}.conv.on>button:first-child{color:#fff}
.conv .cmenu{opacity:0;color:#9AA6BC;padding:6px 8px}.conv:hover .cmenu,.conv.on .cmenu{opacity:1}
.conv small{display:block;color:#8E9AB2;font-size:12px;white-space:normal}
.side-foot{padding:10px 16px 14px;border-top:1px solid var(--navy-3);font-size:12.5px;color:#9AA6BC}
.meter{height:6px;background:var(--navy-3);border-radius:999px;overflow:hidden;margin-top:6px}.meter span{display:block;height:100%;background:var(--gold)}
.meter.warn span{background:#F08A5D}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--cream);min-height:56px}
.top .ttl{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none;font-size:22px;padding:4px 8px}
.view{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 24px}

/* chat */
.msgs{display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:13px}
.msg.user{flex-direction:row-reverse}
.msg.user .av{background:var(--navy);color:var(--cream)}
.msg.ai .av{background:var(--cream);border:2px solid var(--gold);overflow:hidden}.msg.ai .av img{width:100%;height:100%}
.bubble{min-width:0;max-width:100%}
.msg.user .bubble{background:var(--navy);color:var(--cream);border-radius:16px 4px 16px 16px;padding:10px 14px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai .bubble{flex:1;background:#fff;border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 16px}
.md{overflow-wrap:anywhere}
.md>*+*{margin-top:.6em}
.md h1,.md h2,.md h3{font-family:var(--display);line-height:1.25}.md h1{font-size:21px}.md h2{font-size:18px}.md h3{font-size:16px}
.md ul,.md ol{padding-left:1.4em}.md li+li{margin-top:.25em}
.md code{background:#F3EEE3;border-radius:5px;padding:1px 5px;font-size:.92em}
.md pre{background:var(--navy);color:#E9EEF6;border-radius:10px;padding:12px;overflow-x:auto}.md pre code{background:none;padding:0;color:inherit}
.md blockquote{border-left:3px solid var(--gold);padding-left:10px;color:var(--muted)}
.md table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left}.md th{background:var(--cream)}
.md hr{border:0;border-top:1px solid var(--line)}
.msg-acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.msg-acts button{color:var(--muted);font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:7px}.msg-acts button:hover{background:#F3EEE3;color:var(--navy)}
.msg.user .msg-acts{justify-content:flex-end}
.att{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.att img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid rgba(255,255,255,.3)}
.chipf{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.14);border-radius:8px;padding:4px 8px;font-size:13px}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.cursor::after{content:'▍';color:var(--green);animation:bl 1s infinite}
.suggest{background:var(--gold-l);border:1px solid #F2D58A;border-radius:12px;padding:12px;margin-top:10px}
.suggest b{display:block;margin-bottom:6px}
.sg{background:#fff;border-radius:10px;padding:10px;margin-top:8px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.sg p{flex:1;min-width:200px}.sg small{display:block;color:var(--muted);font-size:12px}

/* composer */
.composer{border-top:1px solid var(--line);background:var(--cream);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.comp{max-width:820px;margin:0 auto;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:8px}
.comp:focus-within{border-color:var(--green)}
.comp textarea{border:0;outline:0;resize:none;max-height:240px;min-height:44px;padding:6px 8px}
.comp textarea:focus{outline:0}
.comp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:18px}.icon-btn:hover{background:#F3EEE3;color:var(--navy)}
.icon-btn.rec{background:var(--danger-l);color:var(--danger)}
.seg{display:inline-flex;background:#F3EEE3;border-radius:10px;padding:3px}
.seg button{padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}.seg button[aria-pressed=true]{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.send{margin-left:auto;background:var(--green);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px}.send:disabled{opacity:.4}
.pend{display:flex;gap:6px;flex-wrap:wrap;padding:2px 4px 6px}
.pend span{display:inline-flex;align-items:center;gap:6px;background:var(--green-l);border-radius:8px;padding:4px 8px;font-size:13px}
.pend img{width:36px;height:36px;border-radius:6px;object-fit:cover}
.pend button{color:var(--muted);font-weight:800}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

/* home */
.hello{font-family:var(--display);font-size:30px;line-height:1.15;margin:18px 0 4px}
.glance{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:16px 0}
.glance .card b{display:block;font-family:var(--display);font-size:26px;line-height:1.1}.glance .card span{font-size:13px;color:var(--muted)}
.glance .card.warn b{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;text-align:left}.chip:hover{border-color:var(--green)}

/* memory / prompts / settings */
.page h1{font-family:var(--display);font-size:26px;margin-bottom:4px}
.fact{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.fact:last-child{border-bottom:0}
.fact p{flex:1;white-space:pre-wrap}.fact small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.cat-h{font-family:var(--display);font-size:17px;margin:18px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:10px}
.scrim{position:fixed;inset:0;background:rgba(15,30,54,.5);z-index:50;display:grid;place-items:center;padding:16px}
.sheet{background:var(--cream);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90vh;overflow-y:auto}

/* sign in */
.signin{max-width:400px;margin:12vh auto 0;padding:24px}
.signin img{width:72px;height:72px;border-radius:50%;border:3px solid var(--gold)}

@media (max-width:860px){
  aside{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,30,54,.45)}
  .menu-btn{display:block}
  .msg.user .bubble{max-width:92%}
  .msg .av{display:none}
  .hello{font-size:25px}
}
</style>
</head>
<body>
<div id="signin" class="signin hidden">
  <img src="/tobi-face-128.png" alt="">
  <h1 style="font-family:var(--display);font-size:28px;margin:12px 0 4px">Auntie Tobi HQ</h1>
  <p class="muted" style="margin-bottom:16px">Your private business assistant. Sign in with your admin email.</p>
  <div class="stack">
    <div><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>
    <div id="cdBox" class="hidden"><label for="cd">6-digit code</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
    <div class="err hidden" id="siErr"></div>
    <button class="btn primary" id="siBtn" style="width:100%">Send me a code</button>
  </div>
</div>

<div class="app hidden" id="app">
  <aside id="side">
    <div class="brand"><img src="/tobi-face-128.png" alt=""><div><b>Auntie Tobi HQ</b><small>Your business assistant</small></div></div>
    <div class="side-actions">
      <button class="newchat" id="newChat">＋ New chat</button>
      <input class="side-search" id="search" placeholder="Search chats…" aria-label="Search chats">
    </div>
    <div class="side-nav">
      <button data-nav="chat">💬 Chat</button>
      <button data-nav="memory">🧠 Business memory</button>
      <button data-nav="prompts">⭐ Saved prompts</button>
      <button data-nav="settings">⚙️ Settings &amp; usage</button>
      <a class="btn link" href="/studio-admin" style="color:#D5DCE8;justify-content:flex-start;padding:9px 10px;font-weight:600">📋 Admin &amp; Today ↗</a>
    </div>
    <div class="side-h" id="convH">Chats</div>
    <div class="convs" id="convs"></div>
    <div class="side-foot" id="usageBox"></div>
  </aside>
  <div class="main">
    <div class="top"><button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button><div class="ttl" id="ttl">Auntie Tobi HQ</div><span id="topRight"></span></div>
    <div class="view" id="view"></div>
    <div class="composer" id="composer">
      <div class="comp">
        <div class="pend" id="pend"></div>
        <textarea id="inp" rows="1" placeholder="Message Auntie Tobi HQ…"></textarea>
        <div class="comp-row">
          <button class="icon-btn" id="attach" title="Attach images or files" aria-label="Attach">📎</button>
          <input type="file" id="file" multiple class="hidden" accept="image/*,.pdf,.docx,.xlsx,.xls,.csv,.txt,.md">
          <button class="icon-btn" id="mic" title="Speak" aria-label="Voice input">🎙️</button>
          <div class="seg" role="group" aria-label="Model"><button data-mode="fast" aria-pressed="true" title="Cheap and quick — everyday tasks">Everyday</button><button data-mode="smart" aria-pressed="false" title="Stronger — planning, long documents, tricky questions">Smart</button></div>
          <button class="send" id="send" aria-label="Send">➤</button>
        </div>
      </div>
      <div class="hint">Auntie Tobi HQ drafts — it never posts or messages anyone. Check facts before sharing.</div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var S = { view: 'chat', conv: null, mode: 'fast', pending: { images: [], files: [] }, busy: false };
  function money(g) { return g > 0 && g < 0.01 ? 'under 1p' : '£' + Number(g).toFixed(2); }
  function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  async function call(fn, action, payload) {
    var res, data;
    try {
      res = await fetch('/.netlify/functions/' + fn, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Studio': '1' }, body: JSON.stringify(Object.assign({ action: action }, payload || {})) });
      data = await res.json().catch(function () { return {}; });
    } catch (e) { throw new Error('No connection — check your internet and try again.'); }
    if (res.status === 401 && fn === 'studio-hq') { showSignIn(); throw new Error('Please sign in.'); }
    if (!res.ok) { var er = new Error((data && data.message) || 'Something went wrong.'); er.code = data && data.error; er.status = res.status; throw er; }
    return data;
  }
  var api = function (action, payload) { return call('studio-hq', action, payload); };

  // ── markdown (safe: escape first, then format) ──
  function inline(s) {
    return s.replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  }
  function md(src) {
    var lines = esc(String(src || '').replace(/\r/g, '')).split('\n'), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (/^```/.test(l)) { var code = []; i++; while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]); i++; out.push('<pre><code>' + code.join('\n') + '</code></pre>'); continue; }
      var h = /^(#{1,4})\s+(.*)$/.exec(l); if (h) { var n = Math.min(3, h[1].length); out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>'); i++; continue; }
      if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var cells = function (r) { return r.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return inline(c.trim()); }); };
        var t = '<table><thead><tr>' + cells(l).map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>'; i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { t += '<tr>' + cells(lines[i]).map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; i++; }
        out.push(t + '</tbody></table>'); continue;
      }
      if (/^\s*([-*•])\s+/.test(l)) { var ul = []; while (i < lines.length && /^\s*([-*•])\s+/.test(lines[i])) ul.push('<li>' + inline(lines[i++].replace(/^\s*[-*•]\s+/, '')) + '</li>'); out.push('<ul>' + ul.join('') + '</ul>'); continue; }
      if (/^\s*\d+[.)]\s+/.test(l)) { var ol = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) ol.push('<li>' + inline(lines[i++].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); out.push('<ol>' + ol.join('') + '</ol>'); continue; }
      if (/^&gt;\s?/.test(l)) { var q = []; while (i < lines.length && /^&gt;\s?/.test(lines[i])) q.push(inline(lines[i++].replace(/^&gt;\s?/, ''))); out.push('<blockquote>' + q.join('<br>') + '</blockquote>'); continue; }
      if (!l.trim()) { i++; continue; }
      var p = []; while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*[-*•]\s+|\s*\d+[.)]\s+|&gt;)/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i])) p.push(inline(lines[i++]));
      out.push('<p>' + p.join('<br>') + '</p>');
    }
    return out.join('');
  }
  var stripMem = function (t) { var k = t.indexOf('<<rem'); if (k < 0) { var j = t.lastIndexOf('<<'); if (j >= 0 && j > t.length - 12) k = j; } return k >= 0 ? t.slice(0, k) : t; };

  // ── sign in ──
  function showSignIn() { $('#app').classList.add('hidden'); $('#signin').classList.remove('hidden'); $('#em').focus(); }
  $('#siBtn').onclick = async function () {
    var b = this, err = $('#siErr'); err.classList.add('hidden'); b.disabled = true;
    try {
      if ($('#cdBox').classList.contains('hidden')) {
        await call('studio-admin', 'login-request', { email: $('#em').value.trim() });
        $('#cdBox').classList.remove('hidden'); b.textContent = 'Sign in'; $('#cd').focus();
      } else {
        await call('studio-admin', 'login-verify', { email: $('#em').value.trim(), code: $('#cd').value.trim() });
        $('#signin').classList.add('hidden'); boot();
      }
    } catch (x) { err.textContent = x.message; err.classList.remove('hidden'); }
    b.disabled = false;
  };
  $('#cd').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#siBtn').click(); });
  $('#em').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#siBtn').click(); });

  // ── boot ──
  async function boot() {
    var r;
    try { r = await api('boot'); } catch (x) { if (x.status !== 401) { document.body.innerHTML = '<div class="signin"><div class="err">' + esc(x.message) + '</div></div>'; } return; }

        while ((nl = buf.indexOf('\n')) >= 0) {
          var line = buf.slice(0, nl); buf = buf.slice(nl + 1); if (!line.trim()) continue;
          var o; try { o = JSON.parse(line); } catch (e) { continue; }
          if (o.conv) { if (!c.id) { c.id = o.conv.id; c.title = o.conv.title; lsSet('hqConv', c.id); S.convs = S.convs.filter(function (x) { return x.id !== c.id; }); S.convs.unshift({ id: c.id, title: c.title, updatedAt: new Date().toISOString() }); renderConvs(); $('#ttl').textContent = c.title; } }
          if (o.d) { text2 += o.d; bubble.innerHTML = md(stripMem(text2)); bubble.classList.add('cursor'); var v = $('#view'); if (v.scrollHeight - v.scrollTop - v.clientHeight < 160) scrollDown(); }
          if (o.done) done = o;
          if (o.error) errMsg = o.error;
        }
      }
      if (errMsg && !done) { fail(errMsg); return; }
      ai.content = done ? done.text : stripMem(text2);
      ai.suggest = done && done.suggest && done.suggest.length ? done.suggest : null;
      if (done && done.usage) { S.usage = done.usage; renderUsage(); }
      var me = S.convs.filter(function (x) { return x.id === c.id; })[0]; if (me) me.updatedAt = new Date().toISOString();
      renderChat();
      if (done && done.usage && done.usage.warn && !S.warned) { S.warned = true; toast(done.usage.blocked ? 'You’ve reached this month’s HQ budget' : 'Heads up: HQ has used over 80% of this month’s budget'); }
    } catch (x) { fail('Connection lost — please try again.'); }
    finally { S.busy = false; $('#send').disabled = false; }
  }

  // ── memory ──
  async function showMemory() {
    setNav('memory'); S.conv = S.conv; $('#ttl').textContent = 'Business memory'; $('#topRight').innerHTML = '';
    $('#view').innerHTML = '<div class="wrap"><div class="typing"><i></i><i></i><i></i></div></div>';
    var r; try { r = await api('mem-list'); } catch (x) { toast(x.message); return; }
    S.facts = r.facts; S.cats = r.cats; drawMemory();
  }
  function drawMemory(q) {
    q = (q || '').toLowerCase();
    var by = {}; S.facts.filter(function (f) { return !q || (f.text + ' ' + f.cat).toLowerCase().indexOf(q) > -1; }).forEach(function (f) { (by[f.cat] = by[f.cat] || []).push(f); });
    var src = function (f) { return f.source === 'seed' ? 'Starter fact — please check it’s right' : f.source === 'chat' ? 'Saved from a chat' : 'Added by you'; };
    $('#view').innerHTML = '<div class="wrap page"><h1>🧠 Business memory</h1><p class="muted">What Auntie Tobi HQ knows about your business. It uses this in every chat. Add, edit or delete anything — HQ only saves new facts when you say so.</p>' +
      '<div class="card stack" style="margin-top:14px"><b>Add something to remember</b><div class="row"><select id="fCat" style="width:auto">' + S.cats.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select></div><textarea id="fTxt" rows="2" placeholder="e.g. Business Promotion costs £30 for 1 week"></textarea><div><button class="btn primary" id="fAdd">Save to memory</button></div></div>' +
      '<div class="row" style="margin-top:16px"><input id="fQ" placeholder="Search memory…" value="' + esc(q) + '" style="max-width:320px"><span class="muted" style="margin-left:auto">' + S.facts.length + ' facts</span></div>' +
      Object.keys(by).sort(function (a, b) { return S.cats.indexOf(a) - S.cats.indexOf(b); }).map(function (c) {
        return '<div class="cat-h">' + esc(c) + '</div><div class="card" style="padding:4px 14px">' + by[c].map(function (f) { return '<div class="fact"><p>' + esc(f.text) + '<small>' + esc(src(f)) + ' · ' + esc(new Date(f.updatedAt || f.at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })) + '</small></p><button class="btn small ghost" data-fe="' + esc(f.id) + '">Edit</button><button class="btn small ghost" data-fd="' + esc(f.id) + '" style="color:var(--danger)">Delete</button></div>'; }).join('') + '</div>';
      }).join('') + (Object.keys(by).length ? '' : '<p class="muted" style="margin-top:14px">Nothing found.</p>') + '</div>';
    var qi = $('#fQ'); qi.oninput = function () { var v = qi.value; drawMemory(v); var n = $('#fQ'); n.focus(); n.setSelectionRange(v.length, v.length); };
    $('#fAdd').onclick = async function () { try { var f = (await api('mem-save', { fact: { cat: $('#fCat').value, text: $('#fTxt').value } })).fact; S.facts.unshift(f); toast('Saved 🧠'); drawMemory(); } catch (x) { toast(x.message); } };
    $$('[data-fd]').forEach(function (b) { b.onclick = async function () { if (!confirm('Delete this fact from memory?')) return; try { await api('mem-delete', { id: b.dataset.fd }); S.facts = S.facts.filter(function (f) { return f.id !== b.dataset.fd; }); drawMemory(q); } catch (x) { toast(x.message); } }; });
    $$('[data-fe]').forEach(function (b) {
      b.onclick = function () {
        var f = S.facts.filter(function (x) { return x.id === b.dataset.fe; })[0];
        var s = sheet('<h2 style="font-family:var(--display)">Edit memory</h2><div class="stack"><select id="eCat">' + S.cats.map(function (c) { return '<option' + (c === f.cat ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select><textarea id="eTxt" rows="5">' + esc(f.text) + '</textarea><div class="row"><button class="btn primary" id="eS">Save</button><button class="btn ghost" id="eX">Cancel</button></div></div>');
        $('#eX', s).onclick = function () { s.remove(); };
        $('#eS', s).onclick = async function () { try { var nf = (await api('mem-save', { fact: { id: f.id, cat: $('#eCat', s).value, text: $('#eTxt', s).value } })).fact; Object.assign(f, nf); s.remove(); toast('Updated'); drawMemory(q); } catch (x) { toast(x.message); } };
      };
    });
  }

  // ── prompts ──
  function showPrompts() {
    setNav('prompts'); $('#ttl').textContent = 'Saved prompts'; $('#topRight').innerHTML = '';
    $('#view').innerHTML = '<div class="wrap page"><div class="row"><h1 style="flex:1">⭐ Saved prompts</h1><button class="btn primary" id="pNew">＋ New prompt</button></div><p class="muted">Reusable instructions for jobs you do often. Tap Use to put one in the chat box — anything in [brackets] is highlighted for you to fill in.</p>' +
      '<div class="card" style="margin-top:14px;padding:4px 14px">' + S.prompts.map(function (p) { return '<div class="fact"><p><b>' + esc(p.title) + '</b><small>' + esc(p.text.slice(0, 160)) + (p.text.length > 160 ? '…' : '') + '</small></p><button class="btn small primary" data-pu="' + esc(p.id) + '">Use</button><button class="btn small ghost" data-pe="' + esc(p.id) + '">Edit</button><button class="btn small ghost" data-pd="' + esc(p.id) + '" style="color:var(--danger)">Delete</button></div>'; }).join('') + '</div></div>';
    var by = function (id) { return S.prompts.filter(function (p) { return p.id === id; })[0]; };
    $('#pNew').onclick = function () { editPrompt({}); };
    $$('[data-pu]').forEach(function (b) { b.onclick = function () { var p = by(b.dataset.pu); if (S.conv) renderChat(); else showHome(); usePrompt(p); }; });
    $$('[data-pe]').forEach(function (b) { b.onclick = function () { editPrompt(by(b.dataset.pe)); }; });
    $$('[data-pd]').forEach(function (b) { b.onclick = async function () { if (!confirm('Delete this prompt?')) return; try { await api('prompt-delete', { id: b.dataset.pd }); S.prompts = S.prompts.filter(function (p) { return p.id !== b.dataset.pd; }); showPrompts(); } catch (x) { toast(x.message); } }; });
  }
  function editPrompt(p) {
    var s = sheet('<h2 style="font-family:var(--display)">' + (p.id ? 'Edit prompt' : 'Save a prompt') + '</h2><div class="stack"><div><label for="ptT">Title</label><input id="ptT" maxlength="80" value="' + esc(p.title || '') + '"></div><div><label for="ptX">Prompt</label><textarea id="ptX" rows="7" placeholder="Use [brackets] for parts you fill in each time">' + esc(p.text || '') + '</textarea></div><div class="row"><button class="btn primary" id="ptS">Save</button><button class="btn ghost" id="ptC">Cancel</button></div></div>');
    $('#ptC', s).onclick = function () { s.remove(); };
    $('#ptS', s).onclick = async function () { try { var np = (await api('prompt-save', { prompt: { id: p.id, title: $('#ptT', s).value, text: $('#ptX', s).value } })).prompt; if (p.id) S.prompts = S.prompts.map(function (x) { return x.id === np.id ? np : x; }); else S.prompts.push(np); s.remove(); toast('Prompt saved ⭐'); if (S.view === 'prompts') showPrompts(); } catch (x) { toast(x.message); } };
  }

  // ── settings ──
  function showSettings() {
    setNav('settings'); $('#ttl').textContent = 'Settings & usage'; $('#topRight').innerHTML = '';
    var u = S.usage, st = S.boot.settings;
    $('#view').innerHTML = '<div class="wrap page"><h1>⚙️ Settings &amp; usage</h1>' +
      '<div class="card stack" style="margin-top:14px"><b>This month (' + esc(u.month) + ')</b><div style="font-family:var(--display);font-size:28px">£' + u.spentGbp.toFixed(2) + ' <span class="muted" style="font-family:var(--font);font-size:15px">of £' + Number(u.budgetGbp).toFixed(2) + ' · ' + u.calls + ' replies</span></div><div class="meter' + (u.warn ? ' warn' : '') + '" style="background:#EEE7D8;height:10px"><span style="width:' + u.pct + '%"></span></div><p class="muted">You get a warning at 80%. HQ stops at the budget until you raise it or the month ends. HQ’s spend also shows in Admin → Usage &amp; costs.</p></div>' +
      '<div class="card stack" style="margin-top:12px"><div><label for="bud">Monthly budget (£)</label><input id="bud" type="number" min="1" max="500" step="1" value="' + esc(st.budgetGbp) + '" style="max-width:160px"></div>' +
      '<div><label for="mf">Everyday model</label><input id="mf" value="' + esc(st.fastModel) + '"><p class="muted" style="font-size:13px;margin-top:4px">Cheap and quick — about 0.1p a reply.</p></div>' +
      '<div><label for="ms">Smart model</label><input id="ms" value="' + esc(st.smartModel) + '"><p class="muted" style="font-size:13px;margin-top:4px">Stronger for planning, long documents and tricky questions — about 1–2p a reply.</p></div>' +
      '<div><button class="btn primary" id="stS">Save settings</button></div></div>' +
      '<div class="card" style="margin-top:12px"><b>Coming in the next phases</b><p class="muted" style="margin-top:4px">Scheduled tasks and the 7am daily brief by email (Phase 2) · content calendar and promotions tracker (Phase 3) · live UK research with sources, sponsorship job finder, image creation and downloadable reports (Phase 4).</p></div>' +
      '<div class="row" style="margin-top:16px"><button class="btn ghost" id="so">Sign out</button></div></div>';
    $('#stS').onclick = async function () { try { var r = await api('settings-save', { settings: { budgetGbp: Number($('#bud').value), fastModel: $('#mf').value.trim(), smartModel: $('#ms').value.trim() } }); S.boot.settings = r.settings; S.usage = r.usage; renderUsage(); toast('Settings saved'); showSettings(); } catch (x) { toast(x.message); } };
    $('#so').onclick = async function () { try { await call('studio-admin', 'logout'); } catch (x) {} location.reload(); };
  }

  function sheet(html) { var s = document.createElement('div'); s.className = 'scrim'; s.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; document.body.appendChild(s); s.addEventListener('click', function (e) { if (e.target === s) s.remove(); }); return s; }

  boot();
})();
</script>
</body>
</html>
